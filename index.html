pe=track.voice;osc.frequency.value=track.melody[ix];gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(peak,now+Math.min(.32,duration*.22));gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(ambientMaster);osc.start(now);osc.stop(now+duration+.05);ambientTimer=setTimeout(playNote,track.rhythm[ix%track.rhythm.length])};playNote();ambientAudio.resume?.();return true}catch(e){stopAmbientMusic();return false}}function stopAmbientMusic(){if(ambientTimer){clearTimeout(ambientTimer);ambientTimer=null}if(ambientAudio){let old=ambientAudio;try{if(ambientMaster){ambientMaster.gain.cancelScheduledValues(old.currentTime);ambientMaster.gain.setTargetAtTime(0,old.currentTime,.12)}setTimeout(()=>old.close?.(),500)}catch{}ambientAudio=null;ambientMaster=null}}function setMusicTrack(id){prefs.musicTrack=soundCatalog.some(x=>x.id===id)?id:'soft-piano';savePrefs();if(prefs.music){stopAmbientMusic();startAmbientMusic()}showSettings()}function setMusicVolume(value){prefs.volume=Math.max(0,Math.min(.24,Number(value)||0));savePrefs();if(ambientMaster&&ambientAudio)ambientMaster.gain.setTargetAtTime(prefs.volume,ambientAudio.currentTime,.15)}function playUiChime(){if(!prefs?.soundEffects)return;let C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{let c=ambientAudio||new C(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.13);if(!ambientAudio)setTimeout(()=>c.close?.(),250)}catch{}}function savePrefs(){try{localStorage.setItem('technoempire-preferences',JSON.stringify(prefs))}catch{}}function applyTheme(){document.body?.setAttribute?.('data-theme',prefs.theme||'mist');document.body?.setAttribute?.('data-palette',prefs.palette||'ocean')}function setPalette(palette){prefs.palette=['ocea function render(){applyTheme();document.body?.classList?.toggle('no-motion',!prefs.animations);if(appScreen==='game'&&S.gameOver){$('#app').innerHTML=gameOverScreen();return}if(appScreen==='welcome'){$('#app').innerHTML=welcomeScreen();return}let tabs=[['overview',tx('Обзор','overview')],['products',tx('Проекты','projects')],['markets',tx('Карта мира','map')],['competitors',tx('Конкуренты','competitors')],['office',tx('Офис','office')],['people',tx('Команда','team')],['finance',tx('Финансы','finance')],['help',tx('Помощь','help')]],tab=S.selectedTab;let page=`<header class="topbar"><div class="brand"><div class="logo">N</div><div><h1>${tx('ТЕХНОИМПЕРИЯ','brand')}</h1><small>${esc(S.company)} · ${tx('Управляй будущим','BUILD YOUR FUTURE','建设未来')}</small></div></div><div class="top-actions"><span class="day">📅 ${tx('День','day')} ${S.day}</span><button class="speed ${S.paused?'active':''}" onclick="togglePause()">${S.paused?tx('▶ Продолжить','paused'):tx('⏸ Пауза','pause')}</button><button class="speed ${S.speed===1?'active':''}" onclick="setSpeed(1)">1×</button><button class="speed ${S.speed===2?'active':''}" onclick="setSpeed(2)">2×</button><button class="btn secondary help-btn" onclick="tabTo('help')">${tx('Помощь','help')}</button><button class="btn secondary help-btn" onclick="showSettings()">⚙ ${tx('Настройки','settings')}</button><button class="btn secondary help-btn" onclick="showLanguages()">文/A · ${prefs.language==='ru'?'RU':prefs.language==='zh'?'中文':'EN'}</button><button class="iconbtn" onclick="renameCompany()" title="Переименовать компанию">✏️</button><button class="iconbtn" title="Сохранено автоматически" onclick="save();toast('Игра сохранена')">💾</button><button class="iconbtn" title="Новая игра" onclick="confirmReset()">↻</button></div></header>${metrics()}<div class="layout"><main class="main"><nav class="tabs">${tabs.map(([k,n])=>`<button class="tab ${tab===k?'active':''}" onclick="tabTo('${k}')">${n}</button>`).join('')}</nav><div id="content">${view(tab)}</div></main><aside class="right">${sideNews()}${sideTeam()}</aside></div><div class="footer">${tx('Техноимперия · прототип · прогресс сохраняется автоматически в этом браузере','Techno Empire · autosaved in this browser','科技帝国 · 自动保存在此浏览器')}</div>`;$('#app').innerHTML=localizeMarkup(page)}
function helpView(){let history=S.helpChat||[];return `<section class="panel help-chat-panel"><div class="help-chat-head"><div><div class="eyebrow">Ваш игровой консультант</div><h2>Помощь по компании</h2><p>Задай вопрос сам — помощник разберёт состояние компании и предложит следующий шаг. Он не пишет первым.</p></div><span class="help-status">● Готов помочь</span></div><div class="help-transcript" id="help-transcript">${history.length?history.map(m=>`<div class="chat-message ${m.role==='assistant'?'bot':'user'}"><b>${m.role==='assistant'?'Советник':'Ты'}</b><p>${esc(m.text)}</p></div>`).join(''):`<div class="help-empty"><span>✦</span><b>Спроси, как лучше развивать компанию</b><p>Например: «Что сейчас лучше сделать?» или «Стоит ли открывать офис в Новой Зеландии?»</p></div>`}</div><div class="help-prompts"><button class="smallbtn" onclick="askHelpSuggestion('Что сейчас лучше сделать?')">Что делать дальше?</button><button class="smallbtn" onclick="askHelpSuggestion('Стоит ли открывать офис в Новой Зеландии?')">Оценить офис</button><button class="smallbtn" onclick="askHelpSuggestion('Как провести успешный митинг?')">Митинги</button></div><div class="help-compose"><input id="help-question" type="text" maxlength="240" placeholder="Спроси о деньгах, проектах, офисах или стратегии…" onkeydown="if(event.key==='Enter'){event.preventDefault();submitHelpQuestion()}"><button class="btn" onclick="submitHelpQuestion()">Спросить →</button></div><div class="help-footer">Советник использует данные текущей компании; ответы появляются только после твоего вопроса. <button class="smallbtn" onclick="showTutorial(0)">Открыть обучение</button></div></section>`}
function adviceFor(question){let q=question.toLocaleLowerCase('ru'),net=S.revenue-S.expenses-(S.idlePenalty||0),losing=S.offices.filter(o=>o.open&&(o.dailyRevenue||0)<(o.dailyCost||o.cost)).sort((a,b)=>((a.dailyRevenue||0)-(a.dailyCost||a.cost))-((b.dailyRevenue||0)-(b.dailyCost||b.cost))),unfinished=S.projects.filter(p=>p.progress<100).sort((a,b)=>a.progress-b.progress),pending=S.meetings||[];if(/что сейчас|что делать|что лучше|дальше|совет|стратег/.test(q)){if(S.money<180000)return `Сначала стабилизируй бюджет: на счету ${money(S.money)}, а ежедневный результат компании ${net>=0?'+':''}${money(net)}. Отложи дорогую экспансию, проверь вкладку «Финансы» и сократи расходы у филиала с самым большим убытком.`;if(losing.length)return `Сейчас главный риск — офис в ${losing[0].city}: ${money((losing[0].dailyRevenue||0)-(losing[0].dailyCost||losing[0].cost))} в день. Можно открыть его карточку и реструктурировать за $60 000 или закрыть. Затем развивай проект «${unfinished[0]?.name||S.product}» и заключай клиентские контракты.`;if(pending.length)return `У тебя уже запланирован митинг в ${pending[0].city}. Дай ему пройти, затем оцени итог. Пока команда ждёт, продвинь проект «${unfinished[0]?.name||S.product}» — следующий этап стоит ${money(projectStageCost(unfinished[0]))}.`;if(unfinished.length)return `Рекомендую продвинуть проект «${unfinished[0].name}» (готовность ${unfinished[0].progress}%). Этап стоит ${money(projectStageCost(unfinished[0]))}; запуск проекта добавит доход и выполнит контракт с наградой. После этого выбирай рынок с сильным спросом и положительной экономикой.`;return `Компания выглядит устойчиво: ежедневный результат ${net>=0?'+':''}${money(net)}, репутация ${S.reputation}/100. Проведи клиентский митинг на крупном рынке или выбери новый проект, чтобы открыть следующий этап развития.`}if(/нов(ая|ой|ый)? зеланд|океан|африк|кейптаун|убыт|окуп/.test(q)){let target=S.markets.find(m=>/зеланд|юар/.test(m.country.toLocaleLowerCase('ru')));if(target){let e=officeEconomics(target);return `Для ${target.country} прогноз сейчас: доход ${money(e.dailyRevenue)}/день и расходы ${money(e.dailyCost)}/день — ${e.dailyProfit<0?'убыток':'прибыль'} ${money(Math.abs(e.dailyProfit))}/день. На удалённых рынках добавляются логистические расходы. Изучи рынок до открытия; действующий убыточный офис можно реструктурировать или закрыть.`}}if(/митинг|встреч|переговор/.test(q))return `Выбери страну с высоким спросом и специалистами, затем нажми «Митинг». Встреча стоит около ${money(meetingCost(S.markets.find(m=>m.country==='Япония')))} в Японии и проходит через два игровых дня. Клиентская встреча даёт пользователей и регулярный доход, партнёрская — рост продаж и репутации, встреча по найму — новых сотрудников. Чем выше местный спрос, тем выше шанс успеха.`;if(/проект|продукт|запуск/.test(q)){let p=unfinished[0];return p?`Сейчас быстрее всего продвинуть «${p.name}»: готовность ${p.progress}%, следующий этап стоит ${money(projectStageCost(unfinished[0]))}. Завершение проекта добавит компании доход и даст награду по контракту.`:'Все проекты уже запущены. Создай следующий продукт или вложись в развитие рынков.'}if(/деньг|финанс|бюджет|расход/.test(q))return `Дневная выручка ${money(S.revenue)}, расходы ${money(S.expenses)}, итог ${net>=0?'+':''}${money(net)}. ${losing.length?`Убыточные филиалы: ${losing.map(o=>`${o.city} (${money((o.dailyRevenue||0)-(o.dailyCost||o.cost))}/день)`).join(', ')}. Реструктуризация снижает ежедневные расходы.`:'Сейчас убыточных офисов по прогнозу нет.'} Вкладка «Финансы» покажет динамику и транзакции.`;if(/сотруд|команд|найм|люд/.test(q))return `В компании ${S.team} сотрудников, репутация ${S.reputation}/100. Митинг с повесткой «Команда» помогает найти специалистов на местном рынке; доступность кадров показана в карточке страны. Для точечного найма используй действие «Нанять специалиста» на главной.`;return `Я могу подсказать по финансам, офисам, митингам, найму, проектам и стратегии. Например, спроси: «Что сейчас лучше сделать?» или «Стоит ли открывать офис в Австралии?»`}
function submitHelpQuestion(){let field=$('#help-question'),question=(field?.value||'').trim();if(!question)return;S.helpChat=S.helpChat||[];S.helpChat.push({role:'user',text:question},{role:'assistant',text:adviceFor(question)});S.helpChat=S.helpChat.slice(-24);render();save();let tr=$('#help-transcript');if(tr)tr.scrollTop=tr.scrollHeight}
function askHelpSuggestion(question){let field=$('#help-question');if(field)field.value=question;submitHelpQuestion()}

function view(t){if(t==='help')return helpView();if(t==='overview')return overview();if(t==='products')return products();if(t==='markets')return markets();if(t==='competitors')return competitorView();if(t==='office')return offices();if(t==='people')return people();if(t==='finance')return finance();return overview()}
function overview(){return `${hero()}${contractBoard()}<section class="panel map-panel"><div class="map-title"><div><div class="eyebrow">Глобальная сеть</div><h2>Карта мира · офисы и рынки</h2><p style="color:var(--muted);font-size:11px;margin:5px 0 0">Нажми на город, чтобы посмотреть офис или открыть новый рынок</p></div><button class="btn secondary" onclick="tabTo('markets')">Развернуть карту ↗</button></div>${worldMap()}</section><section class="panel"><div class="panel-head"><div><div class="eyebrow">Портфель проектов</div><h2>В работе прямо сейчас</h2><p>Три команды ведут отдельные продуктовые направления</p></div><button class="btn secondary" onclick="tabTo('products')">Все проекты →</button></div>${projectCards(true)}</section><section class="panel"><div class="panel-head"><div><div class="eyebrow">Решение дня</div><h2>Продвиньте компанию</h2></div></div><div class="grid3"><button class="btn" onclick="startResearch()">🧪 Этап разработки · $45 000</button><button class="btn purple" onclick="startCampaign()">📣 Реклама · $50 000</button><button class="btn gold" onclick="openHiring()">👥 Нанять специалиста</button></div></section>`}
function marketCard(m){return `<article class="market-card" data-search="${esc((m.country+' '+m.city+' '+(m.address||'')).toLocaleLowerCase('ru'))}"><h3>${m.emoji||'🌍'} ${esc(m.city)}</h3><p>${esc(m.country)} · спрос ${m.demand}/100 · специалисты ${m.workers}/100</p><div class="market-foot"><span>${m.opened?`👥 ${fmt(m.clients)} клиентов`:`Открытие ${money(officeOpeningCost(m))}`}</span>${m.opened?`<button class="smallbtn" onclick="mapClick('${esc(m.country)}')">Войти</button>`:`<button class="smallbtn" onclick="openMarket('${esc(m.country)}')">Изучить</button>`}</div>${m.opened?`<small class="market-address">📍 ${esc(m.address||m.country)}</small>`:''}<div class="market-actions"><button class="smallbtn" onclick="meetingModal('${esc(m.country)}')">🤝 Митинг</button>${m.opened?(()=>{let o=S.offices.find(x=>x.country===m.country),p=o?((o.dailyRevenue||0)-(o.dailyCost||o.cost)):0;return `<small class="office-profit ${p<0?'loss':'profit'}">${p<0?'−':'+'}${money(Math.abs(p))}/день</small>`})():''}</div></article>`}
function sideNews(){return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Прямой эфир</div><h2>Новости рынка</h2></div><span class="tag">LIVE</span></div>${S.news.slice(0,4).map(n=>`<div class="news-item"><span class="news-dot ${n.type==='warn'?'warn':n.type==='bad'?'red':''}"></span><p>${esc(n.text)}<small>День ${n.day}</small></p></div>`).join('')}</section>`}
function sideTeam(){return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Лидеры</div><h2>Руководители</h2></div><button class="smallbtn" onclick="tabTo('people')">Команда →</button></div>${S.employees.slice(0,3).map(e=>`<div class="staff-card"><div class="avatar portrait-box">${portrait(e)}</div><div style="flex:1"><h3>${esc(e.name)}</h3><p>${esc(e.role)} · навык ${e.skill}</p></div><span title="Настроение">${e.mood>75?'😊':e.mood>50?'😐':'😟'}</span></div>`).join('')}</section>`}
function products(){return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Портфель направлений</div><h2>Проекты компании</h2><p>У каждого проекта своя команда, этап, бюджет и целевой рынок</p></div><button class="btn" onclick="newProduct()">＋ Новый проект</button></div><div class="filter-row"><button class="filter-chip ${S.projectFocus==='all'?'active':''}" onclick="setProjectFocus('all')">Все проекты</button>${S.projects.map(p=>`<button class="filter-chip ${S.projectFocus===p.id?'active':''}" onclick="setProjectFocus('${p.id}')">${p.icon} ${esc(p.name)}</button>`).join('')}</div>${projectCards(false)}</section><section class="panel"><div class="panel-head"><div><div class="eyebrow">Активный продукт</div><h2>${esc(S.product)} · поколение ${S.productLevel}</h2><p>${S.productFeatures.join(' · ')} · $${S.productPrice}/мес.</p></div><span class="tag good">${fmt(S.users)} пользователей</span></div><div class="grid2"><div class="market-card"><h3>🧪 Этап разработки</h3><div class="project-meta"><span>Прогресс</span><b>${S.productProgress}%</b></div><div class="progress"><i style="width:${S.productProgress}%"></i></div><p>Осталось бюджета ${money(S.productBudget)}</p><button class="btn secondary" onclick="advanceProduct()">Продвинуть этап · $45 000</button></div><div class="market-card"><h3>👥 Клиентский тест</h3><p>Закрытая группа проверит функции, ошибки и готовность клиентов платить.</p><button class="btn purple" onclick="testProduct()">Запустить тест · $30 000</button></div></div></section>`}
function setProjectFocus(id){S.projectFocus=id;render();save()}
function projectStageCost(p){return p.id==='cloud'?80000:p.id==='ai'?125000:p.id==='edge'?175000:115000}
function projectCards(preview){let arr=S.projects||[];if(!preview&&S.projectFocus!=='all')arr=arr.filter(p=>p.id===S.projectFocus);if(preview)arr=arr.slice(0,3);if(!arr.length)return '<div class="empty">В этой категории пока нет проектов</div>';return `<div class="project-grid">${arr.map(p=>`<article class="project-card"><div class="project-top"><div><div class="project-icon">${p.icon}</div><h3>${esc(p.name)}</h3><p>${esc(p.type)} · ${esc(p.market)}</p></div><span class="tag ${p.progress>=70?'good':'warn'}">${esc(p.status)}</span></div><div class="project-meta"><span>Этап ${Math.max(1,Math.ceil(p.progress/25))} из 4</span><b>${p.progress}%</b></div><div class="progress"><i style="width:${p.progress}%"></i></div><div class="project-meta"><span>Команда ${p.team} чел.</span><span>Бюджет ${money(p.budget)}</span></div><button class="btn secondary" onclick="advanceProject('${p.id}')" ${p.progress>=100?'disabled':''}>${p.progress>=100?'✓ Проект завершён':`Продвинуть этап · ${money(projectStageCost(p))}`}</button></article>`).join('')}</div>`}
function advanceProject(id){let p=S.projects.find(x=>x.id===id);if(!p||p.progress>=100)return;let stageCost=projectStageCost(p);if(S.money<stageCost)return toast(`Недостаточно средств: этап стоит ${money(stageCost)}`);S.money-=stageCost;p.budget=Math.max(0,p.budget-stageCost);p.progress=Math.min(100,p.progress+18);p.status=p.progress>=70?'Тестирование':'Разработка';addTransaction('Этап проекта: '+p.name,-stageCost,'🧩');if(p.progress===100){p.status='Запущен';S.revenue+=3500;S.reputation=Math.min(100,S.reputation+2);news(`Проект ${p.name} завершён и готов к запуску.`,'good');toast('Проект готов к запуску!');checkContracts()}else{news(`${p.name}: команда завершила очередной этап работы.`,'good');toast('Этап проекта завершён')}render();save()}
function markets(){let opened=S.markets.filter(m=>m.opened);return `<section class="panel map-panel"><div class="panel-head"><div><div class="eyebrow">Офисы и рынки</div><h2>Глобус «Техноимперии»</h2><p>Вращай стрелками ← → ↑ ↓, нажимай на страны или ищи город</p></div><span class="tag good">${opened.length} офисов · ${S.markets.length} стран</span></div><div class="globe-toolbar"><label class="globe-search">🔎 <input id="globe-search" type="search" placeholder="Найти страну, город или офис…" oninput="filterMarketList(this.value)"></label><div class="globe-controls"><button class="iconbtn" onclick="zoomGlobe(-.15)" title="Уменьшить глобус">−</button><button class="iconbtn zoom-readout" onclick="zoomGlobe(0)" title="Сбросить масштаб">${Math.round((S.globeZoom||1)*100)}%</button><button class="iconbtn" onclick="zoomGlobe(.15)" title="Приблизить глобус">＋</button><button class="iconbtn" onclick="rotateGlobe(-24)" title="Повернуть влево">↶</button><button class="iconbtn" onclick="rotateGlobe(24)" title="Повернуть вправо">↷</button><button class="iconbtn" onclick="tiltGlobe(8)" title="Наклонить вверх · ↑">↑</button><button class="iconbtn" onclick="tiltGlobe(-8)" title="Наклонить вниз · ↓">↓</button></div></div>${worldMap()}<div class="map-summary"><div class="map-stat"><b>${opened.length}</b><span>офисов открыто</span></div><div class="map-stat"><b>${fmt(S.markets.filter(m=>m.opened).reduce((a,m)=>a+m.clients,0))}</b><span>клиентов на рынках</span></div><div class="map-stat"><b>${S.markets.filter(m=>!m.opened).length}</b><span>стран для экспансии</span></div></div></section>${S.meetings?.length?`<section class="panel meeting-panel"><div class="panel-head"><div><div class="eyebrow">🤝 Деловые поездки</div><h2>Запланированные митинги</h2><p>Команда готовится к переговорам в выбранных странах</p></div></div><div class="list">${S.meetings.map(mt=>`<div class="row"><div><b>${esc(mt.city)}, ${esc(mt.country)}</b><p>${mt.agenda==='clients'?'Встреча с клиентами':mt.agenda==='partners'?'Переговоры с партнёрами':'Подбор местной команды'}</p></div><span class="tag">День ${mt.day}</span></div>`).join('')}</div></section>`:''}<section class="panel"><div class="panel-head"><div><div class="eyebrow">Страны и города</div><h2>Где открыть следующий офис</h2><p>Выбери рынок — изучи спрос и стоимость, затем создай местную команду</p></div><button class="btn secondary" onclick="researchMarket()">🔎 Исследовать рынок</button></div><div class="market" id="market-directory">${S.markets.map(marketCard).join('')}</div></section>`}
function globePoint(lat,lon){let phi=(lat+(S.globeTilt||0))*Math.PI/180,lambda=lon*Math.PI/180,frontLambda=(lon-(S.globeRotation||0))*Math.PI/180;return{x:450+220*Math.cos(phi)*Math.sin(lambda),y:270-212*Math.sin(phi),front:Math.cos(phi)*Math.cos(frontLambda)>-.12}}
function worldMap(){let open=S.markets.filter(m=>m.opened),routes=open.slice(1).map(m=>{let a=globePoint(open[0].lat,open[0].lon),b=globePoint(m.lat,m.lon);return `<path class="route" d="M${a.x} ${a.y} Q450 35 ${b.x} ${b.y}"/>`}).join('');let pins=S.markets.map(m=>{let p=globePoint(m.lat,m.lon);return `<g class="office-pin ${m.opened?'':'available'}" opacity="${p.front?'1':'.12'}" style="pointer-events:${p.front?'auto':'none'}" transform="translate(${p.x} ${p.y})" onclick="mapClick('${esc(m.country)}')"><circle r="${m.opened?8:6}"/><circle r="15" fill="none" stroke="${m.opened?'#168d81':'#5c7183'}" stroke-opacity=".4"/><text class="pin-label" x="11" y="-10">${esc(m.city)}${m.opened?' · офис':''}</text></g>`}).join('');return `<svg class="world-map globe-svg" viewBox="0 0 900 540" role="img" aria-label="Вращающийся глобус с офисами и рынками" onwheel="globeWheel(event)"><defs><clipPath id="globeClip"><circle cx="450" cy="270" r="230"/></clipPath><radialGradient id="globeOcean" cx="34%" cy="28%"><stop stop-color="#71afd0"/><stop offset=".62" stop-color="#21658a"/><stop offset="1" stop-color="#09243b"/></radialGradient><radialGradient id="globeShade" cx="35%" cy="28%"><stop offset="55%" stop-color="#fff" stop-opacity="0"/><stop offset="84%" stop-color="#132c44" stop-opacity=".12"/><stop offset="100%" stop-color="#071a30" stop-opacity=".48"/></radialGradient><radialGradient id="globeGlow" cx="30%" cy="23%"><stop stop-color="#fff" stop-opacity=".3"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="globeShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#66869d" flood-opacity=".28"/></filter></defs><rect width="900" height="540" rx="22" fill="#05070b"/><g class="globe-zoom" transform="translate(450 270) scale(${S.globeZoom||1}) translate(-450 -270)"><g class="globe-spin" transform="translate(450 270) rotate(${-(S.globeRotation||0)}) translate(-450 -270)"><g class="globe-auto"><g filter="url(#globeShadow)"><circle cx="450" cy="270" r="234" fill="url(#globeOcean)"/><g clip-path="url(#globeClip)"><g class="globe-fallback-land"><path d="M286 164 302 127 330 110 360 119 373 143 356 163 344 187 318 194 300 181Z"/><path d="M332 204 352 214 363 239 357 267 345 292 337 320 323 306 321 278 309 254 316 229Z"/><path d="M390 143 419 130 448 138 470 132 490 146 511 144 529 158 548 154 560 171 546 186 526 185 517 204 494 207 480 224 460 211 445 199 423 196 416 177 397 169Z"/><path d="M462 215 487 204 511 218 520 242 513 269 501 292 487 315 474 298 466 274 453 251Z"/><path d="M520 126 549 107 583 101 616 113 644 110 675 126 702 145 692 162 667 167 654 184 630 180 613 197 590 188 571 198 554 181 535 175Z"/><path d="M640 320 672 312 702 320 711 339 693 352 663 348Z"/></g><image href="https://svs.gsfc.nasa.gov/vis/a030000/a030600/a030613/blue_marble_apollo_17_19721207_print.jpg" x="220" y="40" width="460" height="460" preserveAspectRatio="xMidYMid slice" onerror="this.style.display='none'"/><g class="globe-latitude"><ellipse cx="450" cy="270" rx="220" ry="68"/><ellipse cx="450" cy="270" rx="220" ry="144"/><ellipse cx="450" cy="270" rx="104" ry="230"/><ellipse cx="450" cy="270" rx="174" ry="230"/></g>${routes}${pins}<circle cx="450" cy="270" r="230" fill="url(#globeShade)" pointer-events="none"/><circle cx="450" cy="270" r="230" fill="url(#globeGlow)" pointer-events="none"/></g><circle cx="450" cy="270" r="231" fill="none" stroke="#fff" stroke-width="2" opacity=".86"/></g></g></g></g><text x="450" y="526" text-anchor="middle" fill="#a7b9cc" font-size="11">Дальняя сторона затемнена · вращай стрелками ← → ↑ ↓ или экранными кнопками</text></svg><div class="map-legend"><span class="tag good">● Офис компании</span><span class="tag">○ Город доступен для открытия</span><span class="tag">↶↷ Поворот глобуса</span></div>`}
function zoomGlobe(delta){S.globeZoom=delta===0?1:Math.max(.8,Math.min(1.65,Math.round(((S.globeZoom||1)+delta)*100)/100));render();save()}function globeWheel(e){e.preventDefault();zoomGlobe(e.deltaY<0?.08:-.08)}function rotateGlobe(deg){S.globeRotation=((S.globeRotation||0)+deg+360)%360;render();save()}function tiltGlobe(deg){S.globeTilt=Math.max(-28,Math.min(28,(S.globeTilt||0)+deg));render();save()}function handleGlobeKeys(e){if(appScreen!=='game'||S.selectedTab!=='markets'||$('#modal-root')?.innerHTML||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;let keys={ArrowLeft:()=>S.globeRotation=((S.globeRotation||0)-14+360)%360,ArrowRight:()=>S.globeRotation=((S.globeRotation||0)+14)%360,ArrowUp:()=>S.globeTilt=Math.min(28,(S.globeTilt||0)+8),ArrowDown:()=>S.globeTilt=Math.max(-28,(S.globeTilt||0)-8)};if(keys[e.key]){e.preventDefault();keys[e.key]();render();save()}}
function filterMarketList(q){let term=q.trim().toLocaleLowerCase('ru');document.querySelectorAll('#market-directory .market-card').forEach(card=>card.style.display=card.dataset.search?.includes(term)?'':'none')}
function mapClick(country){let m=S.markets.find(x=>x.country===country);if(!m)return;if(!m.opened){openMarket(country);return}openOfficeDetail(country)}
function competitorView(){return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Общая карта рынка</div><h2>Конкуренты</h2><p>Следите за новостями, сравнивайте цены и решайте, бороться или объединяться</p></div><span class="tag">${S.competitors.length} активных компаний</span></div><div class="list">${S.competitors.map((c,i)=>`<div class="row"><div class="row-main"><div class="avatar purple">${c.emoji}</div><div><h3>${esc(c.name)}</h3><p>${c.country} · ${c.style} · цена $${c.price}/мес.</p><div class="bar" style="width:180px"><i style="width:${Math.min(100,c.share*3)}%"></i></div><small style="color:var(--muted)">${c.share}% доли рынка</small></div></div><div class="row-actions"><button class="smallbtn" onclick="compete(${i})">Сравнить</button><button class="smallbtn" onclick="acquire(${i})">Обсудить покупку</button></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">Стратегия</div><h2>Рыночные действия</h2><p>Отвечайте на шаги конкурентов подходящим способом</p></div></div><div class="grid3"><button class="btn secondary" onclick="priceResponse()">💰 Настроить цену</button><button class="btn secondary" onclick="startCampaign()">📣 Усилить продвижение</button><button class="btn secondary" onclick="generation()">🧪 Улучшить продукт</button></div></section>`}
function compete(i){let c=S.competitors[i];modal(`Сравнение · ${esc(c.name)}`,`<p>${esc(c.name)} ведёт себя как <b>${esc(c.style)}</b> и удерживает ${c.share}% рынка. Их тариф стоит $${c.price}/мес., ваш — $${S.productPrice}/мес.</p><p>Последние действия конкурента доступны в новостях рынка. Можно привлечь клиентов рекламой, улучшить продукт или изменить цену.</p>`,`<button class="btn secondary" onclick="closeModal()">Понятно</button><button class="btn" onclick="closeModal();startCampaign()">Запустить рекламу</button>`)}function priceResponse(){modal('Цена подписки',`<p>Текущая цена ${esc(S.product)} — $${S.productPrice}/мес. Снижение цены может привлечь больше клиентов, но уменьшит доход с каждого пользователя.</p><button class="choice" onclick="changePrice(2)"><b>💸 Снизить до $${Math.max(5,S.productPrice-3)}</b><span>Повысить конверсию, сократить доход на пользователя</span></button><button class="choice" onclick="changePrice(0)"><b>⚖️ Оставить $${S.productPrice}</b><span>Сохранить текущую стратегию</span></button><button class="choice" onclick="changePrice(-2)"><b>⭐ Повысить до $${S.productPrice+3}</b><span>Увеличить доход, проверить готовность клиентов платить</span></button>`)}function changePrice(dir){S.productPrice=Math.max(5,S.productPrice+(dir===2?-3:dir===-2?3:0));if(dir===2){S.users+=350;S.revenue=Math.max(10000,S.revenue-2200)}if(dir===-2){S.revenue+=1800;S.users=Math.max(1000,S.users-90)}news(`Компания изменила цену ${S.product} на $${S.productPrice}/мес.`);closeModal();render();save();toast('Цена обновлена')}
function acquire(i){let c=S.competitors[i],price=350000+c.share*28000;modal(`Покупка · ${esc(c.name)}`,`<p>Предложите условия сделки. Компания просит <b>${money(price)}</b> за покупку. Оплата проходит сразу.</p><p>После сделки команды постепенно распределятся между отделами, а продукт можно будет объединить с ${esc(S.product)} в общую платформу.</p><p>Покупка добавит долю рынка, клиентов и специалистов, но увеличит ежедневные расходы на содержание команды.</p>`,`<button class="btn secondary" onclick="closeModal()">Вернуться к переговорам</button><button class="btn gold" onclick="buyCompetitor(${i},${price})">Предложить ${money(price)}</button>`)}function buyCompetitor(i,price){if(S.money<price){closeModal();return toast('Не хватает средств для оплаты сделки')}let c=S.competitors[i];S.money-=price;S.marketShare=Math.min(55,S.marketShare+c.share*.55);S.users+=Math.floor(c.share*900);S.team+=12;S.expenses+=5000;S.revenue+=7000;addTransaction('Покупка компании '+c.name,-price,'🏢');news(`${c.name} принята в группу ${S.company}. Команды начнут постепенное объединение.`,'good');S.competitors.splice(i,1);closeModal();render();save();toast('Сделка закрыта; объединение началось')}
function offices(){if(S.activeOffice)return officeDetail();let list=S.offices.filter(o=>o.open);return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Филиалы ${esc(S.company)}</div><h2>Офисы компании</h2><p>Выбери офис в каталоге, чтобы войти внутрь и посмотреть команду и адрес</p></div><button class="btn" onclick="tabTo('markets')">＋ Новый офис</button></div><label class="globe-search office-search">🔎 <input type="search" placeholder="Найти офис, город или страну…" oninput="filterOfficeList(this.value)"></label><div class="office-list-grid" id="office-directory">${list.map(o=>`<article class="office-tile" data-search="${esc((o.city+' '+o.country+' '+o.address).toLocaleLowerCase('ru'))}" onclick="openOfficeDetail('${esc(o.country)}')"><div class="office-tile-top"><div class="office-tile-icon">${o.emoji||'🏢'}</div><span class="tag good">Открыт</span></div><div class="eyebrow">${esc(o.country)}</div><h3>${esc(o.city)}</h3><p class="office-address">📍 ${esc(o.address||'Адрес офиса не указан')}</p><div class="office-tile-foot"><span>👥 ${o.workers} сотрудников</span><span>${money(o.dailyCost||o.cost)} / день</span></div><small class="office-profit ${((o.dailyRevenue||0)-(o.dailyCost||o.cost))<0?'loss':'profit'}">${((o.dailyRevenue||0)-(o.dailyCost||o.cost))<0?'Убыток':'Прибыль'} ${money(Math.abs((o.dailyRevenue||0)-(o.dailyCost||o.cost)))}/день</small><button class="btn secondary" onclick="event.stopPropagation();openOfficeDetail('${esc(o.country)}')">Войти в офис →</button></article>`).join('')}</div></section>`}

function officeDetail(){let o=S.offices.find(x=>x.country===S.activeOffice&&x.open);if(!o)return `<section class="panel"><button class="btn secondary" onclick="closeOfficeDetail()">← К списку офисов</button><p>Офис не найден.</p></section>`;return `<section class="panel"><button class="btn secondary" onclick="closeOfficeDetail()">← Все офисы</button><div class="office-detail-head"><div><div class="eyebrow">${esc(o.country)} · ${esc(o.city)}</div><h2 style="font:800 26px Manrope;margin:5px 0 8px">${o.emoji||'🏢'} Офис в ${esc(o.city)}</h2><p class="office-address-large">📍 ${esc(o.address||'Адрес офиса не указан')}</p></div><span class="tag ${((o.dailyRevenue||0)-(o.dailyCost||o.cost))<0?'bad':'good'}">${((o.dailyRevenue||0)-(o.dailyCost||o.cost))<0?'Убыточный офис':'Офис работает'}</span></div><div class="office-scene office-scene-large style-${o.style||'calm'}"><div class="office-illustration-wrap">${officeIllustration()}</div><span class="office-avatar oa1">${portrait(S.employees[0])}</span><span class="office-avatar oa2">${portrait(S.employees[1]||S.employees[0])}</span><span class="office-avatar oa3">${portrait(S.employees[2]||S.employees[0])}</span><span class="scene-caption">14:30 · ${esc(o.city)} · Рабочее пространство команды</span></div><div class="office-customizer"><div><div class="eyebrow">Дизайн пространства</div><h3>Кастомизация офиса</h3><p>Обнови интерьер филиала: новый стиль меняет оформление и помогает поднять настроение команды.</p></div><div class="office-style-options">${[['calm','Спокойный океан','#62bad0'],['green','Зелёный сад','#70b77c'],['warm','Тёплое дерево','#d59a61'],['violet','Ночной неон','#9b83e8']].map(([id,label,color])=>`<button class="office-style ${o.style===id?'selected':''}" style="--swatch:${color}" onclick="setOfficeStyle('${esc(o.country)}','${id}')"><i></i>${label}${o.style===id?' · выбрано':''}</button>`).join('')}</div><small>Смена дизайна: ${money(180000)}</small></div><div class="grid3" style="margin-top:14px"><div class="map-stat"><b>${o.workers}<span>местных сотрудников</span></div><div class="map-stat"><b>${money(o.cost)}</b><span>расходы офиса в день · доход ${money(o.dailyRevenue||0)}</span></div><div class="map-stat"><b>${o.market||70}/100</b><span>потенциал рынка</span></div></div><div class="office-management"><button class="btn secondary" onclick="meetingModal('${esc(o.country)}')">🤝 Назначить митинг в ${esc(o.country)}</button>${((o.dailyRevenue||0)-(o.dailyCost||o.cost))<0?`<button class="btn gold" onclick="restructureOffice('${esc(o.country)}')" ${o.restructured?'disabled':''}>🛠️ ${o.restructured?'Офис уже реструктурирован':'Снизить расходы · $150 000'}</button>`:''}<button class="smallbtn close-office-btn" onclick="askCloseOffice('${esc(o.country)}')">Закрыть офис</button></div><div class="panel-head" style="margin-top:20px"><div><div class="eyebrow">Люди в офисе</div><h2>Руководители и сотрудники</h2><p>Нажми на сотрудника, чтобы поговорить или дать поручение</p></div><button class="btn secondary" onclick="openHiring()">＋ Нанять</button></div><div class="grid3">${S.employees.map(e=>`<button class="row" style="justify-content:flex-start" onclick="employeeModal('${esc(e.name)}')"><span class="office-row-face">${portrait(e)}</span><span style="font-size:10px;text-align:left"><b>${esc(e.name)}</b><br><span style="color:var(--muted)">${esc(e.role)} · навык ${e.skill} · ${e.mood>75?'😊':'😐'}</span></span></button>`).join('')}</div></section>`}
function setOfficeStyle(country,style){let o=S.offices.find(x=>x.country===country&&x.open);if(!o)return;if(o.style===style)return toast('Этот стиль уже установлен');let cost=180000;if(S.money<cost)return toast('Для смены интерьера нужно '+money(cost));S.money-=cost;o.style=style;addTransaction('Кастомизация офиса · '+o.city,-cost,'🎨');news('Обновлён интерьер офиса в '+o.city+'.','good');render();save();toast('Новый дизайн офиса готов')}
function openOfficeDetail(country){S.activeOffice=country;S.selectedTab='office';render();save()}
function closeOfficeDetail(){S.activeOffice=null;render();save()}
function filterOfficeList(q){let term=q.trim().toLocaleLowerCase('ru');document.querySelectorAll('#office-directory .office-tile').forEach(card=>card.style.display=card.dataset.search?.includes(term)?'':'none')}
function people(){return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Люди — сила компании</div><h2>Команда и сотрудники</h2><p>Распределяйте бюджеты отделам, развивайте навыки и поддерживайте настроение</p></div><button class="btn" onclick="openHiring()">＋ Нанять</button></div><div class="list">${S.employees.map(e=>`<div class="row"><div class="row-main"><div class="avatar portrait-box">${portrait(e)}</div><div><h3>${esc(e.name)} · ${esc(e.role)}</h3><p>Навыки ${e.skill}/100 · Настроение ${e.mood}% · зарплата ${money(e.salary||400)}/день</p></div></div><div class="row-actions"><button class="smallbtn" onclick="train('${esc(e.name)}')">🎓 Обучить · $80 000</button><button class="smallbtn" onclick="employeeModal('${esc(e.name)}')">Поговорить</button></div></div>`).join('')}</div><div class="grid2" style="margin-top:14px"><button class="btn secondary" onclick="bonus()">⭐ Премия сотруднику · $15 000</button><button class="btn secondary" onclick="raise()">📈 Рассмотреть повышение</button></div></section>`}
function finance(){let net=S.revenue-S.expenses-(S.idlePenalty||0);return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Финансовый штаб</div><h2>Финансы компании</h2><p>Откройте полный отчёт, чтобы видеть доходы, расходы и прогноз на несколько месяцев</p></div><button class="btn secondary" onclick="financeReport()">Обновить отчёт</button></div><div class="grid3"><div class="market-card"><div class="eyebrow">Доход / день</div><h3 style="font-size:19px;color:var(--green)">${money(S.revenue)}</h3><p>Продукты и подписки</p></div><div class="market-card"><div class="eyebrow">Расход / день</div><h3 style="font-size:19px;color:var(--gold)">${money(S.expenses)}</h3><p>Команда, офисы, разработка, реклама${S.idlePenalty?` · штраф за бездействие ${money(S.idlePenalty)}/день`:''}</p></div><div class="market-card"><div class="eyebrow">Чистый результат</div><h3 style="font-size:19px;color:${net>=0?'var(--cyan)':'var(--red)'}">${money(net)}</h3><p>Прогноз: ${money(S.money+net*30)} через месяц · бездействие ${S.idleDays||0} дн.</p></div></div><div class="panel" style="margin:14px 0 0;background:#111a2a"><div class="panel-head"><div><div class="eyebrow">Денежный поток</div><h2 style="font-size:14px">Операционный результат</h2></div><span class="tag ${net>=0?'good':'bad'}">${net>=0?'Устойчиво':'Требует внимания'}</span></div>${chart()}</div></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">План действий</div><h2>Инструменты финансового управления</h2></div></div><div class="grid3"><button class="btn secondary" onclick="loan()">🏦 Запросить кредит</button><button class="btn secondary" onclick="investor()">🤝 Найти инвестора</button><button class="btn secondary" onclick="cutBudget()">✂️ Пересмотреть бюджет</button></div></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">История</div><h2>Последние операции</h2></div></div>${S.transactions.length?`<div class="list">${S.transactions.slice(0,5).map(t=>`<div class="row"><div class="row-main"><span>${t.icon}</span><div><h3>${esc(t.text)}</h3><p>День ${t.day}</p></div></div><b style="color:${t.amount>=0?'var(--green)':'var(--gold)'}">${money(t.amount)}</b></div>`).join('')}</div>`:'<div class="empty">Операции появятся здесь</div>'}</section>`}
function officeOpeningCost(m){return 900000+m.cost*6200}function marketStudyCost(m){return 50000+Math.round(m.cost*160)}function officeEconomics(m){let remote=['ЮАР','Австралия','Новая Зеландия'].includes(m.country),dailyRevenue=Math.round(m.demand*700),dailyCost=Math.round(m.cost*570+m.workers*150+(remote?10000:0));return{dailyRevenue,dailyCost,dailyProfit:dailyRevenue-dailyCost,remote}}
function meetingCost(m){return 6500+Math.round(m.cost*115)}
function meetingModal(country){let m=S.markets.find(x=>x.country===country);if(!m)return;let cost=meetingCost(m),agenda=[['clients','Клиенты','Обсудить пилотные проекты и привлечь заказчиков.'],['partners','Партнёры','Найти местного партнёра и каналы продаж.'],['talent','Команда','Провести встречи с кандидатами в местную команду.']];modal(`Митинг · ${m.city}, ${m.country}`,`<p>Организуй встречу с местными компаниями. Поездка и площадка стоят <b>${money(cost)}</b>. Итог встречи зависит от спроса и доступности специалистов в регионе.</p><p>Спрос: ${m.demand}/100 · специалисты: ${m.workers}/100</p>`,`<button class="btn secondary" onclick="closeModal()">Отмена</button>${agenda.map(([id,title,desc])=>`<button class="btn" onclick="scheduleMeeting('${esc(country)}','${id}')">🤝 ${title}<small style="display:block;font-weight:400">${desc}</small></button>`).join('')}`)}
function scheduleMeeting(country,agenda){let m=S.markets.find(x=>x.country===country),cost=meetingCost(m);if(!m)return;if(S.money<cost){closeModal();return toast('Недостаточно средств на поездку и проведение митинга')}S.money-=cost;let names={clients:'Клиенты',partners:'Партнёры',talent:'Команда'};S.meetings=S.meetings||[];S.meetings.push({country,city:m.city,agenda,day:S.day+2,cost});addTransaction(`Митинг в ${m.city}: ${names[agenda]}`,-cost,'🤝');news(`Подготовка к митингу в ${m.city}: делегация отправится через два игровых дня.`,'normal');closeModal();render();save();toast('Митинг запланирован на день '+(S.day+2))}
function resolveMeetings(){if(!S.meetings?.length)return;let due=S.meetings.filter(x=>x.day<=S.day);S.meetings=S.meetings.filter(x=>x.day>S.day);for(let mt of due){let m=S.markets.find(x=>x.country===mt.country);if(!m)continue;let chance=Math.min(.88,.3+m.demand*.004+m.workers*.001+(mt.agenda==='talent'?.08:0)),success=Math.random()<chance;if(success){S.meetingsWon=(S.meetingsWon||0)+1;if(mt.agenda==='clients'){let gained=900+Math.round(m.demand*27);S.users+=gained;S.revenue+=Math.round(1200+m.demand*20);S.reputation=Math.min(100,S.reputation+1);news(`Митинг в ${mt.city} прошёл успешно: новые заказчики и ${fmt(gained)} потенциальных пользователей.`,'good')}else if(mt.agenda==='partners'){S.revenue+=Math.round(1800+m.demand*22);S.reputation=Math.min(100,S.reputation+2);news(`В ${mt.city} найден местный партнёр. Продажи и репутация компании выросли.`,'good')}else{S.team+=3;S.expenses+=4800;news(`Митинг в ${mt.city} помог найти трёх подходящих специалистов. Расходы на команду выросли.`,'good')}}else{news(`Митинг в ${mt.city} не дал ожидаемого результата. Команда зафиксировала причины и подготовит другой подход.`,'warn')}}checkContracts()}
function restructureOffice(country){let o=S.offices.find(x=>x.country===country&&x.open);if(!o||o.restructured)return;if(S.money<150000)return toast('Реструктуризация стоит $150 000');let cut=Math.round(o.dailyCost*.24);o.dailyCost-=cut;o.cost=o.dailyCost;o.workers=Math.max(3,o.workers-2);S.team=Math.max(1,S.team-2);S.expenses=Math.max(0,S.expenses-cut);o.restructured=true;addTransaction(`Оптимизация офиса: ${o.city}`,-150000,'🛠️');S.money-=150000;news(`Офис в ${o.city} сократил ежедневные расходы на ${money(cut)} после реструктуризации.`,'good');render();save();toast('Расходы офиса снижены')}
function askCloseOffice(country){let o=S.offices.find(x=>x.country===country&&x.open);if(!o)return;modal(`Закрыть офис · ${o.city}?`,`<p>Офис приносит ${money(o.dailyRevenue||0)} дохода и обходится в ${money(o.dailyCost||o.cost)}/день. Закрытие остановит эти доходы и расходы. Команду придётся сократить.</p>`,`<button class="btn secondary" onclick="closeModal()">Оставить офис</button><button class="btn gold" onclick="divestOffice('${esc(country)}')">Закрыть офис</button>`)}
function divestOffice(country){let o=S.offices.find(x=>x.country===country&&x.open);if(!o)return;S.revenue=Math.max(0,S.revenue-(o.dailyRevenue||0));S.expenses=Math.max(0,S.expenses-(o.dailyCost||o.cost));S.team=Math.max(1,S.team-(o.workers||0));S.offices=S.offices.filter(x=>x!==o);let m=S.markets.find(x=>x.country===country);if(m)m.opened=false;S.activeOffice=null;S.selectedTab='office';addTransaction(`Закрытие офиса: ${o.city}`,0,'🏢');news(`Офис в ${o.city} закрыт. Ежедневные доходы и расходы больше не начисляются.`,'warn');closeModal();render();save()}

const contractData=[{id:'expand',title:'Открыть третий офис',desc:'Расширь сеть ещё на один рынок',goal:1,reward:35000,progress:()=>Math.max(0,S.offices.filter(o=>o.open).length-2)},{id:'meeting',title:'Заключить сделку на митинге',desc:'Проведи успешную встречу с клиентами или партнёрами',goal:1,reward:22000,progress:()=>S.meetingsWon||0},{id:'launch',title:'Вывести первый проект',desc:'Доведи любой проект до запуска',goal:1,reward:65000,progress:()=>S.projects.filter(p=>p.progress>=100).length}];
function checkContracts(){S.contractsClaimed=S.contractsClaimed||[];let changed=false;for(let c of contractData){if(!S.contractsClaimed.includes(c.id)&&c.progress()>=c.goal){S.contractsClaimed.push(c.id);S.money+=c.reward;S.reputation=Math.min(100,S.reputation+2);news(`Контракт выполнен: «${c.title}». Награда ${money(c.reward)} и +2 к репутации.`,'good');toast(`Контракт выполнен · +${money(c.reward)}`);changed=true}}return changed}
function contractBoard(){let done=S.contractsClaimed||[];return `<section class="panel contract-panel"><div class="panel-head"><div><div class="eyebrow">🎯 Цели для роста</div><h2>Контракты и награды</h2><p>Выполняй задачи, чтобы получать бонусы и открывать новые возможности</p></div><span class="tag good">${done.length}/${contractData.length} выполнено</span></div><div class="contract-grid">${contractData.map(c=>{let value=Math.min(c.goal,c.progress()),complete=done.includes(c.id);return `<article class="contract-card ${complete?'complete':''}"><div class="contract-icon">${complete?'✓':c.id==='expand'?'🌍':c.id==='meeting'?'🤝':'🚀'}</div><div class="contract-info"><b>${c.title}</b><p>${c.desc}</p><div class="progress"><i style="width:${complete?100:Math.round(value/c.goal*100)}%"></i></div><small>${complete?'Выполнено':`${value}/${c.goal}`} · награда ${money(c.reward)}</small></div></article>`}).join('')}</div></section>`}

function tabTo(t){S.selectedTab=t;render();save()}function addTransaction(text,amount,icon='💰'){S.transactions.unshift({text,amount,icon,day:S.day});S.transactions=S.transactions.slice(0,12)}
function modal(title,body,actions=''){let root=$('#modal-root');root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}<div class="modal-actions">${actions||'<button class="btn secondary" onclick="closeModal()">Закрыть</button>'}</div></div></div>`}function closeModal(){$('#modal-root').innerHTML=''}
function confirmReset(){modal(tx('Начать новую компанию?','Start a new company?','开始新公司？'),`<p>${tx('Начать новую игру? Сохранение останется доступно кнопкой «Продолжить».','Start a new run? Your existing save will remain available with Continue.','开始新的游戏吗？现有存档仍可通过继续游戏打开。')}</p>`,`<button class="btn secondary" onclick="closeModal()">${tx('Отмена','Cancel','取消')}</button><button class="btn" onclick="beginNewGame()">${tx('Начать заново','Start over','重新开始')}</button>`)}

{tab:'overview',title:{ru:'Это твой штаб',en:'Your company dashboard',zh:'你的公司总览'},text:{ru:'Верхние карточки показывают деньги, клиентов, сотрудников, репутацию и долю рынка. Справа идут новости и сигналы руководителей. Игровые дни идут сами: «Пауза» останавливает события, а 1× и 2× меняют темп.',en:'The top cards show cash, customers, staff, reputation, and market share. News and manager updates appear on the right. Game days advance automatically: Pause stops them; 1× and 2× change the pace.',zh:'顶部卡片显示资金、客户、员工、声誉和市场份额。右侧显示新闻与主管消息。游戏日期会自动推进；暂停可停止，1× 和 2× 可调整速度。'}},
{tab:'products',title:{ru:'Проекты — это твои продукты',en:'Projects are your products',zh:'项目就是你的产品'},text:{ru:'Открой отдельную вкладку проекта, чтобы увидеть его бюджет, команду и этапы. Нажимай «Продвинуть этап», чтобы вложить деньги и сдвинуть работу. Новый проект запускается кнопкой справа вверху.',en:'Choose a project tab to see its budget, team, and milestones. Use Advance stage to invest money and move work forward. Create a new project with the button in the upper-right.',zh:'切换项目标签可查看预算、团队和阶段。点击“推进阶段”投入资金并推动进度。使用右上角按钮创建新项目。'}},
{tab:'markets',title:{ru:'Глобус и новые рынки',en:'The globe and new markets',zh:'地球与新市场'},text:{ru:'Поворачивай глобус стрелками ← → ↑ ↓ на клавиатуре или экранными кнопками. Ищи страну, город или адрес в строке поиска. Нажми на город: изучи рынок, затем открой офис. Каждый новый филиал добавляет сотрудников, клиентов и расходы.',en:'Rotate the globe with ← → ↑ ↓ or the on-screen arrows. Search by country, city, or address. Select a city to study the market and open an office. Each branch adds staff, customers, and operating costs.',zh:'使用键盘 ← → ↑ ↓ 或屏幕箭头旋转地球。可按国家、城市或地址搜索。选择城市后先研究市场，再开设办公室。每个新分部都会增加员工、客户和运营成本。'}},
{tab:'office',title:{ru:'Войди в свой офис',en:'Step inside an office',zh:'进入办公室'},text:{ru:'Вкладка «Офис» — каталог филиалов. Нажми на большую карточку города, чтобы попасть внутрь. Там видны улица и страна, сотрудники, расходы и рабочее пространство. Нажми на фото человека, чтобы поговорить или дать поручение.',en:'The Offices tab is your branch directory. Select a city card to enter. You can see the street address, country, team, expenses, and workspace. Select a person’s portrait to talk or assign a task.',zh:'“办公室”标签页是分部目录。点击城市卡片即可进入。你可以查看街道地址、国家、团队、费用和工作空间。点击员工照片可交谈或分配任务。'}},
{tab:'people',title:{ru:'Нанимай и развивай людей',en:'Hire and develop people',zh:'招聘并培养员工'},text:{ru:'Вкладка «Команда» — найм, обучение, бонусы и повышения. Смотри на навыки и настроение сотрудников. Руководители рекомендуют решения, а ты утверждаешь бюджет и планы.',en:'The Team tab handles hiring, training, bonuses, and promotions. Watch employee skills and mood. Managers recommend actions; you approve budgets and plans.',zh:'“团队”标签页用于招聘、培训、奖金和晋升。关注员工技能与情绪。主管会提出建议，由你批准预算和计划。'}},
{tab:'finance',title:{ru:'Деньги, новости и кризисы',en:'Money, news, and crises',zh:'资金、新闻与危机'},text:{ru:'Во вкладке «Финансы» проверяй прибыль, расходы и прогноз. Если приходит срочное событие, открой подробности и выбери план. Игра сохраняется автоматически. Если захочешь освежить управление — вернись на главную и открой «Помощь».',en:'Use Finance to review profit, expenses, and forecasts. When an urgent event appears, open its details and choose a response. The game saves automatically. Reopen Help from the dashboard whenever you need a refresher.',zh:'在“财务”页查看利润、支出和预测。出现紧急事件时，打开详情并选择应对方案。游戏会自动保存。需要复习时，可在总览页再次打开“帮助”。'}}];
function showTutorial(step=0){if(step===0)S.tutorialWasPaused=S.paused;S.paused=true;step=Math.max(0,Math.min(tutorialPages.length-1,step));S.tutorialStep=step;let p=tutorialPages[step],lang=prefs.language;S.selectedTab=p.tab;render();save();modal(tx('Знакомство с игрой','Game tutorial','游戏教程'),`<div class="tutorial-badge">${tx('ПОЛНЫЙ ТУР · ШАГ','FULL TOUR · STEP','完整教程 · 步骤')} ${step+1} / ${tutorialPages.length}</div><h3 style="font:700 17px Manrope;margin:0 0 8px">${p.title[lang]}</h3><p>${p.text[lang]}</p><div class="progress"><i style="width:${Math.round((step+1)/tutorialPages.length*100)}%"></i></div>`,`<div class="tutorial-actions"><button class="tutorial-skip" onclick="skipTutorial()">${tx('Пропустить тур','Skip tutorial','跳过教程')}</button><button class="btn" onclick="tutorialNext()">${step===tutorialPages.length-1?tx('Завершить','Finish','完成'):tx('Дальше →','Next →','下一步 →')}</button></div>`)}
function tutorialNext(){let n=(S.tutorialStep||0)+1;if(n>=tutorialPages.length){S.onboarded=true;S.paused=S.tutorialWasPaused??false;delete S.tutorialWasPaused;save();closeModal();toast(tx('Тур завершён — удачной игры!','Tutorial complete. Have fun!','教程完成，祝你玩得开心！'));return}showTutorial(n)}
function skipTutorial(){S.onboarded=true;S.paused=S.tutorialWasPaused??false;delete S.tutorialWasPaused;save();closeModal()}
function scenarioModal(){modal('Выберите сценарий',`<p>У каждого сценария своя большая цель. В бесконечном режиме можно развивать компанию сколько угодно.</p><button class="choice" onclick="newScenario('Технологический рывок','Открыть рынок Японии и довести долю рынка до 12%')"><b>🚀 Технологический рывок</b><span>Вывести продукт на рынок Японии и обойти конкурентов</span></button><button class="choice" onclick="newScenario('Антикризисный менеджмент','Стабилизировать компанию после резкого падения доходов')"><b>🛡️ Антикризисный менеджмент</b><span>Пережить финансовый и кадровый кризис</span></button><button class="choice" onclick="newScenario('Глобальное лидерство','Открыть 4 рынка и стать самой дорогой технокомпанией')"><b>🌍 Глобальное лидерство</b><span>Расшириться по миру и добиться лидерства</span></button><button class="choice" onclick="newScenario('Бесконечный режим','Самостоятельно выбрать цель и развивать компанию без конца')"><b>♾️ Бесконечный режим</b><span>Играйте сколько хотите и ставьте собственные рубежи</span></button>`)}function newScenario(name,goal){S=initial();S.onboarded=true;S.scenario=name;S.scenarioGoal=goal;news(`Начался сценарий «${name}». Команда ждёт первого решения.`);save();closeModal();render();toast('Новый сценарий начался')}
function employeeModal(name){let e=S.employees.find(x=>x.name===name);if(!e)return;S.zoomEmployee=name;modal(`${esc(e.name)}`,`<div class="person-profile"><span class="person-profile-face">${portrait(e)}</span><b>${esc(e.role)}</b></div><p>Навык ${e.skill}/100 · настроение ${e.mood}%</p><p>«Сейчас наша команда сосредоточена на улучшении Nova Cloud. Я могу предложить следующий шаг, если хотите».</p><div class="grid2"><button class="choice" onclick="employeeAction('Попросить план действий')"><b>💬 Попросить план действий</b><span>Руководитель подготовит рекомендации</span></button><button class="choice" onclick="employeeAction('Поручить срочную задачу')"><b>🎯 Поручить задачу</b><span>Команда переключит часть ресурсов</span></button></div>`)}function employeeAction(text){closeModal();news(`${text}: ${S.zoomEmployee} подготовит ответ к следующему отчёту.`);toast('Поручение передано руководителю');render();save()}

{name:'Ной Уильямс',role:'Инженер интерфейсов',skill:79,cost:3900,id:9},{name:'Лейла Хаддад',role:'Финансовый аналитик',skill:85,cost:4600,id:10},{name:'Лукас Новак',role:'DevOps-инженер',skill:91,cost:5400,id:11},
{name:'Алия Окафор',role:'Маркетолог',skill:77,cost:3600,id:12},{name:'Томас Келлер',role:'Архитектор систем',skill:93,cost:6200,id:13},{name:'Мэй Линь',role:'UX-дизайнер',skill:84,cost:4300,id:14},
{name:'Инес Коста',role:'Менеджер проектов',skill:81,cost:4100,id:15},{name:'Даниэль Рейес',role:'Специалист по безопасности',skill:89,cost:5700,id:16},{name:'Фатима Али',role:'Исследователь рынка',skill:80,cost:3800,id:17}
];modal(tx('Подбор специалиста','Hire a specialist','招聘员工'),`<p>${tx('Разовый сбор за найм: '+money(150000)+'. Затем списывается зарплата каждый игровой день. В каталоге 12 уникальных кандидатов.','One-time hiring fee: '+money(150000)+'. Salary is charged each game day. Browse 12 unique candidates.','一次性招聘费：'+money(150000)+'。之后每天支付工资。共有 12 位候选人。')}</p><div class="candidate-directory">${candidates.filter(c=>!S.employees.some(e=>e.name===c.name)).map(c=>`<button class="choice candidate-choice" onclick="hireCandidate('${c.name}','${c.role}',${c.skill},${c.cost},${c.id})"><span class="candidate-face">${portrait({name:c.name,photo:portraitPool[c.id]})}</span><span><b>${esc(c.name)} · ${esc(c.role)}</b><span>${tx('Навык','Skill','技能')} ${c.skill} · ${tx('зарплата','salary','薪资')} ${money(c.cost)}/${tx('день','day','天')}</span></span><span class="candidate-add">＋</span></button>`).join('')||'<div class="empty">Все кандидаты наняты. Пополните каталог после нескольких игровых дней.</div>'}</div>`)}
function hireCandidate(name,role,skill,cost,photoId){let photo=nextStaffPortrait(photoId);let existing=S.employees.some(e=>e.name===name);if(existing){closeModal();return toast(tx('Этот кандидат уже работает в компании','This candidate already works here','该候选人已在公司任职'))}let hiringFee=150000;if(S.money<hiringFee)return closeModal(),toast(`Найм требует ${money(hiringFee)} разово`);S.money-=hiringFee;S.team++;S.employees.push({name,role,skill,photo,mood:78,salary:cost,officeCountry:S.activeOffice||S.offices.find(o=>o.open)?.country||'США'});S.expenses+=cost;addTransaction('Найм: '+role,-hiringFee,'👥');news(`В команду принят новый специалист: ${role}.`);closeModal();render();save();toast(tx('Новый сотрудник принят','New employee hired','新员工已入职'))}
function advanceProduct(){startResearch()}function startResearch(){let cost=90000;if(S.money<cost)return toast(`Этап разработки стоит ${money(cost)}`);S.money-=cost;S.productBudget=Math.max(0,S.productBudget-cost);S.productProgress=Math.min(100,S.productProgress+17);addTransaction('Этап разработки Nova Cloud',-cost,'🧪');if(S.productProgress>=100){S.productProgress=0;S.productLevel++;S.reputation=Math.min(100,S.reputation+3);news(`Выпущено поколение ${S.productLevel} продукта ${S.product}!`,'good');toast('Новое поколение готово!')}else{news('Команда завершила этап разработки и приблизилась к обновлению.','good');toast('Этап разработки завершён')}render();save()}
function testProduct(){let cost=30000;if(S.money<cost)return toast(`Тестирование стоит ${money(cost)}`);S.money-=cost;S.users+=Math.floor(S.users*.025);S.reputation=Math.min(100,S.reputation+2);S.productProgress=Math.min(100,S.productProgress+5);addTransaction('Закрытый тест продукта',-cost,'🧪');news('Тестовая группа одобрила синхронизацию; клиенты просят улучшить импорт данных.','good');render();save();toast('Отчёт тестирования готов')}
function newProduct(){modal('Выберите направление продукта',`<p>Создайте новое направление. Команда подготовит концепцию и оценку рынка.</p><button class="choice" onclick="createProduct('Nova AI','🤖',650000)"><b>🤖 Nova AI</b><span>Ассистент для команд · высокий спрос · инвестиции $650 000</span></button><button class="choice" onclick="createProduct('Nova Devices','📱',975000)"><b>📱 Nova Devices</b><span>Устройства для бизнеса · средний спрос · инвестиции $975 000</span></button><button class="choice" onclick="createProduct('Nova Connect','🌐',550000)"><b>🌐 Nova Connect</b><span>Платформа интеграций · высокий спрос · инвестиции $550 000</span></button>`)}function createProduct(n,icon,cost=550000){if(S.money<cost){closeModal();return toast(`На запуск нужно ${money(cost)}`)}S.money-=cost;S.product=n;S.productLevel=1;S.productProgress=0;S.productBudget=cost;S.productFeatures=['Базовая версия','Закрытое тестирование'];S.projects.push({id:'new'+S.day+S.projects.length,name:n,type:'Новая продуктовая линия',icon,progress:0,budget:cost,team:6,status:'Разработка',market:'Глобальный запуск'});addTransaction('Запуск продукта '+n,-cost,icon);news(`Компания начала разработку продукта ${n}.`);closeModal();tabTo('products');toast('Новое направление запущено')}
function featureModal(){modal('Новая функция',`<p>Выберите улучшение для следующего поколения ${esc(S.product)}.</p><button class="choice" onclick="addFeature('AI-помощник',75000)"><b>🤖 AI-помощник</b><span>Больше ценности для команд · $75 000</span></button><button class="choice" onclick="addFeature('Расширенная безопасность',55000)"><b>🛡️ Расширенная безопасность</b><span>Укрепляет доверие клиентов · $55 000</span></button><button class="choice" onclick="addFeature('Инструменты совместной работы',60000)"><b>🤝 Инструменты совместной работы</b><span>Улучшает командные процессы · $60 000</span></button>`)}function addFeature(f,c){if(S.money<c){closeModal();return toast('Недостаточно средств')}S.money-=c;S.productFeatures.push(f);S.productProgress=Math.min(100,S.productProgress+8);addTransaction('Разработка функции: '+f,-c,'🧩');closeModal();render();save();toast('Функция добавлена в план')}
function launchProduct(){if(S.productProgress<70)return toast('Сначала завершите больше этапов разработки');modal('Запуск продукта',`<p>Подготовьте запуск ${esc(S.product)} на выбранных рынках.</p><button class="choice" onclick="launchNow()"><b>🌍 США и Германия</b><span>Узнаваемый рынок · $25 000 на кампанию</span></button><button class="choice" onclick="launchJapan()"><b>🇯🇵 Япония</b><span>Высокий спрос · $42 000 на локализацию и запуск</span></button>`)}function launchNow(){if(S.money<25000)return closeModal(),toast('Недостаточно средств на запуск');S.money-=25000;S.users+=2000;S.revenue+=12000;S.reputation=Math.min(100,S.reputation+4);S.productProgress=0;addTransaction('Запуск продукта на рынках США и Германии',-25000,'🚀');news(`${S.product} запущен в США и Германии. Первые клиенты уже подключаются.`,'good');closeModal();render();save();toast('Продукт запущен!')}function launchJapan(){closeModal();openMarket('Япония')}
function generation(){let generationCost=300000;if(S.money<generationCost)return toast(`Новое поколение стоит ${money(generationCost)}`);modal('Новое поколение продукта',`<p>Переведите ${esc(S.product)} на более современные технологии и улучшенные функции.</p>`,`<button class="btn secondary" onclick="closeModal()">Позже</button><button class="btn" onclick="makeGeneration()">Начать · $750 000</button>`)}function makeGeneration(){let generationCost=750000;S.money-=generationCost;S.productLevel++;S.productProgress=0;S.productBudget=750000;S.reputation=Math.min(100,S.reputation+2);addTransaction('Новое поколение '+S.product,-generationCost,'🚀');news(`Начата разработка поколения ${S.productLevel} продукта.`);closeModal();render();save();toast('Новое поколение в разработке')}
function openMarket(country){let m=S.markets.find(x=>x.country===country);if(!m)return;if(m.opened){toast('Этот рынок уже открыт');return}let econ=officeEconomics(m),profit=econ.dailyProfit;modal(`Изучение рынка · ${m.country}`,`<p><b>${m.city}</b> · спрос ${m.demand}/100 · доступность специалистов ${m.workers}/100 · стоимость ведения бизнеса ${m.cost}/100.</p><p>Прогноз офиса: доход <b>${money(econ.dailyRevenue)}/день</b>, расходы <b>${money(econ.dailyCost)}/день</b>, результат <b style="color:${profit<0?'#c9475b':'#25865b'}">${profit<0?'убыток':'прибыль'} ${money(Math.abs(profit))}/день</b>${econ.remote?' · повышенные расходы на логистику и удалённость':''}.</p><p>Исследование рынка стоит ${money(marketStudyCost(m))}. Открытие офиса потребует ${money(officeOpeningCost(m))} на запуск и найм команды.</p>`,`<button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="studyAndOpen('${m.country}')">Исследовать · ${money(marketStudyCost(m))}</button><button class="btn gold" onclick="openOffice('${m.country}')">Открыть офис</button>`)}function studyAndOpen(country){let m=S.markets.find(x=>x.country===country);if(!m)return;let researchCost=marketStudyCost(m);if(S.money<researchCost){closeModal();return toast('Недостаточно средств')}S.money-=researchCost;m.studied=true;addTransaction('Исследование рынка '+country,-researchCost,'🔎');news(`Исследование ${country}: высокий спрос, рекомендуем локальную команду.`,'good');closeModal();render();save();toast('Исследование завершено')}function openOffice(country){let m=S.markets.find(x=>x.country===country);if(!m)return;let econ=officeEconomics(m),cost=officeOpeningCost(m);if(S.money<cost){closeModal();return toast('Недостаточно средств для открытия офиса')}S.money-=cost;m.opened=true;m.clients=Math.floor(500+m.demand*32);S.users+=m.clients;S.team+=8;S.offices.push({city:m.city,country:m.country,address:m.address||`${m.city}, ${m.country}`,workers:8,cost:econ.dailyCost,dailyRevenue:econ.dailyRevenue,dailyCost:econ.dailyCost,dailyProfit:econ.dailyProfit,emoji:'🏙️',market:m.demand,open:true});S.expenses+=econ.dailyCost;S.revenue+=econ.dailyRevenue;S.marketShare=Math.min(50,S.marketShare+1.1);S.scenarioProgress=Math.min(100,S.scenarioProgress+38);addTransaction('Открытие офиса: '+m.city,-cost,'🏢');news(`Офис в ${m.city} открыт! Набрана местная команда, рынок доступен.`,'good');checkContracts();closeModal();render();save();toast('Новый рынок открыт!')}
function researchMarket(){let unopened=S.markets.filter(m=>!m.opened);if(!unopened.length)return toast('Все рынки уже открыты');let m=unopened[0],cost=marketStudyCost(m);if(S.money<cost)return toast('Недостаточно средств');S.money-=cost;m.studied=true;news(`Исследование рынка ${m.country}: спрос ${m.demand}/100, локальные расходы ${m.cost}/100.`,'good');addTransaction('Исследование '+m.country,-cost,'🔎');render();save();toast(`${m.country}: спрос ${m.demand}/100, таланты ${m.workers}/100`)}
function startCampaign(){if(S.campaign>0)return toast('Рекламная кампания уже идёт');let campaignCost=50000;if(S.money<campaignCost)return toast(`Кампания стоит ${money(campaignCost)}`);S.money-=campaignCost;S.campaign=5;S.campaignDays=0;addTransaction('Рекламная кампания',-campaignCost,'📣');news('Запущена онлайн-кампания с блогерами для привлечения клиентов.','good');render();save();toast('Кампания запущена на 5 дней')}
function train(name){let e=S.employees.find(x=>x.name===name);if(!e)return;let trainingCost=80000;if(S.money<trainingCost)return toast(`Курс стоит ${money(trainingCost)}`);S.money-=trainingCost;e.skill=Math.min(100,e.skill+5);S.training.push(name);addTransaction('Курс обучения: '+name,-trainingCost,'🎓');news(`${name} завершил короткий курс и повысил навык.`,'good');render();save();toast('Навык повышен на 5 пунктов')}
function bonus(){let bonusCost=15000;if(S.money<bonusCost)return toast('Бонус стоит $15 000');let e=S.employees[0];S.money-=bonusCost;e.mood=Math.min(100,e.mood+9);addTransaction('Бонус: '+e.name,-bonusCost,'⭐');news(`Руководитель рекомендовал бонус для ${e.name} за вклад в продукт.`,'good');render();save();toast('Бонус одобрен')}
function raise(){modal('Рекомендация о повышении',`<p>Руководитель разработки рекомендует повысить Лео Мюллера до директора инженерного направления.</p><div class="row"><div class="row-main"><span>⭐</span><div><h3>Достижения</h3><p>Ускорил синхронизацию и стабилизировал выпуск обновлений</p></div></div></div><p>Дополнительные расходы: $1 200 в день.</p>`,`<button class="btn secondary" onclick="closeModal()">Отложить до пересмотра</button><button class="btn" onclick="approveRaise()">Проверить бюджет</button>`)}function approveRaise(){S.expenses+=1200;let e=S.employees.find(x=>x.name==='Лео Мюллер');if(e)e.role='Директор инженерного направления';closeModal();render();save();toast('Повышение одобрено — $1 200/день')}
function financeReport(){modal('Финансовый прогноз',`<p>На ближайшие 3 игровых месяца:</p><div class="row"><span>Доходы по текущему плану</span><b style="color:var(--green)">${money(S.revenue*90)}</b></div><div class="row" style="margin-top:8px"><span>Расходы по текущему плану</span><b style="color:var(--gold)">${money(S.expenses*90)}</b></div><div class="row" style="margin-top:8px"><span>Ожидаемый остаток</span><b>${money(S.money+(S.revenue-S.expenses)*90)}</b></div><p>Рекомендация финансового отдела: сохранять рекламный бюджет, завершить текущий этап разработки и отложить крупные офисные расходы.</p>`)}function loan(){modal('Предложение банка',`<p>Банк предлагает кредит $250 000 на 90 игровых дней. Ставка — 8%. Выплата долга и процентов будет учтена в ежедневных расходах.</p>`,`<button class="btn secondary" onclick="closeModal()">Отказаться</button><button class="btn" onclick="takeLoan()">Принять кредит</button>`)}function takeLoan(){S.money+=250000;S.expenses+=2400;addTransaction('Банковский кредит',250000,'🏦');news('Получен кредит банка на развитие компании. Платежи включены в расходы.','warn');closeModal();render();save();toast('Кредит получен')}
function investor(){modal('Предложения инвесторов',`<p>Выберите инвестора по сумме и доле компании, которую он просит.</p><button class="choice" onclick="takeInvestment(300000,8)"><b>Northstar Capital · $300 000</b><span>Доля 8% · фокус на международном росте</span></button><button class="choice" onclick="takeInvestment(180000,4)"><b>Foundry Ventures · $180 000</b><span>Доля 4% · опыт в продуктовой разработке</span></button>`)}function takeInvestment(amount,equity){S.money+=amount;addTransaction('Инвестиции (доля '+equity+'%)',amount,'🤝');news(`Инвестор вложил ${money(amount)} в развитие компании.`,'good');closeModal();render();save();toast('Инвестиция получена')}
function cutBudget(){modal('Пересмотр расходов',`<p>Сократить бюджет разработки на $8 000 в день? Работа над обновлением станет медленнее, но план сохранится.</p>`,`<button class="btn secondary" onclick="closeModal()">Оставить как есть</button><button class="btn" onclick="applyCut()">Сократить бюджет</button>`)}function applyCut(){S.expenses=Math.max(0,S.expenses-8000);S.productProgress=Math.max(0,S.productProgress-2);addTransaction('Сокращение бюджета разработки',0,'✂️');closeModal();render();save();toast('Расходы снижены, разработка замедлится')}
function employeeEvent(){if(S.crisis)return;let pool=[['Риск выгорания в инженерной команде','Команда разработки перегружена после серии срочных обновлений.','warn'],['Падение спроса на базовый тариф','Рыночный отчёт показывает, что клиенты переходят к более дешёвым предложениям.','bad'],['Сбой импорта данных','Первые клиенты сообщили о сбое при переносе больших файлов.','bad'],['Сильный квартальный результат','Клиенты высоко оценили обновление Nova Cloud.','good']];let pick=pool[Math.floor(Math.random()*pool.length)];S.crisis={title:pick[0],body:pick[1],type:pick[2]};modal(`🚨 ${pick[0]}`,`<p>${pick[1]} Кризис развивается постепенно — выберите следующий шаг.</p><button class="choice" onclick="resolveCrisis(1)"><b>🧑‍💼 Попросить руководителя подготовить план</b><span>Сначала анализ, последствия проявятся на следующий день</span></button><button class="choice" onclick="resolveCrisis(2)"><b>🧰 Выделить ресурсы прямо сейчас</b><span>Потратить $15 000 и снизить риск последствий</span></button><button class="choice" onclick="resolveCrisis(3)"><b>⏳ Наблюдать и собрать данные</b><span>Не тратить деньги, но проблема может усилиться</span></button>`)}function resolveCrisis(choice){let c=S.crisis;if(choice===2&&S.money>=15000){S.money-=15000;addTransaction('Реакция на кризис',-15000,'🧰');S.reputation=Math.min(100,S.reputation+1);news(`Кризис «${c.title}» удалось смягчить ресурсами.`,'good');toast('Ресурсы направлены на решение')}else if(choice===1){S.employees[1].mood=Math.min(100,S.employees[1].mood+3);news(`Руководитель готовит план решения: ${c.title}.`,'warn');toast('Запрошен план руководителя')}else{S.reputation=Math.max(0,S.reputation-3);S.revenue=Math.max(10000,S.revenue-2500);news(`Пока компания собирала данные, последствия «${c.title}» усилились.`,'bad');toast('Проблема усилилась')}S.crisis=null;closeModal();render();save()}
function togglePause(){S.paused=!S.paused;render();save()}function setSpeed(s){S.speed=s;render();save()}function tick(){if(S.paused||S.gameOver)return;S.day++;if(S.activeThisTick){S.activeThisTick=false;S.idleDays=0;S.idlePenalty=Math.max(0,(S.idlePenalty||0)-4500)}else{S.idleDays=(S.idleDays||0)+1;if(S.idleDays>=4){let idleScale=prefs.difficulty==='hard'?1.45:prefs.difficulty==='easy'?.7:1;S.idlePenalty=(S.idlePenalty||0)+Math.round((1200+(S.idleDays-4)*350)*idleScale);if(S.idleDays>=8){let churn=Math.max(10,Math.floor(S.users*.004));S.users=Math.max(0,S.users-churn);S.revenue=Math.max(0,S.revenue-Math.ceil(churn*.8));S.reputation=Math.max(0,S.reputation-(S.idleDays%3===0?2:1));S.marketShare=Math.max(.1,S.marketShare-.035);S.competitors.forEach(c=>c.share=Math.min(60,c.share+(prefs.difficulty==='hard'?.035:prefs.difficulty==='easy'?.008:.015)));if(S.idleDays%4===0)news('Клиенты уходят к конкурентам: команда давно не принимала важных решений. Запусти маркетинговую кампанию или улучши продукт.','bad')}else if(S.idleDays%3===1)news('Инвесторы обеспокоены бездействием: растут постоянные расходы на координацию и содержание компании.','warn')}}resolveMeetings();let difficulty=prefs.difficulty||'normal',incomeFactor=difficulty==='easy'?1.12:difficulty==='hard'?.9:1,expenseFactor=difficulty==='easy'?.9:difficulty==='hard'?1.2:1,growthFactor=difficulty==='easy'?1.35:difficulty==='hard'?.72:1;let net=S.revenue*incomeFactor-S.expenses*expenseFactor-(S.idlePenalty||0);S.money+=net;S.users+=Math.max(0,Math.floor(S.users*(S.campaign?0.0027:0.0012)*growthFactor));S.marketShare=Math.min(48,Math.max(.1,S.marketShare+(Math.random()*(prefs.difficulty==='hard'?.12:.16)-(prefs.difficulty==='hard'?.04:.035))));S.productProgress=Math.min(100,S.productProgress+(S.productBudget>0?2:1));if(S.campaign>0){S.campaign--;S.campaignDays++;S.users+=Math.floor(400+Math.random()*300);S.revenue+=1000;if(S.campaign===0)news(`Рекламная кампания завершена: +${S.campaignDays*600} пользователей.`,'good')}if(S.day%3===0){S.revenue+=Math.floor(Math.random()*1600);if(Math.random()<(prefs.difficulty==='hard'?.42:prefs.difficulty==='easy'?.15:.25)&&S.competitors.length){let c=S.competitors[Math.floor(Math.random()*S.competitors.length)];news(`${c.name}: ${Math.random()<.5?'выпустила обновление своего продукта':'расширила рекламную кампанию'} в ${c.country}.`,'warn')}}if(S.day%6===0){S.expenses+=Math.floor(Math.random()*900);if(Math.random()<.32)employeeEvent()}if(S.money<0){S.reputation=Math.max(0,S.reputation-1);if(S.day%2===0)news('Денежный запас отрицательный. Финансовый отдел рекомендует пересмотреть бюджет.','bad')}if(S.money<=-75000||(S.money<0&&S.reputation<=0)){S.gameOver=true;S.paused=true;S.gameOverReason=S.money<=-75000?'Компания не смогла покрыть обязательства и объявила о банкротстве.':'Клиенты потеряли доверие, а средств на восстановление больше нет.';save();render();return}if(S.money>1000000&&S.scenarioProgress<100)S.scenarioProgress=Math.min(100,S.scenarioProgress+2);checkContracts();save();render()}
function markPlayerActive(){if(appScreen==='game'&&!S.gameOver)S.activeThisTick=true}if(document.addEventListener){document.addEventListener('pointerdown',markPlayerActive,{passive:true});document.addEventListener('keydown',markPlayerActive);document.addEventListener('keydown',handleGlobeKeys)}setInterval(()=>{for(let i=0;i<S.speed;i++)tick()},6500);render();
</script></body></html>
