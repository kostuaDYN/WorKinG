function showUsersBreakdown(){let active=S.markets.filter(m=>m.opened&&m.clients>0),weight=active.reduce((a,m)=>a+m.clients,0),items=active.map((m,i)=>({label:`${m.country} · ${m.city}`,value:weight?Math.round(S.users*m.clients/weight):0,color:['#4b9bc9','#50ad83','#e7a04c','#8b78ce','#dd7182','#55b9b1'][i%6]}));if(!items.length)items=[{label:'Пока нет активных офисов',value:Math.max(1,S.users),color:'#8298a7'}];let roster=S.employees.map((e,i)=>{let o=S.offices.find(x=>x.open&&x.country===e.officeCountry)||S.offices.find(x=>x.open);return `<div class="row employee-roster-row"><div class="row-main"><span class="office-row-face">${portrait(e)}</span><div><h3>${esc(e.name)}</h3><p>${esc(e.role)} · ${esc(o?`${o.city}, ${o.country}`:'Без назначенного офиса')}</p></div></div><span class="tag">Лояльность ${e.mood||70}/100</span></div>`}).join('');glassModal('Аудитория и команда',`<p>Распределение ${fmt(S.users)} пользователей по странам с офисами. Ниже — сотрудники и их текущие филиалы.</p>${donutChart(items,fmt(S.users),'пользователей')}<h3 class="modal-section-title">Сотрудники компании · репутация ${S.reputation}/100</h3><div class="roster-list">${roster||'<div class="empty">Сотрудников пока нет</div>'}</div>`,`<button class="btn" onclick="closeModal()">Закрыть</button>`)}
function showReviews(){let opened=S.markets.filter(m=>m.opened),names=['Алексей К.','Мария Л.','Даниэль Р.','Лина В.','Самир Т.','Елена М.','Томас Б.','Аяко С.','Нура А.','Оливер П.','София Н.','Ким Ч.'];let positive=['Быстро подключили команду и помогли перенести данные.','Поддержка отвечает по делу, сервис стабильно работает.','Удобно работать с продуктовой командой этого офиса.','Нам предложили решение под наши процессы.','После обновления стало проще управлять проектами.','Команда быстро разобралась с нашей задачей.','Хорошее соотношение возможностей и цены.','Настроили сервис и объяснили каждый шаг.','Стало легче координировать команды в разных странах.','Надёжный инструмент для повседневной работы.','Понравилось внимание к обратной связи.','Запуск прошёл быстрее, чем ожидали.'],mixed=['Продукт полезный, но некоторым функциям нужна доработка.','Команда помогла начать работу; ждём улучшений.','В целом хороший сервис, иногда ответ приходится подождать.','Есть сильные стороны и несколько неудобных моментов.','Нравится направление развития, но обучение можно упростить.','Результат хороший, хотя подключение заняло лишнее время.','Работает стабильно, хотелось бы больше локальных настроек.','Сервис полезный, но тарифы можно сделать понятнее.','Ответ получили, но решение заняло пару дней.','Продукт подходит для большинства наших задач.','Будем продолжать пользоваться после небольших доработок.','Офис помог с запуском, теперь ждём новых функций.'],negative=['Поддержка задержала ответ, а запуск потребовал лишних усилий.','Надеемся на более стабильную работу сервиса.','Команде нужно быстрее разбирать обращения.','Пока опыт использования был непростым.','Нам не хватило понятного плана внедрения.','Сроки ответа поддержки хотелось бы сократить.','Важная функция пока работает нестабильно.','Перенос данных занял больше времени, чем обещали.','Тариф оказался сложнее, чем ожидали.','Нужна более быстрая реакция на проблемы.','Некоторые инструкции устарели.','Пока не готовы рекоме pe=track.voice;osc.frequency.value=track.melody[ix];gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(peak,now+Math.min(.32,duration*.22));gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(ambientMaster);osc.start(now);osc.stop(now+duration+.05);ambientTimer=setTimeout(playNote,track.rhythm[ix%track.rhythm.length])};playNote();ambientAudio.resume?.();return true}catch(e){stopAmbientMusic();return false}}function stopAmbientMusic(){if(ambientTimer){clearTimeout(ambientTimer);ambientTimer=null}if(ambientAudio){let old=ambientAudio;try{if(ambientMaster){ambientMaster.gain.cancelScheduledValues(old.currentTime);ambientMaster.gain.setTargetAtTime(0,old.currentTime,.12)}setTimeout(()=>old.close?.(),500)}catch{}ambientAudio=null;ambientMaster=null}}function setMusicTrack(id){prefs.musicTrack=soundCatalog.some(x=>x.id===id)?id:'soft-piano';savePrefs();if(prefs.music){stopAmbientMusic();startAmbientMusic()}showSettings()}function setMusicVolume(value){prefs.volume=Math.max(0,Math.min(.24,Number(value)||0));savePrefs();if(ambientMaster&&ambientAudio)ambientMaster.gain.setTargetAtTime(prefs.volume,ambientAudio.currentTime,.15)}function playUiChime(){if(!prefs?.soundEffects)return;let C=window.AudioContext||window.webkitAudioContext;if(!C)return;try{let c=ambientAudio||new C(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.13);if(!ambientAudio)setTimeout(()=>c.close?.(),250)}catch{}}function savePrefs(){try{localStorage.setItem('technoempire-preferences',JSON.stringify(prefs))}catch{}}function applyTheme(){document.body?.setAttribute?.('data-theme',prefs.theme||'mist');document.body?.setAttribute?.('data-palette',prefs.palette||'ocean');document.body?.classList?.toggle('compact-ui',!!p function companySetupScreen(){let b=founderBusinesses.find(x=>x.id===setupBusiness)||founderBusinesses[0];return `<section class="founder-setup"><div class="founder-setup-card"><div class="eyebrow">НОВАЯ ИГРА · ШАГ 1 ИЗ 1</div><h1>Начни с нуля</h1><p class="setup-intro">Сначала придумай имя компании и выбери направление. На развитие у тебя будет $1 000 000, а первые три игровых дня советник будет показывать стрелкой следующий шаг.</p><label class="setup-label" for="founder-company-name">Название компании</label><input id="founder-company-name" class="text-input" maxlength="28" placeholder="Например, ВорКинГ" value="${esc(setupCompanyName)}" oninput="setupCompanyName=this.value"><div class="setup-label">Чем будет заниматься компания?</div><div class="business-choice-grid">${founderBusinesses.map(x=>`<button class="business-choice ${x.id===setupBusiness?'selected':''}" onclick="selectFounderBusiness('${x.id}')"><span>${x.icon}</span><b>${x.name}</b><small>${x.desc}</small></button>`).join('')}</div><div class="founder-preview"><span>${b.icon}</span><div><b>Первый продукт: ${esc(b.product)}</b><small>${esc(b.kind)} · стартовый баланс $1 000 000</small></div></div><div class="setup-actions"><button class="btn secondary" onclick="appScreen='welcome';render()">← Назад</button><button class="btn" onclick="beginNewGame()">Создать компанию →</button></div></div></section>`}
function beginNewGame(){let name=(document.querySelector('#founder-company-name')?.value||setupCompanyName).trim();if(!name){toast('Сначала напиши название компании');document.querySelector('#founder-company-name')?.focus();return}let business=founderBusinesses.find(x=>x.id===setupBusiness)||founderBusinesses[0];S=initial();S.company=name;S.businessType=business.id;S.money=1000000;S.revenue=0;S.expenses=0;S.users=0;S.team=0;S.reputation=0;S.marketShare=0;S.product=business.product;S.productLevel=0;S.productProgress=0;S.productBudget=0;S.productFeatures=['Идея','Первый заказ ещё не получен'];S.freeHiresRemaining=5;S.freeHireVersion=2;S.projects=[{id:'founder',name:business.product+' — первая версия',type:business.kind,icon:business.icon,progress:0,budget:0,team:0,status:'Идея',market:'Первый клиент'}];S.projectFocus='all';S.offices=[];S.employees=[];S.markets.forEach(m=>{m.opened=false;m.clients=0;m.studied=false});S.news=[];S.transactions=[];S.contractsClaimed=[];S.meetings=[];S.firstCustomerDone=false;S.bootstrapMode=true;S.startupCoachStartDay=1;S.campaignComplete=false;S.scenario='Путь основателя';S.scenarioGoal='Запусти первую версию и найди 10 000 клиентов';S.paused=true;S.onboarded=true;S.day=1;S.idleDays=0;S.idlePenalty=0;S.activeThisTick=false;appScreen='game';hasSavedGame=true;addTransaction('Стартовый капитал на развитие',1000000,'🏁');save();render();modal('Твоя компания создана',`<p><b>${esc(name)}</b> получила стартовый капитал <b>$1 000 000</b>. Офисов и сотрудников пока нет — ты сам решишь, на что потратить деньги.</p><p>Первые три игровых дня советник будет показывать стрелкой, куда нажать. Начни с клиентского заказа: нажми <b>«Взять первый заказ»</b> на главной странице.</p>`,`<button class="btn" onclick="startFounderRun()">Понятно, поехали →</button>`)}
function startFounderRun(){closeModal();S.paused=false;showTutorial(0);save()}
function startupCoachPanel(){if(!S.bootstrapMode)return '';let start=Number.isFinite(S.startupCoachStartDay)?S.startupCoachStartDay:S.day,day=Math.max(1,Math.min(3,S.day-start+1)),done=S.day-start>=3,plans=[{title:'День 1 · получи первый заказ',desc:'Клиент оплатит пилот и добавит $180 000. У тебя уже есть $1 000 000 на развитие.',button:!S.firstCustomerDone?'<button class="btn coach-target" onclick="completeFirstCustomerOrder()">Получить первый заказ</button>':'<span class="tag good">Заказ получен ✓</span>'},{title:'День 2 · выпусти первую версию',desc:'Нажми кнопку разработки. В режиме стартапа один этап за $150 000 выпускает MVP целиком.',button:S.productLevel<1?'<button class="btn coach-target" onclick="startResearch()">Выпустить MVP · $150 000</button>':'<span class="tag good">MVP готов ✓</span>'},{title:'День 3 · расскажи о продукте',desc:S.campaign>0?`Реклама уже идёт: осталось ${S.campaign} игровых дней. Следи за ростом пользователей.`:'Запусти рекламу за $100 000, чтобы привлечь первых пользователей. Оставь часть капитала про запас.',button:S.campaign>0?'<button class="btn secondary coach-target" onclick="tabTo(\'finance\')">Проверить финансы →</button>':S.productLevel>=1&&S.money>=100000?'<button class="btn coach-target" onclick="startCampaign()">Запустить рекламу · $100 000</button>':S.productLevel<1?'<button class="btn coach-target" onclick="startResearch()">Сначала выпустить MVP · $150 000</button>':'<button class="btn secondary coach-target" onclick="tabTo(\'finance\')">Проверить бюджет →</button>'}],plan=plans[day-1];return `<section class="panel startup-coach"><div class="eyebrow">${done?'СТАРТОВОЕ ОБУЧЕНИЕ ЗАВЕРШЕНО':`СОВЕТНИК · ДЕНЬ ${day} ИЗ 3`}</div><h2>${done?'Первые три дня позади':plan.title}</h2><p>${done?'Ты прошёл стартовый маршрут. Продолжай улучшать продукт и трать деньги постепенно. Советник ждёт вопросов во вкладке «Помощь».':plan.desc}</p>${done?'<button class="btn secondary" onclick="tabTo(\'help\')">Открыть советника →</button>':`<div class="coach-arrow"><span>↓</span> Нажми на подсвеченную кнопку</div>${plan.button}`}<div class="startup-coach-days">${[1,2,3].map(n=>`<span class="${n===day&&!done?'current':n<day||done?'done':''}">${n<day||done?'✓':n}</span>`).join('')}</div></section>`}

function founderCampaignPanel(){let steps=[{done:!!S.firstCustomerDone,title:'Первый заказ',desc:'Нажми кнопку и получи $180 000 на запуск компании.'},{done:S.productLevel>=1,title:'Собери первую версию',desc:'Потрать $150 000 на следующий этап разработки.'},{done:S.users>=10000,title:'Найди первых 10 000 пользователей',desc:'Запусти рекламу и дождись новых клиентов.'}];let active=steps.find(x=>!x.done);let action=!S.firstCustomerDone?`<button class="btn founder-order-btn" onclick="completeFirstCustomerOrder()">Шаг 1 · Получить первый заказ</button>`:S.productLevel<1?`<button class="btn founder-order-btn" onclick="advanceProduct()">Шаг 2 · Разработать продукт · $150 000</button>`:S.users<10000?`<button class="btn founder-order-btn" onclick="startCampaign()">Шаг 3 · Запустить рекламу · $100 000</button>`:'';return `<section class="panel founder-objective"><div class="eyebrow">ТВОЯ ПЕРВАЯ ЦЕЛЬ</div><h2>${S.campaignComplete?'Ты создал настоящую компанию!':active?.title||'Цель выполнена'}</h2><p>${S.campaignComplete?'Поздравляем! Ты начал с нуля и довёл компанию до первых клиентов. Дальше выбери, куда расти.':active?.desc||'Отличная работа.'}</p><div class="founder-step-list">${steps.map((x,i)=>`<div class="founder-step ${x.done?'done':''} ${x===active?'current':''}"><span>${x.done?'✓':i+1}</span><div><b>${x.title}</b><small>${x.desc}</small></div></div>`).join('')}</div>${action}${S.lawsuit?`<div class="court-status">⚖️ Суд идёт против ${esc(S.lawsuit.rival)} · осталось ${Math.max(0,S.lawsuit.resolveDay-S.day)} игровых дней</div>`:''}<div class="founder-status">Деньги ${money(S.money)} · клиенты ${fmt(S.users)} · сотрудники ${S.team}</div><p class="simple-tip">💡 Играй по порядку: нажми одну большую кнопку. Остальные вкладки можно изучить позже.</p></section>`}
function completeFirstCustomerOrder(){if(S.firstCustomerDone)return toast('Первый заказ уже выполнен');S.firstCustomerDone=true;S.money+=180000;S.revenue+=8500;S.users=800;S.reputation=30;S.marketShare=3;S.productBudget=350000;S.projects[0].budget=350000;S.projects[0].status='Первый заказ';S.productFeatures=['Первый заказ выполнен','Разработка первой версии'];addTransaction('Оплата первого заказа',180000,'🤝');news('Первый клиент оплатил пилотный проект. Появился стартовый капитал для разработки.','good');render();save();toast('Первый заказ оплачен · +$180 000')}
function updateFounderCampaign(){if(!S.bootstrapMode||S.campaignComplete)return;if(!S.lawsuit&&!S.takeoverPending&&S.firstCustomerDone&&S.productLevel>=1&&S.users>=10000){S.campaignComplete=true;S.paused=true;S.campaignWonAt=S.day;news('Кампания пройдена: компания выросла с нуля и выполнила все цели.','good');save()}}
function continueGame(){if(!hasSavedGame)return toast(tx('Сначала начни новую игру','Start a new game first','请先开始新游戏'));appScreen='game';S.paused=false;render();save();if(!S.onboarded)showTutorial(0)}
function glassModal(title,body,actions=''){let root=$('#modal-root');root.innerHTML=`<div class="overlay glass-overlay" onclick="if(event.target===this)closeModal()"><div class="modal glass-modal"><h2>${title}</h2>${body}<div class="modal-actions">${actions||'<button class="btn secondary" onclick="closeModal()">Close</button>'}</div></div></div>`}
function showLanguages(){let langs=[['ru','Русский','Русский'],['zh','中文','简体中文'],['en','English','English']];glassModal(tx('Язык интерфейса','Interface language','界面语言'),`<p>${tx('Выбери язык игры.','Choose a language for the game.','选择游戏语言。')}</p><div class="language-options">${langs.map(([id,ru,label])=>`<button class="choice ${prefs.language===id?'selected':''}" onclick="setLanguage('${id}')"><b>${label}</b><span>${id==='ru'?'Русский':id==='zh'?'Chinese':'English'} ${prefs.language===id?' · ✓':''}</span></button>`).join('')}</div>`)}
function setLanguage(lang){prefs.language=['ru','zh','en'].includes(lang)?lang:'ru';savePrefs();closeModal();render();if(appScreen==='welcome')toast(tx('Язык изменён','Language changed','语言已更改'))}
function showSettings(){if(prefs.music)startAmbientMusic();let palettes=[['ocean','Океан','#168f88','#5a9dd6'],['blue','Синий','#456adb','#84a1f4'],['violet','Фиолетовый','#7f56c2','#b47ed6'],['coral','Коралловый','#cb655b','#ed9b77'],['forest','Лесной','#397c58','#88b978']],themes=[['mist',tx('Светло-серая','Soft gray','浅灰色'),'#e7e9ed'],['snow',tx('Светлая','Light','浅色'),'#f7f9fc'],['night',tx('Тёмная','Dark','深色'),'#26364a']];glassModal(tx('Настройки','Settings','设置'),`<p>${tx('Выбери оформление, звуки, язык и управление игрой.','Choose appearance, audio, language, and game controls.','选择外观、声音、语言和游戏控制。')}</p><div class="settings-group"><b>🌐 ${tx('Язык интерфейса','Interface language','界面语言')}</b><div class="settings-row"><span>${prefs.language==='ru'?'Русский':prefs.language==='zh'?'中文 · 简体中文':'English'}</span><button class="btn secondary" onclick="showLanguages()">${tx('Выбрать язык','Choose language','选择语言')}</button></div></div><div class="settings-group"><b>🧰 ${tx('Управление компанией','Company controls','公司管理')}</b><div class="settings-row"><span>✏️ ${tx('Название компании','Company name','公司名称')}</span><button class="btn secondary" onclick="closeModal();renameCompany()">${tx('Изменить','Rename','修改')}</button></div><div class="settings-row"><span>💾 ${tx('Сохранение игры','Save game','保存游戏')}</span><button class="btn secondary" onclick="save();toast('Игра сохранена')">${tx('Сохранить сейчас','Save now','立即保存')}</button></div></div><div class="settings-group difficulty-group"><b>🎚️ ${tx('Сложность игры','Game difficulty','游戏难度')}</b><p class="difficulty-copy">${tx('Влияет на темп роста, ежедневную прибыль и напор конкурентов. Можно менять в любой момент.','Changes growth, daily income, and competitor pressure. You can switch at any time.','影响增长速度、每日收入和竞争压力，可随时切换。')}</p><div class="difficulty-options">${[['easy',tx('Лёгкая','Easy','简单'),tx('Ниже расходы · рост быстрее','Lower costs · faster growth','成本较低 · 增长较快')],['normal',tx('Обычная','Normal','普通'),tx('Сбалансированная экономика','Balanced economy','平衡经济')],['hard',tx('Сложная','Hard','困难'),tx('Расходы выше · конкуренты активнее','Higher costs · stronger rivals','成本较高 · 对手更活跃')]].map(([id,label,desc])=>`<button class="difficulty-card ${prefs.difficulty===id?'selected':''}" onclick="setDifficulty('${id}')"><b>${label}</b><small>${desc}</small>${prefs.difficulty===id?'<i>✓ выбрано</i>':''}</button>`).join('')}</div></div><div class="settings-group"><b>${tx('Тема интерфейса','Interface theme','界面主题')}</b><div class="theme-options">${themes.map(([id,label,color])=>`<button class="theme-chip ${prefs.theme===id?'selected':''}" onclick="setTheme('${id}')"><i style="--swatch:${color}"></i><span>${label}</span>${prefs.theme===id?'✓':''}</button>`).join('')}</div></div><div class="settings-group palette-group"><b>${tx('Цветовая палитра','Accent color palette','界面配色')}</b><div class="palette-options">${palettes.map(([id,label,a,b])=>`<button class="palette-chip ${prefs.palette===id?'selected':''}" onclick="setPalette('${id}')" title="${label}"><i style="--swatch:${a};--swatch2:${b}"></i><span>${label}</span>${prefs.palette===id?'✓':''}</button>`).join('')}</div></div><div class="sound-catalog"><b>${tx('Каталог спокойной музыки','Calm music catalog','舒缓音乐目录')}</b><div class="soundtrack-list">${soundCatalog.map(t=>`<button class="soundtrack-card ${prefs.musicTrack===t.id?'selected':''}" onclick="setMusicTrack('${t.id}')"><span class="track-icon">♫</span><span><b>${t.name}</b><small>${t.description}</small></span>${prefs.musicTrack===t.id?'✓':''}</button>`).join('')}</div></div><div class="settings-row"><span>🎵 ${tx('Спокойная фоновая музыка','Calm background music','舒缓背景音乐')}</span><button class="setting-toggle ${prefs.music?'on':''}" onclick="togglePreference('music')">${prefs.music?tx('Вкл.','On','开'):tx('Выкл.','Off','关')}</button></div><label class="volume-row"><span>🔉 ${tx('Громкость музыки','Music volume','音乐音量')}</span><input type="range" min="0" max="0.24" step="0.01" value="${prefs.volume??.12}" oninput="setMusicVolume(this.value)"></label><div class="settings-row"><span>🔔 ${tx('Звуки действий','Action sounds','操作音效')}</span><button class="setting-toggle ${prefs.soundEffects?'on':''}" onclick="togglePreference('soundEffects')">${prefs.soundEffects?tx('Вкл.','On','开'):tx('Выкл.','Off','关')}</button></div><div class="settings-row"><span>📣 ${tx('Экранные уведомления','Screen notifications','屏幕通知')}</span><button class="setting-toggle ${prefs.notifications?'on':''}" onclick="togglePreference('notifications')">${prefs.notifications?tx('Вкл.','On','开'):tx('Выкл.','Off','关')}</button></div><div class="settings-row"><span>✨ ${tx('Анимация интерфейса','Interface motion','界面动画')}</span><button class="setting-toggle ${prefs.animations?'on':''}" onclick="togglePreference('animations')">${prefs.animations?tx('Вкл.','On','开'):tx('Выкл.','Off','关')}</button></div><div class="settings-row"><span>🧭 ${tx('Подсказки по игре','Gameplay hints','游戏提示')}</span><button class="setting-toggle ${prefs.showHints?'on':''}" onclick="togglePreference('showHints')">${prefs.showHints?tx('Вкл.','On','开'):tx('Выкл.','Off','关')}</button></div><div class="settings-row"><span>📐 ${tx('Компактный интерфейс','Compact interface','紧凑界面')}</span><button class="setting-toggle ${prefs.compactUI?'on':''}" onclick="togglePreference('compactUI')">${prefs.compactUI?tx('Вкл.','On','开'):tx('Выкл.','Off','关')}</button></div><div class="settings-row"><span>⏸ ${tx('Пауза при критической проблеме','Pause on critical market issue','重大市场问题时暂停')}</span><button class="setting-toggle ${prefs.pauseOnCritical?'on':''}" onclick="togglePreference('pauseOnCritical')">${prefs.pauseOnCritical?tx('Вкл.','On','开'):tx('Выкл.','Off','关')}</button></div><div class="settings-row"><span>🌐 ${tx('Вращение глобуса','Globe rotation','地球旋转')}</span><span class="tag good">← → ↑ ↓</span></div><div class="settings-row"><span>🔎 ${tx('Приближение глобуса','Globe zoom','地球缩放')}</span><span class="tag">${tx('Колесо мыши или кнопки ±','Mouse wheel or ± buttons','鼠标滚轮或 ± 按钮')}</span></div><div class="settings-row"><span>💾 ${tx('Сохранение игры','Game saving','游戏保存')}</span><span class="tag good">${tx('Автоматически','Automatic','自动')}</span></div>`,`<button class="btn" onclick="closeModal()">${tx('Готово','Done','完成')}</button>`)}

function founderVictoryScreen(){return `<section class="game-over-screen founder-win-screen"><div class="game-over-card"><div class="game-over-mark founder-win-mark">★</div><div class="eyebrow">День ${S.day} · цель кампании выполнена</div><h1>${esc(S.company)} выросла с нуля</h1><p>Ты получил первый заказ, выпустил первую версию и построил аудиторию. Теперь это работающая компания.</p><div class="game-over-stats"><span>Пользователи <b>${fmt(S.users)}</b></span><span>Доля рынка <b>${S.marketShare.toFixed(1)}%</b></span><span>Репутация <b>${S.reputation}/100</b></span><span>Баланс <b>${money(S.money)}</b></span></div><button class="btn" onclick="openCompanySetup()">Создать новую компанию</button><small>Кампания окончена. Сохранение останется доступно на главном экране.</small></div></section>`}
function gameOverScreen(){if(S.takeoverOutcome==='lost')return `<section class="game-over-screen takeover-lost-screen"><div class="game-over-card"><div class="game-over-mark">⚖️</div><div class="eyebrow">Компания ${esc(S.lostCompanyName||'') } досталась ${esc(S.lostToRival||'конкуренту')}</div><h1>Ты остался без компании</h1><p>${esc(S.gameOverReason||'Ты отказался от суда и потерял компанию.')}</p><div class="game-over-stats"><span>Компания <b>нет</b></span><span>Баланс <b>$0</b></span></div><button class="btn" onclick="openCompanySetup()">Начать новую компанию</button></div></section>`;return `<section class="game-over-screen"><div class="game-over-card"><div class="game-over-mark">×</div><div class="eyebrow">День ${S.day} · Компания закрыта</div><h1>Банкротство</h1><p>${esc(S.gameOverReason||'Компания больше не может покрывать свои расходы.')}</p><div class="game-over-stats"><span>Итоговый баланс <b>${money(S.money)}</b></span><span>Репутация <b>${S.reputation}/100</b></span></div><button class="btn" onclick="openCompanySetup()">Начать новую компанию</button><small>Чтобы компания выжила, следи за ежедневным балансом, реагируй на кризисы и поддерживай интерес клиентов.</small></div></section>`}

function render(){applyTheme();document.body?.classList?.toggle('no-motion',!prefs.animations);if(appScreen==='game')updateFounderCampaign();if(appScreen==='game'&&S.campaignComplete){$('#app').innerHTML=founderVictoryScreen();return}if(appScreen==='game'&&S.gameOver){$('#app').innerHTML=gameOverScreen();return}if(appScreen==='setup'){$('#app').innerHTML=companySetupScreen();return}if(appScreen==='welcome'){$('#app').innerHTML=welcomeScreen();return}let tabs=[['overview',tx('Обзор','overview')],['products',tx('Проекты','projects')],['markets',tx('Карта мира','map')],['competitors',tx('Конкуренты','competitors')],['office',tx('Офис','office')],['people',tx('Команда','team')],['hiring','Анкеты'],['leadership','Чат с руководством'],['finance',tx('Финансы','finance')],['help',tx('Помощь','help')]],tab=S.selectedTab;let page=`<header class="topbar"><div class="brand"><div class="logo">N</div><div><h1>${tx('ТЕХНОИМПЕРИЯ','brand')}</h1><small>${esc(S.company)} · ${tx('Управляй будущим','BUILD YOUR FUTURE','建设未来')}</small></div></div><div class="top-actions"><span class="day">📅 ${tx('День','day')} ${S.day}</span><button class="speed ${S.paused?'active':''}" onclick="togglePause()">${S.paused?tx('▶ Продолжить','paused'):tx('⏸ Пауза','pause')}</button><button class="speed ${S.speed===1?'active':''}" onclick="setSpeed(1)">1×</button><button class="speed ${S.speed===2?'active':''}" onclick="setSpeed(2)">2×</button><button class="btn secondary help-btn" onclick="tabTo('help')">${tx('Помощь','help')}</button><button class="btn secondary help-btn" onclick="showSettings()">⚙ ${tx('Настройки','settings')}</button><button class="iconbtn" title="Новая игра" onclick="confirmReset()">↻</button></div></header>${metrics()}<div class="layout"><main class="main"><nav class="tabs">${tabs.map(([k,n])=>`<button class="tab ${tab===k?'active':''}" onclick="${k==='office'?'openOfficeTab()':`tabTo('${k}')`}">${n}</button>`).join('')}</nav><div id="content">${S.bootstrapMode?startupCoachPanel():''}${view(tab)}</div></main><aside class="right">${sideNews()}${sideTeam()}</aside></div><div class="footer">${tx('Техноимперия · прототип · прогресс сохраняется автоматически в этом браузере','Techno Empire · autosaved in this browser','科技帝国 · 自动保存在此浏览器')}</div>`;$('#app').innerHTML=localizeMarkup(page)}
function helpView(){let history=S.helpChat||[];return `<section class="panel help-chat-panel"><div class="help-chat-head"><div><div class="eyebrow">Ваш игровой консультант</div><h2>Помощь по компании</h2><p>Задай вопрос сам — помощник разберёт состояние компании и предложит следующий шаг. Он не пишет первым.</p></div><span class="help-status">● Готов помочь</span></div><div class="help-transcript" id="help-transcript">${history.length?history.map(m=>`<div class="chat-message ${m.role==='assistant'?'bot':'user'}"><b>${m.role==='assistant'?'Советник':'Ты'}</b><p>${esc(m.text)}</p></div>`).join(''):`<div class="help-empty"><span>✦</span><b>Спроси, как лучше развивать компанию</b><p>Например: «Что сейчас лучше сделать?» или «Стоит ли открывать офис в Новой Зеландии?»</p></div>`}</div><div class="help-prompts"><button class="smallbtn" onclick="askHelpSuggestion('Что сейчас лучше сделать?')">Что делать дальше?</button><button class="smallbtn" onclick="askHelpSuggestion('Стоит ли открывать офис в Новой Зеландии?')">Оценить офис</button><button class="smallbtn" onclick="askHelpSuggestion('Как провести успешный митинг?')">Митинги</button></div><div class="help-compose"><input id="help-question" type="text" maxlength="240" placeholder="Спроси о деньгах, проектах, офисах или стратегии…" value="${esc(S.helpDraft||'')}" oninput="S.helpDraft=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();submitHelpQuestion()}"><button class="btn" onclick="submitHelpQuestion()">Спросить →</button></div><div class="help-footer">Советник использует данные текущей компании; ответы появляются только после твоего вопроса. <button class="smallbtn" onclick="showTutorial(0)">Открыть обучение</button></div></section>`}
function adviceFor(question){let q=String(question||'').toLocaleLowerCase('ru'),net=S.revenue-S.expenses-(S.idlePenalty||0),losing=S.offices.filter(o=>o.open&&(o.dailyRevenue||0)<(o.dailyCost||o.cost)).sort((a,b)=>((a.dailyRevenue||0)-(a.dailyCost||a.cost))-((b.dailyRevenue||0)-(b.dailyCost||b.cost))),unfinished=S.projects.filter(p=>p.progress<100).sort((a,b)=>a.progress-b.progress),pending=S.meetings||[],best=S.markets.slice().sort((a,b)=>b.demand-a.demand)[0],company=`${S.company||'Твоя компания'}`;if(/реклам|рекламу|кампан|продвиг|объявлен/.test(q)){if(S.campaign>0)return `Реклама уже активна: осталось ${S.campaign} игровых дней. Она стоит $100 000 и приносит дополнительных пользователей и небольшой доход каждый день. Дождись завершения, а затем оцени рост во вкладках «Обзор» и «Финансы».`;if(S.money<100000)return `Чтобы запустить рекламу, нужно $100 000 свободных денег. Сейчас на счету ${money(S.money)} — поэтому кнопка не срабатывает. Сначала получи клиентский заказ или сократи расходы, затем открой «Обзор» и нажми «Запустить рекламу».`;return `Реклама доступна: кампания стоит $100 000 и идёт 5 игровых дней. На счету ${money(S.money)}. Нажми «Запустить рекламу» на главной странице; кампания привлечёт пользователей, но не гарантирует прибыль, так что оставь запас на ежедневные расходы.`}if(/перв(ый|ого) заказ|заказ|клиент|заработ|доход|деньг|финанс|бюджет|баланс|добыв/.test(q)){if(S.bootstrapMode&&!S.firstCustomerDone)return `Компания «${company}» только начинает и пока без выручки. Первый заработок — клиентский заказ: открой «Проекты», выбери продукт и целевой рынок, затем в разделе контрактов отправь предложение клиенту. После принятия получишь оплату. Не запускай дорогую рекламу до первого заказа; на счету ${money(S.money)}.`;return `Сейчас баланс ${money(S.money)}; выручка ${money(S.revenue)}/день, расходы ${money(S.expenses)}/день, чистый результат ${net>=0?'+':''}${money(net)}/день. ${losing.length?`Сильнее всего тянет бюджет вниз офис в ${losing[0].city} (${money((losing[0].dailyRevenue||0)-(losing[0].dailyCost||losing[0].cost))}/день).`:'Проверь активные расходы во вкладке «Финансы».'} Основные источники дохода: клиентские контракты, рост продукта и прибыльные офисы.`}if(/почему.*(не).*реклам|не могу.*реклам|реклам.*(не работает|нельзя)/.test(q))return S.campaign>0?`Кампания уже запущена, осталось ${S.campaign} игровых дней.`:S.money<100000?`Реклама стоит $100 000, а у тебя ${money(S.money)}. Сначала заработай на заказе или снизь расходы.`:`Реклама должна быть доступна: нужно $100 000, на счету ${money(S.money)}. Если кнопки не видно, открой «Обзор» и прокрути страницу к карточке маркетинга.`;if(/сотруд|команд|найм|работник|анкета/.test(q))return `Сейчас в команде ${S.employees.length} сотрудников. Для найма открой вкладку «Анкеты»: посмотри опыт, образование и рекомендацию, затем выбери «Нанять» или «Отправить на обучение». Учитывай зарплату и запас денег. Для поиска кандидатов используй митинг с повесткой «Найм».`;if(/офис|стране|городе|рынок/.test(q)){let m=S.markets.find(x=>q.includes(x.country.toLocaleLowerCase('ru'))||q.includes(x.city.toLocaleLowerCase('ru')));if(m){let e=officeEconomics(m);return `${m.city}, ${m.country}: спрос ${m.demand}/100. Прогноз офиса — доход ${money(e.dailyRevenue)}/день, расходы ${money(e.dailyCost)}/день, итог ${e.dailyProfit>=0?'прибыль':'убыток'} ${money(Math.abs(e.dailyProfit))}/день. ${m.opened?'Офис уже открыт.':'Открой карточку рынка и сравни разовый запуск и ежедневные расходы перед покупкой.'}`}if(losing.length)return `Открытые офисы: ${S.offices.filter(o=>o.open).length}. Самый убыточный сейчас — ${losing[0].city}: ${money((losing[0].dailyRevenue||0)-(losing[0].dailyCost||losing[0].cost))}/день. На карте выбери страну и сначала проверь прогноз; офисы создают и доход, и постоянные расходы.`;return `Чтобы открыть офис, зайди во вкладку «Карта мира», выбери страну, изучи прогноз доходов и расходов, затем нажми «Открыть офис». Сначала проверь, что после оплаты запуска останется резерв.`}if(/что сейчас|что делать|что лучше|дальше|совет|стратег/.test(q)){if(S.bootstrapMode&&!S.firstCustomerDone)return `Начни с первого заказа: выбери проект и целевой рынок, затем отправь предложение клиенту. Это первая цель компании и источник стартовой выручки. Пока заказ не получен, не открывай офисы и не трать $100 000 на рекламу.`;if(S.money<180000)return `Главное сейчас — сохранить деньги. Баланс ${money(S.money)}, ежедневный результат ${net>=0?'+':''}${money(net)}. Не расширяйся; проверь убытки ${losing[0]?`офиса в ${losing[0].city}`:'во вкладке «Финансы»'} и сосредоточься на контракте.`;if(losing.length)return `Главный риск — офис в ${losing[0].city}: он теряет ${money((losing[0].dailyCost||losing[0].cost)-(losing[0].dailyRevenue||0))} в день. Проверь карточку офиса и реши, стоит ли его реструктурировать или закрыть. Затем продвинь проект «${unfinished[0]?.name||S.product}».`;if(pending.length)return `У тебя назначен митинг в ${pending[0].city}. Дождись результата и используй его. Пока встреча идёт, продвинь проект «${unfinished[0]?.name||S.product}».`;if(unfinished.length)return `Следующий понятный шаг — проект «${unfinished[0].name}» (готовность ${unfinished[0].progress}%). Этап стоит ${money(projectStageCost(unfinished[0]))}. После него проверь контракт и денежный поток.`;return `Баланс ${money(S.money)}, чистый дневной результат ${net>=0?'+':''}${money(net)}, репутация ${S.reputation}/100. Можно привлечь клиентов на сильном рынке${best?` — например, ${best.country} (спрос ${best.demand}/100)`:''} или улучшить продукт.`}if(/митинг|встреч|переговор/.test(q))return `Открой карту, выбери страну и назначь митинг. Клиентская встреча помогает получить заказ и пользователей, встреча по найму — найти специалистов, партнёрская — укрепить продажи. Проверь цену и спрос до назначения; результат появится через несколько игровых дней.`;if(/проект|продукт|разработ|запуск/.test(q)){let p=unfinished[0];return p?`Сейчас проект «${p.name}» готов на ${p.progress}%. Следующий этап стоит ${money(projectStageCost(p))}. Открой вкладку «Проекты», проверь рынок и бюджет, затем продвинь этап. Завершённый продукт помогает выполнять контракты и увеличивать доход.`:'Все проекты завершены. Создай следующий продукт во вкладке «Проекты» и выбери для него целевой рынок.'}if(/банкрот|долг|убыт/.test(q))return `Ежедневный результат сейчас ${net>=0?'+':''}${money(net)}; баланс ${money(S.money)}. Открой «Финансы», найди крупнейшие расходы и сравни их с доходом. Закрой или реструктурируй офисы с устойчивым убытком, отложи найм и рекламу. Если напишешь, какая именно статья расходов беспокоит, разберу её.`;return `Я помогу с финансами, первым заказом, рекламой, проектами, наймом, офисами и митингами. Напиши вопрос чуть конкретнее — например: «Почему не запускается реклама?», «Как получить первый заказ?» или «Сколько приносит офис в Японии?»`}
function submitHelpQuestion(){let field=$('#help-question'),question=(field?.value||S.helpDraft||'').trim();if(!question)return;S.helpDraft='';S.helpChat=S.helpChat||[];S.helpChat.push({role:'user',text:question},{role:'assistant',text:adviceFor(question)});S.helpChat=S.helpChat.slice(-24);render();save();let tr=$('#help-transcript');if(tr)tr.scrollTop=tr.scrollHeight}
function askHelpSuggestion(question){let field=$('#help-question');if(field)field.value=question;submitHelpQuestion()}

function view(t){if(t==='help')return helpView();if(t==='overview')return overview();if(t==='products')return products();if(t==='markets')return markets();if(t==='competitors')return competitorView();if(t==='office')return offices();if(t==='people')return people();if(t==='hiring')return hiringView();if(t==='leadership')return leadershipView();if(t==='finance')return finance();return overview()}

function marketCard(m){return `<article class="market-card" data-search="${esc((m.country+' '+m.city+' '+(m.address||'')).toLocaleLowerCase('ru'))}"><h3>${m.emoji||'🌍'} ${esc(m.city)}</h3><p>${esc(m.country)} · спрос ${m.demand}/100 · специалисты ${m.workers}/100</p><div class="market-foot"><span>${m.opened?`👥 ${fmt(m.clients)} клиентов`:(m.freeOffice?'Открытие бесплатно':`Открытие ${money(officeOpeningCost(m))}`)}</span>${m.opened?`<button class="smallbtn" onclick="mapClick('${esc(m.country)}')">Войти</button>`:`<button class="smallbtn" onclick="openMarket('${esc(m.country)}')">Изучить</button>`}</div>${m.opened?`<small class="market-address">📍 ${esc(m.address||m.country)}</small>`:''}<div class="market-actions"><button class="smallbtn" onclick="meetingModal('${esc(m.country)}')">🤝 Митинг</button>${m.opened?(()=>{let o=S.offices.find(x=>x.country===m.country),p=o?((o.dailyRevenue||0)-(o.dailyCost||o.cost)):0;return `<small class="office-profit ${p<0?'loss':'profit'}">${p<0?'−':'+'}${money(Math.abs(p))}/день</small>`})():''}</div></article>`}
function marketProblemPanel(){let p=S.marketProblems?.[0];if(!p)return '';let labels=['','Появилась','Усиливается','Серьёзная','Критическая','Аварийная'],tone=p.stage>=4?'bad':p.stage>=2?'warn':'normal';return `<button class="market-problem ${tone}" onclick="marketProblemModal('${esc(p.id)}')"><span class="problem-pulse">●</span><span class="problem-copy"><b>${esc(labels[Math.min(5,p.stage)])} проблема рынка · ${esc(p.title)}</b><small>${esc(p.body)} · нажми, чтобы выбрать решение</small></span><span class="problem-level">${p.stage}/5</span></button>`}function sideNews(){return `<section class="panel market-news-panel"><div class="panel-head"><div><div class="eyebrow">Сигналы и риски рынка</div><h2>Важные новости</h2></div><span class="tag">LIVE</span></div>${marketProblemPanel()}${S.news.slice(0,4).map(n=>`<div class="news-item"><span class="news-dot ${n.type==='warn'?'warn':n.type==='bad'?'red':''}"></span><p>${esc(n.text)}<small>День ${n.day}</small></p></div>`).join('')}</section>`}function createMarketProblem(){S.marketProblems=S.marketProblems||[];if(S.marketProblems.length>=2)return;let pool=[['Сбой облачного сервиса','Часть клиентов сообщает о медленной загрузке файлов.'],['Недовольство ценой подписки','Несколько крупных клиентов сравнивают наши тарифы с конкурентами.'],['Очередь в службе поддержки','Ответы клиентам стали приходить медленнее обычного.'],['Перегрузка команды','Сотрудники сообщают, что сроки нескольких задач совпали.'],['Падение спроса на рынке','Новый отчёт показывает снижение интереса к текущему предложению.']];let item=pool[Math.floor(Math.random()*pool.length)],problem={id:'mp-'+S.day+'-'+Math.floor(Math.random()*9999),title:item[0],body:item[1],stage:1,nextEscalation:S.day+3,started:S.day};S.marketProblems.unshift(problem);news(`Проблема рынка: ${problem.title}. Пока это ранний сигнал; проверь новости и выбери действие.`, 'warn');save()}function advanceMarketProblems(){S.marketProblems=S.marketProblems||[];if(!S.marketProblems.length){if(S.day>4&&S.day%9===0&&Math.random()<.55)createMarketProblem();return}for(let p of S.marketProblems){if(S.day>=p.nextEscalation&&p.stage<5){p.stage++;p.nextEscalation=S.day+3;let loss=800*p.stage;S.revenue=Math.max(0,S.revenue-loss);S.reputation=Math.max(0,S.reputation-(p.stage>=3?2:1));news(`Проблема усилилась: «${p.title}» достигла уровня ${p.stage}/5. Потери дохода выросли, пора принять решение.`,p.stage>=4?'bad':'warn');if(p.stage===4&&prefs.pauseOnCritical){S.paused=true;save();setTimeout(()=>marketProblemModal(p.id),0)}}}}function marketProblemModal(id){let p=S.marketProblems.find(x=>x.id===id)||S.marketProblems[0];if(!p)return;let loss=800*p.stage;modal(`Рынок · проблема ${p.stage}/5`, `<div class="problem-detail"><div class="eyebrow">${p.stage>=4?'НУЖНО ДЕЙСТВОВАТЬ':'СИГНАЛ ТРЕБУЕТ ВНИМАНИЯ'}</div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><p>Проблема возникла в день ${p.started}. Каждые три игровых дня она усиливается, уменьшает доход и репутацию. Текущий ущерб: около ${money(loss)} в день.</p><p>Выбери, что делать:</p><button class="choice" onclick="resolveMarketProblem('${esc(p.id)}','team')"><b>Поручить команде разобраться</b><span>Руководитель снизит проблему на один уровень и сообщит итог.</span></button><button class="choice" onclick="resolveMarketProblem('${esc(p.id)}','budget')"><b>Срочно выделить бюджет · $50 000</b><span>Закрыть эту проблему сейчас и восстановить часть репутации.</span></button></div>`,`<button class="btn secondary" onclick="closeModal()">Пока наблюдать</button>`)}function resolveMarketProblem(id,method){let p=S.marketProblems.find(x=>x.id===id);if(!p)return closeModal();if(method==='budget'){if(S.money<50000)return toast('Нужно $50 000 для срочного решения');S.money-=50000;addTransaction('Срочное решение: '+p.title,-50000,'🧰');S.reputation=Math.min(100,S.reputation+2);S.marketProblems=S.marketProblems.filter(x=>x!==p);news(`Команда устранила проблему «${p.title}» за счёт срочного бюджета.`,'good')}else{p.stage--;p.nextEscalation=S.day+4;if(p.stage<=0){S.marketProblems=S.marketProblems.filter(x=>x!==p);S.reputation=Math.min(100,S.reputation+2);news(`Команда решила проблему «${p.title}».`,`good`)}else news(`Руководители занялись проблемой «${p.title}»: острота снизилась до ${p.stage}/5.`,'good')}closeModal();save();render()}
function sideTeam(){return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Руководители</div><h2>Связь с командой</h2></div><button class="smallbtn" onclick="tabTo('leadership')">Все чаты →</button></div>${S.employees.length?S.employees.slice(0,3).map(e=>`<div class="staff-card"><div class="avatar portrait-box">${portrait(e)}</div><div style="flex:1"><h3>${esc(e.name)}</h3><p>${esc(e.role)} · навык ${e.skill}</p></div><button class="smallbtn" onclick="openLeaderChat('${esc(e.name)}')">Написать</button></div>`).join(''):'<p class="empty">Пока нет руководителей. После первого заказа нанимай людей во вкладке «Анкеты».</p>'}<button class="btn secondary" style="width:100%" onclick="tabTo('leadership')">Открыть чат с руководством</button></section>`}

function setProjectFocus(id){S.projectFocus=id;render();save()}
function projectStageCost(p){return p.id==='founder'?100000:p.id==='cloud'?125000:p.id==='ai'?200000:p.id==='edge'?280000:185000}

function advanceProject(id){let p=S.projects.find(x=>x.id===id);if(!p||p.progress>=100)return;let stageCost=projectStageCost(p);if(S.money<stageCost)return toast(`Недостаточно средств: этап стоит ${money(stageCost)}`);S.money-=stageCost;p.budget=Math.max(0,p.budget-stageCost);p.progress=Math.min(100,p.progress+18);p.status=p.progress>=70?'Тестирование':'Разработка';addTransaction('Этап проекта: '+p.name,-stageCost,'🧩');if(p.progress===100){p.status='Запущен';S.revenue+=1800;S.reputation=Math.min(100,S.reputation+2);if(S.bootstrapMode&&p.id==='founder')S.productLevel=Math.max(1,S.productLevel);news(`Проект ${p.name} завершён и готов к запуску.`,'good');toast('Проект готов к запуску!');checkContracts();updateFounderCampaign();updateFounderCampaign()}else{news(`${p.name}: команда завершила очередной этап работы.`,'good');toast('Этап проекта завершён')}render();save()}
function markets(){let opened=S.markets.filter(m=>m.opened);return `<section class="panel map-panel"><div class="panel-head"><div><div class="eyebrow">Офисы и рынки</div><h2>Глобус «Техноимперии»</h2><p>Вращай стрелками ← → ↑ ↓, нажимай на страны или ищи город</p></div><span class="tag good">${opened.length} офисов · ${S.markets.length} стран</span></div><div class="globe-toolbar"><label class="globe-search">🔎 <input id="globe-search" type="search" placeholder="Найти страну, город или офис…" oninput="filterMarketList(this.value)"></label><div class="globe-controls"><button class="iconbtn" onclick="zoomGlobe(-.15)" title="Уменьшить глобус">−</button><button class="iconbtn zoom-readout" onclick="zoomGlobe(0)" title="Сбросить масштаб">${Math.round((S.globeZoom||1)*100)}%</button><button class="iconbtn" onclick="zoomGlobe(.15)" title="Приблизить глобус">＋</button><button class="iconbtn" onclick="rotateGlobe(-24)" title="Повернуть влево">↶</button><button class="iconbtn" onclick="rotateGlobe(24)" title="Повернуть вправо">↷</button><button class="iconbtn" onclick="tiltGlobe(8)" title="Наклонить вверх · ↑">↑</button><button class="iconbtn" onclick="tiltGlobe(-8)" title="Наклонить вниз · ↓">↓</button></div></div>${worldMap()}<div class="map-summary"><div class="map-stat"><b>${opened.length}</b><span>офисов открыто</span></div><div class="map-stat"><b>${fmt(S.markets.filter(m=>m.opened).reduce((a,m)=>a+m.clients,0))}</b><span>клиентов на рынках</span></div><div class="map-stat"><b>${S.markets.filter(m=>!m.opened).length}</b><span>стран для экспансии</span></div></div></section>${S.meetings?.length?`<section class="panel meeting-panel"><div class="panel-head"><div><div class="eyebrow">🤝 Деловые поездки</div><h2>Запланированные митинги</h2><p>Команда готовится к переговорам в выбранных странах</p></div></div><div class="list">${S.meetings.map(mt=>`<div class="row"><div><b>${esc(mt.city)}, ${esc(mt.country)}</b><p>${mt.agenda==='clients'?'Встреча с клиентами':mt.agenda==='partners'?'Переговоры с партнёрами':'Подбор местной команды'}</p></div><span class="tag">День ${mt.day}</span></div>`).join('')}</div></section>`:''}<section class="panel"><div class="panel-head"><div><div class="eyebrow">Страны и города</div><h2>Где открыть следующий офис</h2><p>Выбери рынок — изучи спрос и стоимость, затем создай местную команду</p></div><button class="btn secondary" onclick="researchMarket()">🔎 Исследовать рынок</button></div><div class="market" id="market-directory">${S.markets.map(marketCard).join('')}</div></section>`}
function globePoint(lat,lon){let phi=lat*Math.PI/180,delta=(lon-(S.globeRotation||0))*Math.PI/180,tilt=(S.globeTilt||0)*Math.PI/180,cosPhi=Math.cos(phi),x=cosPhi*Math.sin(delta),y=Math.sin(phi)*Math.cos(tilt)-cosPhi*Math.cos(delta)*Math.sin(tilt),z=Math.sin(phi)*Math.sin(tilt)+cosPhi*Math.cos(delta)*Math.cos(tilt);return{x:450+220*x,y:270-212*y,front:z>-.015}}const continentShapes=[[[-168,70],[-150,68],[-140,60],[-130,55],[-128,48],[-124,42],[-117,33],[-108,29],[-105,24],[-97,19],[-90,19],[-86,23],[-82,25],[-80,30],[-75,35],[-70,42],[-62,48],[-56,52],[-62,59],[-78,63],[-95,68],[-120,73],[-145,72]],[[-81,12],[-73,9],[-68,2],[-73,-8],[-70,-17],[-66,-25],[-63,-35],[-68,-48],[-74,-55],[-78,-42],[-80,-25],[-78,-10]],[[-12,36],[-9,43],[-2,48],[5,52],[9,56],[20,60],[31,59],[39,54],[33,47],[29,42],[23,38],[16,36],[9,39],[2,41],[-4,38]],[[-17,34],[-5,36],[10,37],[25,33],[34,28],[42,13],[50,11],[43,1],[40,-10],[32,-20],[28,-34],[17,-35],[12,-28],[8,-16],[3,-7],[-6,4],[-15,14]],[[-10,36],[0,37],[10,35],[20,33],[28,37],[35,43],[48,48],[60,54],[80,58],[100,69],[123,62],[143,53],[151,45],[142,39],[134,32],[124,24],[116,19],[108,9],[99,7],[91,19],[82,9],[76,11],[72,20],[64,24],[57,29],[48,32],[42,39],[34,37],[28,34],[21,36],[14,38],[6,36]],[[-8,59],[-5,55],[-2,51],[2,50],[0,55]],[[-180,66],[-165,70],[-150,64],[-145,58],[-155,55],[-168,58]],[[-73,83],[-42,82],[-25,75],[-42,60],[-55,59],[-66,68]],[[112,-11],[130,-10],[145,-16],[153,-27],[146,-39],[132,-44],[115,-35],[113,-24]],[[48,-13],[50,-17],[47,-25],[44,-22]],[[-180,-72],[-120,-75],[-60,-78],[0,-80],[60,-78],[120,-75],[180,-72]]];function globeLand(){return continentShapes.map(poly=>{let visible=poly.map(([lon,lat])=>globePoint(lat,lon)).filter(p=>p.front);if(visible.length<3)return '';return `<path d="M${visible.map(p=>`${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' L')} Z"/>`}).join('')}function globeGraticule(){let paths=[];function runs(points){let run=[];for(let p of points){if(p.front)run.push(p);else if(run.length>1){paths.push(`<path d="M${run.map(q=>`${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' L')}"/>`);run=[]}else run=[]}if(run.length>1)paths.push(`<path d="M${run.map(q=>`${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' L')}"/>`)}for(let lat of [-60,-30,0,30,60])runs(Array.from({length:61},(_,i)=>globePoint(lat,-180+i*6)));for(let lon=-180;lon<180;lon+=30)runs(Array.from({length:31},(_,i)=>globePoint(-88+i*(176/30),lon)));return `<g class="globe-graticule">${paths.join('')}</g>`}
function worldMap(){let open=S.markets.filter(m=>m.opened),routes=open.slice(1).map(m=>{let a=globePoint(open[0].lat,open[0].lon),b=globePoint(m.lat,m.lon);return `<path class="route" d="M${a.x} ${a.y} Q450 35 ${b.x} ${b.y}"/>`}).join('');let pins=S.markets.map(m=>{let p=globePoint(m.lat,m.lon);return `<g class="office-pin ${m.opened?'':'available'}" opacity="${p.front?'1':'.12'}" style="pointer-events:${p.front?'auto':'none'}" transform="translate(${p.x} ${p.y})" onclick="mapClick('${esc(m.country)}')"><circle r="${m.opened?8:6}"/><circle r="15" fill="none" stroke="${m.opened?'#168d81':'#5c7183'}" stroke-opacity=".4"/><text class="pin-label" x="11" y="-10">${esc(m.city)}${m.opened?' · офис':''}</text></g>`}).join('');return `<svg class="world-map globe-svg" viewBox="0 0 900 540" role="img" aria-label="Вращающийся глобус с офисами и рынками" onwheel="globeWheel(event)"><defs><clipPath id="globeClip"><circle cx="450" cy="270" r="230"/></clipPath><radialGradient id="globeOcean" cx="34%" cy="28%"><stop stop-color="#71afd0"/><stop offset=".62" stop-color="#21658a"/><stop offset="1" stop-color="#09243b"/></radialGradient><radialGradient id="globeShade" cx="35%" cy="28%"><stop offset="55%" stop-color="#fff" stop-opacity="0"/><stop offset="84%" stop-color="#132c44" stop-opacity=".12"/><stop offset="100%" stop-color="#071a30" stop-opacity=".48"/></radialGradient><radialGradient id="globeGlow" cx="30%" cy="23%"><stop stop-color="#fff" stop-opacity=".3"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient><filter id="globeShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#66869d" flood-opacity=".28"/></filter></defs><rect width="900" height="540" rx="22" fill="#05070b"/><g class="globe-zoom" transform="translate(450 270) scale(${S.globeZoom||1}) translate(-450 -270)"><g class="globe-spin"><g class="globe-surface"><g filter="url(#globeShadow)"><circle cx="450" cy="270" r="234" fill="url(#globeOcean)"/><g clip-path="url(#globeClip)"><g class="globe-fallback-land">${globeLand()}</g>${globeGraticule()}${routes}${pins}<circle cx="450" cy="270" r="230" fill="url(#globeShade)" pointer-events="none"/><circle cx="450" cy="270" r="230" fill="url(#globeGlow)" pointer-events="none"/></g><circle cx="450" cy="270" r="231" fill="none" stroke="#fff" stroke-width="2" opacity=".86"/></g></g></g></g><text x="450" y="526" text-anchor="middle" fill="#a7b9cc" font-size="11">Дальняя сторона затемнена · вращай стрелками ← → ↑ ↓ или экранными кнопками</text></svg><div class="map-legend"><span class="tag good">● Офис компании</span><span class="tag">○ Город доступен для открытия</span><span class="tag">↶↷ Поворот глобуса</span></div>`}
function zoomGlobe(delta){S.globeZoom=delta===0?1:Math.max(.8,Math.min(1.65,Math.round(((S.globeZoom||1)+delta)*100)/100));render();save()}function globeWheel(e){e.preventDefault();zoomGlobe(e.deltaY<0?.08:-.08)}function rotateGlobe(deg){S.globeRotation=((S.globeRotation||0)+deg+360)%360;render();save()}function tiltGlobe(deg){S.globeTilt=Math.max(-28,Math.min(28,(S.globeTilt||0)+deg));render();save()}function handleGlobeKeys(e){if(appScreen!=='game'||S.selectedTab!=='markets'||$('#modal-root')?.innerHTML||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;let keys={ArrowLeft:()=>S.globeRotation=((S.globeRotation||0)-14+360)%360,ArrowRight:()=>S.globeRotation=((S.globeRotation||0)+14)%360,ArrowUp:()=>S.globeTilt=Math.min(28,(S.globeTilt||0)+8),ArrowDown:()=>S.globeTilt=Math.max(-28,(S.globeTilt||0)-8)};if(keys[e.key]){e.preventDefault();keys[e.key]();render();save()}}
function filterMarketList(q){let term=q.trim().toLocaleLowerCase('ru');document.querySelectorAll('#market-directory .market-card').forEach(card=>card.style.display=card.dataset.search?.includes(term)?'':'none')}
function mapClick(country){let m=S.markets.find(x=>x.country===country);if(!m)return;if(!m.opened){openMarket(country);return}openOfficeDetail(country)}
function competitorView(){return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Общая карта рынка</div><h2>Конкуренты</h2><p>Следите за новостями, сравнивайте цены и решайте, бороться или объединяться</p></div><span class="tag">${S.competitors.length} активных компаний</span></div><div class="list">${S.competitors.map((c,i)=>`<div class="row"><div class="row-main"><div class="avatar purple">${c.emoji}</div><div><h3>${esc(c.name)}</h3><p>${c.country} · ${c.style} · цена $${c.price}/мес.</p><div class="bar" style="width:180px"><i style="width:${Math.min(100,c.share*3)}%"></i></div><small style="color:var(--muted)">${c.share}% доли рынка</small></div></div><div class="row-actions"><button class="smallbtn" onclick="compete(${i})">Сравнить</button><button class="smallbtn" onclick="acquire(${i})">Обсудить покупку</button></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">Стратегия</div><h2>Рыночные действия</h2><p>Отвечайте на шаги конкурентов подходящим способом</p></div></div><div class="grid3"><button class="btn secondary" onclick="priceResponse()">💰 Настроить цену</button><button class="btn secondary" onclick="startCampaign()">📣 Усилить продвижение</button><button class="btn secondary" onclick="generation()">🧪 Улучшить продукт</button></div></section>`}
function compete(i){let c=S.competitors[i];modal(`Сравнение · ${esc(c.name)}`,`<p>${esc(c.name)} ведёт себя как <b>${esc(c.style)}</b> и удерживает ${c.share}% рынка. Их тариф стоит $${c.price}/мес., ваш — $${S.productPrice}/мес.</p><p>Последние действия конкурента доступны в новостях рынка. Можно привлечь клиентов рекламой, улучшить продукт или изменить цену.</p>`,`<button class="btn secondary" onclick="closeModal()">Понятно</button><button class="btn" onclick="closeModal();startCampaign()">Запустить рекламу</button>`)}function priceResponse(){modal('Цена подписки',`<p>Текущая цена ${esc(S.product)} — $${S.productPrice}/мес. Снижение цены может привлечь больше клиентов, но уменьшит доход с каждого пользователя.</p><button class="choice" onclick="changePrice(2)"><b>💸 Снизить до $${Math.max(5,S.productPrice-3)}</b><span>Повысить конверсию, сократить доход на пользователя</span></button><button class="choice" onclick="changePrice(0)"><b>⚖️ Оставить $${S.productPrice}</b><span>Сохранить текущую стратегию</span></button><button class="choice" onclick="changePrice(-2)"><b>⭐ Повысить до $${S.productPrice+3}</b><span>Увеличить доход, проверить готовность клиентов платить</span></button>`)}function changePrice(dir){S.productPrice=Math.max(5,S.productPrice+(dir===2?-3:dir===-2?3:0));if(dir===2){S.users+=350;S.revenue=Math.max(10000,S.revenue-2200)}if(dir===-2){S.revenue+=1800;S.users=Math.max(1000,S.users-90)}news(`Компания изменила цену ${S.product} на $${S.productPrice}/мес.`);closeModal();render();save();toast('Цена обновлена')}
function acquisitionPrice(c){return Math.max(6000000,5000000+Math.round(c.share*600000))}function acquire(i){let c=S.competitors[i];if(!c)return;let reserve=acquisitionPrice(c);modal(`Договор о покупке · ${esc(c.name)}`,`<div class="acquisition-paper"><div class="paper-heading">ДОГОВОР О НАМЕРЕНИЯХ И АУКЦИОНЕ</div><p><b>Покупатель:</b> ${esc(S.company)}<br><b>Компания на продаже:</b> ${esc(c.name)} · ${esc(c.country)}</p><p><b>Стартовая цена:</b> ${money(reserve)}. Это цена начала торгов; окончательная сумма может вырасти, если другой конкурент предложит больше.</p><p>После подписания компания участвует в открытом аукционе. Конкуренты могут перебить ставку примерно в половине торговых раундов. Деньги спишутся только при победе. Подписывая бумагу, ты подтверждаешь готовность торговаться до указанной ставки.</p><div class="paper-sign">Подпись покупателя: <b>${esc(S.company)}</b> <span>✍</span></div></div>`,`<button class="btn secondary" onclick="closeModal()">Не подписывать</button><button class="btn gold" onclick="signAcquisitionAgreement(${i},${reserve})">Подписать и начать аукцион · ${money(reserve)}</button>`)}function signAcquisitionAgreement(i,reserve){if(S.money<reserve){closeModal();return toast(`Для участия нужно не меньше ${money(reserve)}`)}S.acquisitionAuction={companyIndex:i,reserve,ourBid:0,rivalBid:0,rivalName:'',round:0};submitAcquisitionBid(reserve)}function showAcquisitionAuction(){let a=S.acquisitionAuction;if(!a)return;let c=S.competitors[a.companyIndex];if(!c){S.acquisitionAuction=null;closeModal();return}let next=a.rivalBid?Math.ceil(a.rivalBid*1.12):a.reserve;let affordable=S.money>=next;modal(`Аукцион · ${esc(c.name)}`,`<div class="acquisition-paper"><div class="paper-heading">ДОГОВОР ПОДПИСАН · РАУНД ${a.round}</div><p>Твоя последняя ставка: <b>${a.ourBid?money(a.ourBid):'ещё не сделана'}</b></p>${a.rivalBid?`<p class="auction-outbid">${esc(a.rivalName)} перебил ставку и предлагает <b>${money(a.rivalBid)}</b>.</p><p>Чтобы продолжить, подними ставку минимум до <b>${money(next)}</b>. Деньги спишутся только при победе.</p>`:`<p>Подтверди стартовую ставку. Другой конкурент может перебить её в этом раунде.</p>`}<div class="paper-sign">Лот: ${esc(c.name)} · Начальная цена: ${money(a.reserve)}</div></div>`,`<button class="btn secondary" onclick="cancelAcquisitionAuction()">Уступить аукцион</button><button class="btn gold" onclick="submitAcquisitionBid(${next})" ${affordable?'':'disabled'}>${a.rivalBid?'Перебить ставку':'Сделать стартовую ставку'} · ${money(next)}</button>`)}function submitAcquisitionBid(amount){let a=S.acquisitionAuction;if(!a)return;let c=S.competitors[a.companyIndex];if(!c)return cancelAcquisitionAuction();if(amount>(S.money||0))return toast('На такую ставку не хватает денег');if(a.rivalBid&&amount<=a.rivalBid)return toast('Новая ставка должна быть выше конкурента');a.ourBid=amount;a.rivalBid=0;a.round++;if(S.competitors.length>1&&Math.random()<.5){let bidders=S.competitors.filter((_,i)=>i!==a.companyIndex),r=bidders[Math.floor(Math.random()*bidders.length)];a.rivalName=r?.name||'другой конкурент';a.rivalBid=Math.ceil(amount*(1.1+Math.random()*.2));save();showAcquisitionAuction();return}let ix=a.companyIndex,winningBid=a.ourBid;S.acquisitionAuction=null;buyCompetitor(ix,winningBid)}function cancelAcquisitionAuction(){S.acquisitionAuction=null;closeModal();toast('Ты уступил аукцион; деньги не списаны')}function buyCompetitor(i,price){if(S.money<price){closeModal();return toast('Не хватает средств для оплаты сделки')}let c=S.competitors[i];if(!c)return closeModal();S.money-=price;S.marketShare=Math.min(55,S.marketShare+c.share*.55);S.users+=Math.floor(c.share*900);S.team+=12;S.expenses+=5000;S.revenue+=7000;addTransaction('Покупка компании '+c.name,-price,'🏢');news(`${c.name} выиграна на аукционе за ${money(price)}. Подписанный договор исполнен, объединение команд началось.`,'good');S.competitors.splice(i,1);closeModal();render();save();toast('Аукцион выигран · компания приобретена')}
const cityPhotos={'Москва':'https://images.unsplash.com/photo-1495542779398-9fec7dc7986c?auto=format&fit=crop&w=1400&q=85','Нью-Йорк':'https://images.unsplash.com/photo-1655923478764-dc557f11c497?auto=format&fit=crop&w=1400&q=85','Афины':'https://images.unsplash.com/photo-1683154167468-c89da751ea7b?auto=format&fit=crop&w=1400&q=85','Нью-Дели':'https://images.unsplash.com/photo-1623620321917-b998a12a651b?auto=format&fit=crop&w=1400&q=85','Мумбаи':'https://images.unsplash.com/photo-1643652283599-111612c6c02a?auto=format&fit=crop&w=1400&q=85','Лондон':'https://images.unsplash.com/photo-1618662062577-1e1483c7b6c4?auto=format&fit=crop&w=1400&q=85','Токио':'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1400&q=85','Париж':'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1400&q=85','Сан-Франциско':'https://images.unsplash.com/photo-1501594907352-04cda38ebc29?auto=format&fit=crop&w=1400&q=85','Сидней':'https://images.unsplash.com/photo-1506973035872-a4b3b678e9c7?auto=format&fit=crop&w=1400&q=85','Дубай':'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=1400&q=85','Сингапур':'https://images.unsplash.com/photo-1525625293386-3f8f99389edd?auto=format&fit=crop&w=1400&q=85','Берлин':'https://images.unsplash.com/photo-1560969184-10fe8719e047?auto=format&fit=crop&w=1400&q=85','Сан-Паулу':'https://images.unsplash.com/photo-1543059080-f9b1272213d5?auto=format&fit=crop&w=1400&q=85','Стокгольм':'https://images.unsplash.com/photo-1509356843151-3e7d96241e11?auto=format&fit=crop&w=1400&q=85','Сеул':'https://images.unsplash.com/photo-1538485399081-7191377e8241?auto=format&fit=crop&w=1400&q=85','Амстердам':'https://images.unsplash.com/photo-1512470876302-972faa2aa9a4?auto=format&fit=crop&w=1400&q=85','Мадрид':'https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=1400&q=85','Окленд':'https://images.unsplash.com/photo-1507699622108-4be3d6b4c2b?auto=format&fit=crop&w=1400&q=85','Кейптаун':'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?auto=format&fit=crop&w=1400&q=85','Сантьяго':'https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=1400&q=85','Варшава':'https://images.unsplash.com/photo-1519197924294-4ba991a11128?auto=format&fit=crop&w=1400&q=85','Милан':'https://images.unsplash.com/photo-1513584684374-8bab748fbf90?auto=format&fit=crop&w=1400&q=85','Торонто':'https://images.unsplash.com/photo-1603466184492-bf5edf2edb84?auto=format&fit=crop&w=1400&q=85','Мехико':'https://images.unsplash.com/photo-1518105779142-d975f22f1b0a?auto=format&fit=crop&w=1400&q=85'};function cityPhoto(city,index=0){return cityPhotos[city]||'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=1400&q=85'}function imageStyle(city,index=0){return `background-image:url('${cityPhoto(city,index)}') !important`}
function openOfficeTab(){officeInteriorActive=false;stopOfficeSounds();S.activeOffice=null;S.selectedTab='office';render();save()}function offices(){if(!Array.isArray(S.offices))S.offices=[];if(!Array.isArray(S.markets))S.markets=[];if(S.activeOffice&&!S.offices.some(o=>o.country===S.activeOffice&&o.open))S.activeOffice=null;if(officeInteriorActive)return officeInteriorView();if(S.activeOffice)return officeDetail();let list=S.offices.filter(o=>o.open),available=S.markets.filter(m=>!m.opened),net=S.revenue-S.expenses;let activeCards=list.map(o=>{let result=(o.dailyRevenue||0)-(o.dailyCost??o.cost??0);return `<article class="office-card" data-search="${esc((o.city+' '+o.country+' '+(o.address||'')).toLocaleLowerCase('ru'))}"><button type="button" class="office-cover" style="${imageStyle(o.city)}" onclick="openOfficeDetail('${esc(o.country)}')"><span class="office-cover-status">● ${result<0?'Требует внимания':'Работает'}</span><span class="office-cover-title"><small>${esc(o.country)}</small><b>${esc(o.city)}</b></span><span class="office-cover-arrow">↗</span></button><div class="office-card-body"><p class="office-card-address">📍 ${esc(o.address||o.city+', '+o.country)}</p><div class="office-card-stats"><div><small>Команда</small><b>${o.workers||0} чел.</b></div><div><small>Результат за день</small><b class="${result<0?'office-number-loss':'office-number-gain'}">${result<0?'−':'+'}${money(Math.abs(result))}</b></div></div><button class="btn secondary office-enter" type="button" onclick="openOfficeDetail('${esc(o.country)}')">Войти в офис <span>→</span></button></div></article>`}).join('');let marketCards=available.map(m=>{let e=officeEconomics(m),price=officeOpeningCost(m);return `<article class="office-card office-market-card" data-search="${esc((m.city+' '+m.country+' '+(m.address||'')).toLocaleLowerCase('ru'))}"><button type="button" class="office-cover" style="${imageStyle(m.city)}" onclick="openOfficeCard('${esc(m.country)}')"><span class="office-cover-status office-status-market">${m.freeOffice?'Бесплатный старт':'Новый рынок'}</span><span class="office-cover-title"><small>${esc(m.country)}</small><b>${esc(m.city)}</b></span><span class="office-cover-arrow">↗</span></button><div class="office-card-body"><p class="office-card-address">📍 ${esc(m.address||m.city+', '+m.country)}</p><div class="office-card-stats"><div><small>Спрос</small><b>${m.demand}/100</b></div><div><small>Прогноз / день</small><b class="${e.dailyProfit<0?'office-number-loss':'office-number-gain'}">${e.dailyProfit<0?'−':'+'}${money(Math.abs(e.dailyProfit))}</b></div></div><button class="btn ${m.freeOffice?'':'secondary'} office-enter" type="button" onclick="openOfficeCard('${esc(m.country)}')">${m.freeOffice?'Открыть бесплатно':'Посмотреть условия · '+money(price)} <span>→</span></button></div></article>`}).join('');return `<section class="panel office-directory-panel" id="office-directory"><div class="office-directory-heading"><div><div class="eyebrow">ГЛОБАЛЬНАЯ СЕТЬ</div><h2>Офисы и новые рынки</h2><p>Выбери работающий филиал, чтобы посмотреть его команду и управление. Открытие нового города начинается с его карточки.</p></div><div class="office-network-balance"><small>Баланс компании</small><b>${money(S.money)}</b><span>Итог за день ${net<0?'−':'+'}${money(Math.abs(net))}</span></div></div><div class="office-directory-tools"><label class="globe-search office-search">⌕ <input type="search" placeholder="Найти город, страну или адрес…" oninput="filterOfficeList(this.value)"></label><span class="tag good">${list.length} ${list.length===1?'офис работает':'офисов работают'}</span></div><div class="office-section-heading"><div><h3>Работающие филиалы</h3><span>Нажми на фотографию или кнопку, чтобы войти</span></div></div><div class="office-directory-grid">${activeCards||'<div class="office-empty"><b>Пока нет работающих офисов</b><span>Выбери город ниже. Первый офис в Москве можно открыть бесплатно.</span></div>'}</div><div class="office-section-heading office-ma function officeStaff(){let team=S.employees.filter(e=>e.officeCountry===S.activeOffice);return team.length?team:S.employees}function enterOfficeInterior(){let o=S.offices.find(x=>x.country===S.activeOffice&&x.open);if(!o)return toast('Сначала открой карточку работающего офиса');officeInteriorActive=true;officePlayer={x:50,y:87,target:null};startOfficeSounds();render();updateOfficePlayer();save()}function exitOfficeInterior(){officeInteriorActive=false;if(officeWalkTimer){clearInterval(officeWalkTimer);officeWalkTimer=null}stopOfficeSounds();render();save()}function officeStaffPoint(i){return{x:19+(i%4)*21,y:31+Math.min(3,Math.floor(i/4))*18}}function officeNearbyWorker(){let team=officeStaff(),best=null,bestDistance=Infinity;team.forEach((e,i)=>{let p=officeStaffPoint(i),d=Math.hypot((officePlayer.x-p.x)*.82,officePlayer.y-p.y);if(d<bestDistance){best=e;bestDistance=d}});return bestDistance<13?best:null}function updateOfficePlayer(){let marker=$('#office-player');if(marker){marker.style.left=officePlayer.x+'%';marker.style.top=officePlayer.y+'%'}let near=officeNearbyWorker(),prompt=$('#office-talk-prompt');if(prompt)prompt.innerHTML=near?`<span>💬 Ты рядом с <b>${esc(near.name)}</b></span><button class="btn" onclick="talkToOfficeWorker('${esc(near.name)}')">Поговорить о работе</button><small>Или нажми E</small>`:'<span>Пройдись по офису и подойди к сотруднику</span><small>WASD / стрелки · E — поговорить · Esc — выйти</small>'}function officeWalkStep(dx,dy){if(!officeInteriorActive)return;if(officeWalkTimer){clearInterval(officeWalkTimer);officeWalkTimer=null}officePlayer.target=null;officePlayer.x=Math.max(7,Math.min(93,officePlayer.x+dx));officePlayer.y=Math.max(13,Math.min(88,officePlayer.y+dy));updateOfficePlayer()}function walkOfficeToWorker(name){if(!officeInteriorActive)return;let e=officeStaff().find(x=>x.name===name);if(!e)return;let p=officeStaffPoint(officeStaff().indexOf(e));officePlayer.target={x:p.x,y:Math.min(83,p.y+11)};if(officeWalkTimer)clearInterval(officeWalkTimer);officeWalkTimer=setInterval(()=>{if(!officePlayer.target){clearInterval(officeWalkTimer);officeWalkTimer=null;return}let dx=officePlayer.target.x-officePlayer.x,dy=officePlayer.target.y-officePlayer.y,d=Math.hypot(dx,dy);if(d<2.4){officePlayer.x=officePlayer.target.x;officePlayer.y=officePlayer.target.y;officePlayer.target=null;clearInterval(officeWalkTimer);officeWalkTimer=null}else{officePlayer.x+=dx/d*2.2;officePlayer.y+=dy/d*2.2}updateOfficePlayer()},90)}function talkToOfficeWorker(name){let near=officeNearbyWorker();if(!near||near.name!==name){walkOfficeToWorker(name);return toast('Подойду к сотруднику. Когда окажусь рядом, нажми «Поговорить о работе».')}employeeModal(name)}function officeRoomKeys(e){if(!officeInteriorActive||$('#modal-root')?.innerHTML||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;let delta={ArrowUp:[0,-4],w:[0,-4],W:[0,-4],ArrowDown:[0,4],s:[0,4],S:[0,4],ArrowLeft:[-4,0],a:[-4,0],A:[-4,0],ArrowRight:[4,0],d:[4,0],D:[4,0]}[e.key];if(delta){e.preventDefault();officeWalkStep(delta[0],delta[1]);return}if(e.key==='e'||e.key==='E'){let near=officeNearbyWorker();if(near)talkToOfficeWorker(near.name)}if(e.key==='Escape')exitOfficeInterior()}function officeInteriorView(){let o=S.offices.find(x=>x.country===S.activeOffice&&x.open);if(!o){officeInteriorActive=false;return offices()}let team=officeStaff();let desks=team.map((e,i)=>{let p=officeStaffPoint(i);return `<div class="office-workstation" style="left:${p.x}%;top:${p.y}%"><div class="office-desk-surface"><span class="desk-monitor">▰</span><span class="desk-cup">☕</span></div><button type="button" class="office-worker" onclick="walkOfficeToWorker('${esc(e.name)}')"><span class="office-worker-face">${portrait(e)}</span><b>${esc(e.name)}</b><small>${esc(e.role)}</small><i>Подойти</i></button></div>`}).join('');return `<section class="office-inside-page"><div class="office-room-toolbar"><div><div class="eyebrow">${esc(o.city)} · РАБОЧИЙ ЭТАЖ</div><h2>Ты внутри офиса</h2><p>Пройдись по этажу, подойди к коллеге и заговори с ним.</p></div><div class="office-room-actions"><span class="office-sound-live">● Офис живёт</span><button class="btn secondary" onclick="exitOfficeInterior()">← Выйти из офиса</button></div></div><div class="office-room-frame"><div class="office-room" id="office-room"><div class="office-room-photo-label">ОТКРЫТОЕ ПРОСТРАНСТВО · РАБОЧИЙ ЭТАЖ</div><div class="office-room-ambient"><span><i class="ambient-light printer-light"></i>Принтер печатает</span><span><i class="ambient-light coffee-light"></i>Кофемашина</span><span><i class="ambient-light phone-light"></i>Входящий звонок</span><span><i class="ambient-light voices-light"></i>Разговоры команды</span></div><div class="office-room-workers">${desks||'<div class="office-empty"><b>Пока некому работать в этом офисе</b><span>Найми сотрудников и назначь их в этот филиал.</span></div>'}</div><button type="button" class="office-door" onclick="exitOfficeInterior()" title="Выйти из офиса"><span>🚪</span><b>Вход / выход</b></button><div class="office-player" id="office-player" style="left:${officePlayer.x}%;top:${officePlayer.y}%"><span>🧍</span><b>Ты</b></div><div class="office-talk-prompt" id="office-talk-prompt"></div></div></div><div class="office-room-lower"><div class="office-room-tip"><b>Как ходить</b><span>W A S D или стрелки на клавиатуре. Подойди к человеку и нажми E, чтобы начать разговор. На телефоне используй кнопки.</span></div><div class="office-dpad"><button onclick="officeWalkStep(0,-5)" aria-label="Вверх">↑</button><div><button onclick="officeWalkStep(-5,0)" aria-label="Влево">←</button><button onclick="officeWalkStep(0,5)" aria-label="Вниз">↓</button><button onclick="officeWalkStep(5,0)" aria-label="Вправо">→</button></div></div></div></section>`}function officeAudioTone(freq,duration,volume=.04,type='sine'){if(!officeAudioCtx||!officeAudioMaster)return;let now=officeAudioCtx.currentTime,osc=officeAudioCtx.createOscillator(),gain=officeAudioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),now+.04);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(officeAudioMaster);osc.start(now);osc.stop(now+duration+.02)}function officeAudioNoise(duration,frequency,volume=.025,kind='bandpass'){if(!officeAudioCtx||!officeAudioMaster)return;let size=Math.floor(officeAudioCtx.sampleRate*duration),buffer=officeAudioCtx.createBuffer(1,size,officeAudioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<size;i++)data[i]=Math.random()*2-1;let source=officeAudioCtx.createBufferSource(),filter=officeAudioCtx.createBiquadFilter(),gain=officeAudioCtx.createGain(),now=officeAudioCtx.currentTime;source.buffer=buffer;filter.type=kind;filter.frequency.value=frequency;filter.Q.value=kind==='bandpass'?.75:.3;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.08);gain.gain.setValueAtTime(volume,Math.max(now+.09,now+duration-.12));gain.gain.exponentialRampToValueAtTime(.0001,now+duration);source.connect(filter);filter.connect(gain);gain.connect(officeAudioMaster);source.start(now);source.stop(now+duration+.03)}function playOfficeAmbience(){if(!officeInteriorActive||!officeAudioCtx||!prefs.soundEffects)return;let r=Math.random();if(r<.28){officeAudioNoise(1.2+Math.random()*.7,650,.026,'bandpass');officeAudioTone(95+Math.random()*35,.9,.012,'triangle')}else if(r<.52){officeAudioNoise(.8+Math.random()*.8,900,.025,'lowpass');officeAudioTone(170+Math.random()*50,.35,.008,'sine')}else if(r<.72){officeAudioTone(430,.22,.034);setTimeout(()=>officeAudioTone(510,.3,.034),280);setTimeout(()=>officeAudioTone(430,.22,.034),720);officeAudioTone(76,1.1,.01,'sawtooth')}else{officeAudioNoise(.6+Math.random()*.6,520+Math.random()*500,.014,'bandpass');officeAudioTone(190+Math.random()*70,.28,.006,'sine');setTimeout(()=>officeAudioNoise(.45,700,.011,'bandpass'),360)}officeAudioTimer=setTimeout(playOfficeAmbience,2200+Math.random()*3200)}function startOfficeSounds(){if(!prefs.soundEffects)return;let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{if(officeAudioCtx){officeAudioCtx.resume?.();return}officeAudioCtx=new AC();officeAudioMaster=officeAudioCtx.createGain();officeAudioMaster.gain.value=Math.min(.7,Math.max(.12,Number(prefs.volume??.12)*3));officeAudioMaster.connect(officeAudioCtx.destination);officeAudioCtx.resume?.();officeAudioTimer=setTimeout(playOfficeAmbience,500)}catch{stopOfficeSounds()}}function stopOfficeSounds(){if(officeAudioTimer){clearTimeout(officeAudioTimer);officeAudioTimer=null}if(officeAudioCtx){let old=officeAudioCtx;officeAudioCtx=null;officeAudioMaster=null;try{old.close?.()}catch{}}}function setOfficeStyle(country,style){let o=S.offices.find(x=>x.country===country&&x.open);if(!o)return;if(o.style===style)return toast('Этот стиль уже установлен');let cost=300000;if(S.money<cost)return toast('Для смены интерьера нужно '+money(cost));S.money-=cost;o.style=style;addTransaction('Кастомизация офиса · '+o.city,-cost,'🎨');news('Обновлён интерьер офиса в '+o.city+'.','good');render();save();toast('Новый дизайн офиса готов')}
