];function hiringView(){let pool=applicantRoster.filter(c=>!S.employees.some(e=>e.name===c.name)&&S.applicantState[c.id]?.status!=='declined');return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">ВХОДЯЩИЕ ЗАЯВКИ</div><h2>Анкеты кандидатов</h2><p>Открой листок, сравни опыт и образование, затем найми, откажи или отправь человека на обучение. Плата за найм первых пяти выбранных сотрудников не взимается; зарплата остаётся.</p></div><span class="tag">${pool.length} заявок · бесплатно: ${Math.max(0,S.freeHiresRemaining||0)}</span></div><div class="applicant-grid">${pool.map(c=>{let trained=S.applicantState[c.id]?.trained,skill=c.skill+(trained?5:0);return `<article class="resume-card"><div class="resume-top"><span class="resume-photo">${portrait({name:c.name,photo:portraitPool[c.id]})}</span><div><div class="eyebrow">АНКЕТА №${String(c.id).padStart(3,'0')}</div><h3>${esc(c.name)}</h3><p>${esc(c.role)}</p></div><span class="resume-stamp">${trained?'ОБУЧЕН':'КАНДИДАТ'}</span></div><div class="resume-fields"><div><b>Год рождения</b><span>${c.birth}</span></div><div><b>Образование</b><span>${esc(c.education)}</span></div><div><b>Прошлая работа</b><span>${esc(c.previous)}</span></div><div><b>Навык / зарплата</b><span>${skill}/100 · ${money(c.cost)}/день</span></div><div class="resume-reason"><b>Почему стоит взять</b><span>${esc(c.reason)}</span></div></div><div class="resume-actions"><button class="btn" onclick="hireCandidate('${esc(c.name)}','${esc(c.role)}',${skill},${c.cost},${c.id})" ${S.money<(S.freeHiresRemaining>0?0:250000)?'disabled':''}>${S.freeHiresRemaining>0?'Выбрать бесплатно':'Принять · сбор '+money(250000)}</button><button class="btn secondary" onclick="trainApplicant(${c.id})" ${trained||S.money<70000?'disabled':''}>${trained?'Обучен ✓':'Обучить · '+money(70000)}</button><button class="smallbtn" onclick="declineApplicant(${c.id})">Отказать</button></div></article>`}).join('')||'<div class="empty">Новых анкет нет. Принятые кандидаты появятся во вкладке «Команда».</div>'}</div></section>`}function trainApplicant(id){let c=applicantRoster.find(x=>x.id===id);if(!c||S.applicantState[id]?.trained)return;if(S.money<70000)return toast('Обучение стоит '+money(70000));S.money-=70000;S.applicantState[id]={...(S.applicantState[id]||{}),trained:true};addTransaction('Подготовка кандидата: '+c.name,-70000,'🎓');news(c.name+' прошёл предварительное обучение и повысил навык.','good');render();save();toast('Кандидат обучен: +5 к навыку')}function declineApplicant(id){let c=applicantRoster.find(x=>x.id===id);S.applicantState[id]={...(S.applicantState[id]||{}),status:'declined'};news('Компания отказала кандидату '+c?.name+'.');render();save();toast('Анкета отклонена')}
function finance(){let marketDrag=(S.marketProblems||[]).reduce((sum,p)=>sum+p.stage*800,0),net=S.revenue-S.expenses-(S.idlePenalty||0)-marketDrag;return `<section class="panel"><div class="panel-head"><div><div class="eyebrow">Финансовый штаб</div><h2>Финансы компании</h2><p>Откройте полный отчёт, чтобы видеть доходы, расходы и прогноз на несколько месяцев</p></div><button class="btn secondary" onclick="financeReport()">Обновить отчёт</button></div><div class="grid3"><div class="market-card"><div class="eyebrow">Доход / день</div><h3 style="font-size:19px;color:var(--green)">${money(S.revenue)}</h3><p>Продукты и подписки</p></div><div class="market-card"><div class="eyebrow">Расход / день</div><h3 style="font-size:19px;color:var(--gold)">${money(S.expenses)}</h3><p>Команда, офисы, разработка, реклама${S.idlePenalty?` · штраф за бездействие ${money(S.idlePenalty)}/день`:''}${marketDrag?` · ущерб от проблем ${money(marketDrag)}/день`:''}</p></div><div class="market-card"><div class="eyebrow">Чистый результат</div><h3 style="font-size:19px;color:${net>=0?'var(--cyan)':'var(--red)'}">${money(net)}</h3><p>Прогноз: ${money(S.money+net*30)} через месяц · бездействие ${S.idleDays||0} дн.</p></div></div><div class="panel" style="margin:14px 0 0;background:#111a2a"><div class="panel-head"><div><div class="eyebrow">Денежный поток</div><h2 style="font-size:14px">Операционный результат</h2></div><span class="tag ${net>=0?'good':'bad'}">${net>=0?'Устойчиво':'Требует внимания'}</span></div>${chart()}</div></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">План действий</div><h2>Инструменты финансового управления</h2></div></div><div class="grid3"><button class="btn secondary" onclick="loan()">🏦 Запросить кредит</button><button class="btn secondary" onclick="investor()">🤝 Найти инвестора</button><button class="btn secondary" onclick="cutBudget()">✂️ Пересмотреть бюджет</button></div></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">История</div><h2>Последние операции</h2></div></div>${S.transactions.length?`<div class="list">${S.transactions.slice(0,5).map(t=>`<div class="row"><div class="row-main"><span>${t.icon}</span><div><h3>${esc(t.text)}</h3><p>День ${t.day}</p></div></div><b style="color:${t.amount>=0?'var(--green)':'var(--gold)'}">${money(t.amount)}</b></div>`).join('')}</div>`:'<div class="empty">Операции появятся здесь</div>'}</section>`}
function officeOpeningCost(m){return m.freeOffice?0:1400000+m.cost*9500}function marketStudyCost(m){return 75000+Math.round(m.cost*240)}function officeEconomics(m){let remote=['ЮАР','Австралия','Новая Зеландия'].includes(m.country),dailyRevenue=Math.round(m.demand*700),dailyCost=Math.round(m.cost*900+m.workers*250+(remote?20000:0));return{dailyRevenue,dailyCost,dailyProfit:dailyRevenue-dailyCost,remote}}
function meetingCost(m){return 15000+Math.round(m.cost*220)}
function meetingModal(country){let m=S.markets.find(x=>x.country===country);if(!m)return;let cost=meetingCost(m),agenda=[['clients','Клиенты','Обсудить пилотные проекты и привлечь заказчиков.'],['partners','Партнёры','Найти местного партнёра и каналы продаж.'],['talent','Команда','Провести встречи с кандидатами в местную команду.']];modal(`Митинг · ${m.city}, ${m.country}`,`<p>Организуй встречу с местными компаниями. Поездка и площадка стоят <b>${money(cost)}</b>. Итог встречи зависит от спроса и доступности специалистов в регионе.</p><p>Спрос: ${m.demand}/100 · специалисты: ${m.workers}/100</p>`,`<button class="btn secondary" onclick="closeModal()">Отмена</button>${agenda.map(([id,title,desc])=>`<button class="btn" onclick="scheduleMeeting('${esc(country)}','${id}')">🤝 ${title}<small style="display:block;font-weight:400">${desc}</small></button>`).join('')}`)}
function scheduleMeeting(country,agenda){let m=S.markets.find(x=>x.country===country),cost=meetingCost(m);if(!m)return;if(S.money<cost){closeModal();return toast('Недостаточно средств на поездку и проведение митинга')}S.money-=cost;let names={clients:'Клиенты',partners:'Партнёры',talent:'Команда'};S.meetings=S.meetings||[];S.meetings.push({country,city:m.city,agenda,day:S.day+2,cost});addTransaction(`Митинг в ${m.city}: ${names[agenda]}`,-cost,'🤝');news(`Подготовка к митингу в ${m.city}: делегация отправится через два игровых дня.`,'normal');closeModal();render();save();toast('Митинг запланирован на день '+(S.day+2))}
function resolveMeetings(){if(!S.meetings?.length)return;let due=S.meetings.filter(x=>x.day<=S.day);S.meetings=S.meetings.filter(x=>x.day>S.day);for(let mt of due){let m=S.markets.find(x=>x.country===mt.country);if(!m)continue;let chance=Math.min(.88,.3+m.demand*.004+m.workers*.001+(mt.agenda==='talent'?.08:0)),success=Math.random()<chance;if(success){S.meetingsWon=(S.meetingsWon||0)+1;if(mt.agenda==='clients'){let gained=900+Math.round(m.demand*27);S.users+=gained;S.revenue+=Math.round(1200+m.demand*20);S.reputation=Math.min(100,S.reputation+1);news(`Митинг в ${mt.city} прошёл успешно: новые заказчики и ${fmt(gained)} потенциальных пользователей.`,'good')}else if(mt.agenda==='partners'){S.revenue+=Math.round(1800+m.demand*22);S.reputation=Math.min(100,S.reputation+2);news(`В ${mt.city} найден местный партнёр. Продажи и репутация компании выросли.`,'good')}else{S.team+=3;S.expenses+=4800;news(`Митинг в ${mt.city} помог найти трёх подходящих специалистов. Расходы на команду выросли.`,'good')}}else{news(`Митинг в ${mt.city} не дал ожидаемого результата. Команда зафиксировала причины и подготовит другой подход.`,'warn')}}checkContracts()}
function restructureOffice(country){let o=S.offices.find(x=>x.country===country&&x.open);if(!o||o.restructured)return;if(S.money<300000)return toast('Реструктуризация стоит $300 000');let cut=Math.round(o.dailyCost*.24);o.dailyCost-=cut;o.cost=o.dailyCost;o.workers=Math.max(3,o.workers-2);S.team=Math.max(1,S.team-2);S.expenses=Math.max(0,S.expenses-cut);o.restructured=true;addTransaction(`Оптимизация офиса: ${o.city}`,-300000,'🛠️');S.money-=300000;news(`Офис в ${o.city} сократил ежедневные расходы на ${money(cut)} после реструктуризации.`,'good');render();save();toast('Расходы офиса снижены')}
function askCloseOffice(country){let o=S.offices.find(x=>x.country===country&&x.open);if(!o)return;modal(`Закрыть офис · ${o.city}?`,`<p>Офис приносит ${money(o.dailyRevenue||0)} дохода и обходится в ${money(o.dailyCost||o.cost)}/день. Закрытие остановит эти доходы и расходы. Команду придётся сократить.</p>`,`<button class="btn secondary" onclick="closeModal()">Оставить офис</button><button class="btn gold" onclick="divestOffice('${esc(country)}')">Закрыть офис</button>`)}
function divestOffice(country){let o=S.offices.find(x=>x.country===country&&x.open);if(!o)return;S.revenue=Math.max(0,S.revenue-(o.dailyRevenue||0));S.expenses=Math.max(0,S.expenses-(o.dailyCost||o.cost));S.team=Math.max(1,S.team-(o.workers||0));S.offices=S.offices.filter(x=>x!==o);let m=S.markets.find(x=>x.country===country);if(m)m.opened=false;S.activeOffice=null;S.selectedTab='office';addTransaction(`Закрытие офиса: ${o.city}`,0,'🏢');news(`Офис в ${o.city} закрыт. Ежедневные доходы и расходы больше не начисляются.`,'warn');closeModal();render();save()}

const contractData=[{id:'expand',title:'Открыть третий офис',desc:'Расширь сеть ещё на один рынок',goal:1,reward:35000,progress:()=>Math.max(0,S.offices.filter(o=>o.open).length-2)},{id:'meeting',title:'Заключить сделку на митинге',desc:'Проведи успешную встречу с клиентами или партнёрами',goal:1,reward:22000,progress:()=>S.meetingsWon||0},{id:'launch',title:'Вывести первый проект',desc:'Доведи любой проект до запуска',goal:1,reward:65000,progress:()=>S.projects.filter(p=>p.progress>=100).length}];
function checkContracts(){S.contractsClaimed=S.contractsClaimed||[];let changed=false;for(let c of contractData){if(!S.contractsClaimed.includes(c.id)&&c.progress()>=c.goal){S.contractsClaimed.push(c.id);S.money+=c.reward;S.reputation=Math.min(100,S.reputation+2);news(`Контракт выполнен: «${c.title}». Награда ${money(c.reward)} и +2 к репутации.`,'good');toast(`Контракт выполнен · +${money(c.reward)}`);changed=true}}return changed}
function contractBoard(){let done=S.contractsClaimed||[];return `<section class="panel contract-panel"><div class="panel-head"><div><div class="eyebrow">🎯 Цели для роста</div><h2>Контракты и награды</h2><p>Выполняй задачи, чтобы получать бонусы и открывать новые возможности</p></div><span class="tag good">${done.length}/${contractData.length} выполнено</span></div><div class="contract-grid">${contractData.map(c=>{let value=Math.min(c.goal,c.progress()),complete=done.includes(c.id);return `<article class="contract-card ${complete?'complete':''}"><div class="contract-icon">${complete?'✓':c.id==='expand'?'🌍':c.id==='meeting'?'🤝':'🚀'}</div><div class="contract-info"><b>${c.title}</b><p>${c.desc}</p><div class="progress"><i style="width:${complete?100:Math.round(value/c.goal*100)}%"></i></div><small>${complete?'Выполнено':`${value}/${c.goal}`} · награда ${money(c.reward)}</small></div></article>`}).join('')}</div></section>`}

function tabTo(t){if(officeInteriorActive){officeInteriorActive=false;stopOfficeSounds()}if(t==='office')S.activeOffice=null;S.selectedTab=t;render();save()}function addTransaction(text,amount,icon='💰'){S.transactions.unshift({text,amount,icon,day:S.day});S.transactions=S.transactions.slice(0,12)}
function modal(title,body,actions=''){let root=$('#modal-root');root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}<div class="modal-actions">${actions||'<button class="btn secondary" onclick="closeModal()">Закрыть</button>'}</div></div></div>`}function closeModal(){$('#modal-root').innerHTML=''}
function confirmReset(){modal(tx('Начать новую компанию?','Start a new company?','开始新公司？'),`<p>${tx('Начать новую игру? Сохранение останется доступно кнопкой «Продолжить».','Start a new run? Your existing save will remain available with Continue.','开始新的游戏吗？现有存档仍可通过继续游戏打开。')}</p>`,`<button class="btn secondary" onclick="closeModal()">${tx('Отмена','Cancel','取消')}</button><button class="btn" onclick="openCompanySetup()">${tx('Начать заново','Start over','重新开始')}</button>`)}

{tab:'office',title:{ru:'Войди в свой офис',en:'Step inside an office',zh:'进入办公室'},text:{ru:'Вкладка «Офис» — каталог филиалов. Нажми на большую карточку города, чтобы попасть внутрь. Там видны улица и страна, сотрудники, расходы и рабочее пространство. Нажми на фото человека, чтобы поговорить или дать поручение.',en:'The Offices tab is your branch directory. Select a city card to enter. You can see the street address, country, team, expenses, and workspace. Select a person’s portrait to talk or assign a task.',zh:'“办公室”标签页是分部目录。点击城市卡片即可进入。你可以查看街道地址、国家、团队、费用和工作空间。点击员工照片可交谈或分配任务。'}},

{tab:'leadership',title:{ru:'Чат с руководителями',en:'Talk to managers',zh:'与管理层聊天'},text:{ru:'Открой «Чат с руководством», выбери человека слева и напиши вопрос или поручение. Ответ останется в переписке. Если руководителя пока нет, найми его через вкладку «Анкеты».',en:'Open Leadership Chat, choose a manager on the left, and type a question or task. Replies stay in the conversation. If you have no managers yet, hire one from Applications.',zh:'打开“管理层聊天”，在左侧选择一位经理并发送问题或任务。回复会保留在对话中。若还没有经理，请在“申请”页招聘。'}},

function showTutorial(step=0){if(step===0)S.tutorialWasPaused=S.paused;S.paused=true;step=Math.max(0,Math.min(tutorialPages.length-1,step));S.tutorialStep=step;let p=tutorialPages[step],lang=prefs.language;S.selectedTab=p.tab;render();save();modal(tx('Знакомство с игрой','Game tutorial','游戏教程'),`<div class="tutorial-badge">${tx('ПОЛНЫЙ ТУР · ШАГ','FULL TOUR · STEP','完整教程 · 步骤')} ${step+1} / ${tutorialPages.length}</div><h3 style="font:700 17px Manrope;margin:0 0 8px">${p.title[lang]}</h3><p>${p.text[lang]}</p><div class="progress"><i style="width:${Math.round((step+1)/tutorialPages.length*100)}%"></i></div>`,`<div class="tutorial-actions"><button class="tutorial-skip" onclick="skipTutorial()">${tx('Пропустить тур','Skip tutorial','跳过教程')}</button><button class="btn" onclick="tutorialNext()">${step===tutorialPages.length-1?tx('Завершить','Finish','完成'):tx('Дальше →','Next →','下一步 →')}</button></div>`)}
function tutorialNext(){let n=(S.tutorialStep||0)+1;if(n>=tutorialPages.length){S.onboarded=true;S.paused=S.tutorialWasPaused??false;delete S.tutorialWasPaused;save();closeModal();toast(tx('Тур завершён — удачной игры!','Tutorial complete. Have fun!','教程完成，祝你玩得开心！'));return}showTutorial(n)}

function openLeaderChat(name){S.activeLeaderChat=name;S.chatMode='direct';S.selectedTab='leadership';render();save()}function setChatMode(mode){S.chatMode=mode;S.selectedTab='leadership';render();save()}const teamTalkWork=['Макеты готовы к проверке. Кто возьмёт первый просмотр?','Клиент прислал хорошие замечания по новой версии — добавил их в план.','Нашёл небольшую ошибку в тестах; исправлю до конца дня.','Поставил задачу в общий список, чтобы не потерялась.','Давайте на короткой встрече сверим сроки и не будем спешить с релизом.','Посмотрел отчёт: пользователи чаще всего просят сделать настройку проще.'];const teamTalkLife=['По дороге слушал подкаст и придумал, как объяснить новую функцию проще.','Кто-то знает хорошее место рядом, где можно спокойно пообедать?','Сегодня наконец выспался — сразу легче сосредоточиться.','В выходные готовил новое блюдо, оказалось проще, чем казалось.','Кофе закончился перед планёркой. Поставил новую пачку на кухне 🙂','После работы собираюсь пройтись пешком — весь день просидел за ноутбуком.','Кто-нибудь уже смотрел новый сезон сериала? Без спойлеров, пожалуйста.','Принёс в офис печенье, оставил на кухне для всех.'];function teamChatPush(from,text,topic='Работа'){S.teamChat=S.teamChat||[];S.teamChat.push({from,text,topic,day:S.day});S.teamChat=S.teamChat.slice(-70)}function seedTeamChat(){if(S.teamChat.length||!S.employees.length)return;[['Работа','Начал разбирать задачи на неделю. Если есть срочное — напишите сюда.'],['Быт','Поставил чайник на кухне, кому налить?'],['Работа','В отчёте увидел пару идей по улучшению продукта, посмотрю подробнее.']].forEach((x,i)=>teamChatPush(S.employees[i%S.employees.length].name,x[1],x[0]))}function teamChatTick(){if(!S.employees?.length||S.paused)return;if(!S.teamChat?.length)seedTeamChat();if(S.teamConflict&&S.day>=S.teamConflict.resolveDay){let [a,b]=S.teamConflict.names;teamChatPush(a,'Я всё обдумал. Мы оба хотим сделать хороший продукт, просто по-разному видим сроки. Извини за резкость.','Примирение');teamChatPush(b,'Спасибо, что написал. Я тоже перегнул палку. Давай спокойно сверим план и работать дальше вместе.','Примирение');S.teamConflict=null;return}if(S.teamConflict)return;if(S.employees.length>1&&Math.random()<.018){let a=S.employees[Math.floor(Math.random()*S.employees.length)],others=S.employees.filter(x=>x.name!==a.name),b=others[Math.floor(Math.random()*others.length)];teamChatPush(a.name,'Не согласен с таким сроком. Если выпустить без проверки, потом сами будем разгребать ошибки.','Спор');teamChatPush(b.name,'Мы уже отстаём от плана. Давайте не превращать каждую задачу в бесконечное обсуждение.','Спор');S.teamConflict={names:[a.name,b.name],resolveDay:S.day+2+Math.floor(Math.random()*3)};return}if(S.day%2!==0||Math.random()>.78)return;let e=S.employees[Math.floor(Math.random()*S.employees.length)],life=Math.random()<.38,voice=employeeVoice(e),line=life?voice.life:voice.work;teamChatPush(e.name,`${e.name}: ${line} ${voice.signature}`,life?'Быт':'Работа')}function employeeVoice(e){let styles=[{work:'Я сначала проверю цифры и принесу короткий вывод.',life:'Я сегодня выбрался на прогулку после работы — очень помогло переключиться.',signature:'Давайте решим по данным.'},{work:'Уже набросал вариант решения. Могу показать команде после обеда.',life:'Сегодня по дороге слушал музыку и наконец нашёл хороший плейлист.',signature:'Сделаю аккуратно и проверю ещё раз.'},{work:'Я бы разбил это на маленькие шаги, так проще увидеть прогресс.',life:'На выходных хочу приготовить что-нибудь новое. Есть проверенный рецепт?',signature:'Маленький шаг тоже движение.'},{work:'Поговорил с парой коллег: у нас есть два хороших варианта.',life:'Кофе сегодня спас утро. Кто хочет, принесу ещё завтра.',signature:'Давайте сначала договоримся о плане.'},{work:'Я посмотрю, как это повлияет на клиентов, и вернусь с конкретикой.',life:'После работы собираюсь позвонить семье, давно не болтали.',signature:'Важно, чтобы решение помогало людям.'},{work:'Есть мысль: можно сделать проще function launchProduct(){if(S.productProgress<70)return toast('Сначала завершите больше этапов разработки');modal('Запуск продукта',`<p>Подготовьте запуск ${esc(S.product)} на выбранных рынках.</p><button class="choice" onclick="launchNow()"><b>🌍 США и Германия</b><span>Узнаваемый рынок · $50 000 на кампанию</span></button><button class="choice" onclick="launchJapan()"><b>🇯🇵 Япония</b><span>Высокий спрос · $84 000 на локализацию и запуск</span></button>`)}function launchNow(){if(S.money<50000)return closeModal(),toast('Недостаточно средств на запуск');S.money-=50000;S.users+=900;S.revenue+=5000;S.reputation=Math.min(100,S.reputation+4);S.productProgress=0;addTransaction('Запуск продукта на рынках США и Германии',-50000,'🚀');news(`${S.product} запущен в США и Германии. Первые клиенты уже подключаются.`,'good');closeModal();render();save();toast('Продукт запущен!')}function launchJapan(){let cost=84000,m=S.markets.find(x=>x.country==='Япония');if(!m)return closeModal(),toast('Рынок Японии пока недоступен');if(S.money<cost)return toast('Для запуска в Японии нужно '+money(cost));S.money-=cost;m.clients+=1300;S.users+=1300;S.revenue+=8000;S.marketShare=Math.min(55,S.marketShare+1.4);S.reputation=Math.min(100,S.reputation+5);S.productProgress=0;addTransaction('Локализация и запуск в Японии',-cost,'🇯🇵');news(`${S.product} запущен в Японии. Первые клиенты подключаются.`,'good');closeModal();render();save();toast('Запуск в Японии завершён')}
function generation(){let generationCost=1200000;if(S.money<generationCost)return toast(`Новое поколение стоит ${money(generationCost)}`);modal('Новое поколение продукта',`<p>Переведите ${esc(S.product)} на более современные технологии и улучшенные функции.</p>`,`<button class="btn secondary" onclick="closeModal()">Позже</button><button class="btn" onclick="makeGeneration()">Начать · $1 200 000</button>`)}function makeGeneration(){let generationCost=1200000;S.money-=generationCost;S.productLevel++;S.productProgress=0;S.productBudget=1200000;S.reputation=Math.min(100,S.reputation+2);addTransaction('Новое поколение '+S.product,-generationCost,'🚀');news(`Начата разработка поколения ${S.productLevel} продукта.`);closeModal();render();save();toast('Новое поколение в разработке')}
function openOfficeCard(country){let m=S.markets.find(x=>x.country===country);if(!m)return;if(m.freeOffice&&!m.opened){openOffice(country);return}openMarket(country)}function openMarket(country){let m=S.markets.find(x=>x.country===country);if(!m)return;if(m.opened){toast('Этот рынок уже открыт');return}let econ=officeEconomics(m),profit=econ.dailyProfit;modal(`Изучение рынка · ${m.country}`,`<p><b>${m.city}</b> · спрос ${m.demand}/100 · доступность специалистов ${m.workers}/100 · стоимость ведения бизнеса ${m.cost}/100.</p><p>Прогноз офиса: доход <b>${money(econ.dailyRevenue)}/день</b>, расходы <b>${money(econ.dailyCost)}/день</b>, результат <b style="color:${profit<0?'#c9475b':'#25865b'}">${profit<0?'убыток':'прибыль'} ${money(Math.abs(profit))}/день</b>${econ.remote?' · повышенные расходы на логистику и удалённость':''}.</p><p>Исследование рынка стоит ${money(marketStudyCost(m))}. ${m.freeOffice?'Открытие офиса бесплатно; ежедневные расходы остаются обычными.':`Открытие офиса потребует ${money(officeOpeningCost(m))} на запуск и найм команды.`}</p>`,`<button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="studyAndOpen('${m.country}')">Исследовать · ${money(marketStudyCost(m))}</button><button class="btn gold" onclick="openOffice('${m.country}')">${m.freeOffice?'Открыть бесплатно':'Открыть офис'}</button>`)}function studyAndOpen(country){let m=S.markets.find(x=>x.country===country);if(!m)return;let researchCost=marketStudyCost(m);if(S.money<researchCost){closeModal();return toast('Недостаточно средств')}S.money-=researchCost;m.studied=true;addTransaction('Исследование рынка '+country,-researchCost,'🔎');news(`Исследование ${country}: высокий спрос, рекомендуем локальную команду.`,'good');closeModal();render();save();toast('Исследование завершено')}function openOffice(country){let m=S.markets.find(x=>x.country===country);if(!m)return;let econ=officeEconomics(m),cost=officeOpeningCost(m);if(S.money<cost){closeModal();return toast('Недостаточно средств для открытия офиса')}S.money-=cost;m.opened=true;m.clients=Math.floor(500+m.demand*32);S.users+=m.clients;S.team+=8;S.offices.push({city:m.city,country:m.country,address:m.address||`${m.city}, ${m.country}`,workers:8,cost:econ.dailyCost,dailyRevenue:econ.dailyRevenue,dailyCost:econ.dailyCost,dailyProfit:econ.dailyProfit,emoji:m.country==='Россия'?'🇷🇺':'🏙️',market:m.demand,open:true,freeOffice:!!m.freeOffice});S.expenses+=econ.dailyCost;S.revenue+=econ.dailyRevenue;S.marketShare=Math.min(50,S.marketShare+1.1);S.scenarioProgress=Math.min(100,S.scenarioProgress+38);addTransaction(m.freeOffice?'Бесплатный офис: '+m.city:'Открытие офиса: '+m.city,-cost,m.freeOffice?'🇷🇺':'🏢');news(m.freeOffice?`Офис в ${m.city} открыт бесплатно. Ежедневные расходы и доходы начались.`:`Офис в ${m.city} открыт! Набрана местная команда, рынок доступен.`,'good');checkContracts();closeModal();render();save();toast('Новый рынок открыт!')}
function researchMarket(){let unopened=S.markets.filter(m=>!m.opened);if(!unopened.length)return toast('Все рынки уже открыты');let m=unopened[0],cost=marketStudyCost(m);if(S.money<cost)return toast('Недостаточно средств');S.money-=cost;m.studied=true;news(`Исследование рынка ${m.country}: спрос ${m.demand}/100, локальные расходы ${m.cost}/100.`,'good');addTransaction('Исследование '+m.country,-cost,'🔎');render();save();toast(`${m.country}: спрос ${m.demand}/100, таланты ${m.workers}/100`)}
function startCampaign(){if(S.campaign>0)return toast('Рекламная кампания уже идёт');let campaignCost=100000;if(S.money<campaignCost)return toast(`Кампания стоит ${money(campaignCost)}`);S.money-=campaignCost;S.campaign=5;S.campaignDays=0;addTransaction('Рекламная кампания',-campaignCost,'📣');news('Запущена онлайн-кампания с блогерами для привлечения клиентов.','good');render();save();toast('Кампания запущена на 5 дней')}
function train(name){let e=S.employees.find(x=>x.name===name);if(!e)return;let trainingCost=120000;if(S.money<trainingCost)return toast(`Курс стоит ${money(trainingCost)}`);S.money-=trainingCost;e.skill=Math.min(100,e.skill+5);S.training.push(name);addTransaction('Курс обучения: '+name,-trainingCost,'🎓');news(`${name} завершил короткий курс и повысил навык.`,'good');render();save();toast('Навык повышен на 5 пунктов')}
function bonus(){let e=S.employees[0];if(!e)return toast('Сначала найми сотрудника');let bonusCost=30000;if(S.money<bonusCost)return toast('Бонус стоит $30 000');S.money-=bonusCost;e.mood=Math.min(100,e.mood+9);addTransaction('Бонус: '+e.name,-bonusCost,'⭐');news(`Руководитель рекомендовал бонус для ${e.name} за вклад в продукт.`,'good');render();save();toast('Бонус одобрен')}
function raise(){modal('Рекомендация о повышении',`<p>Руководитель разработки рекомендует повысить Лео Мюллера до директора инженерного направления.</p><div class="row"><div class="row-main"><span>⭐</span><div><h3>Достижения</h3><p>Ускорил синхронизацию и стабилизировал выпуск обновлений</p></div></div></div><p>Дополнительные расходы: $2 000 в день.</p>`,`<button class="btn secondary" onclick="closeModal()">Отложить до пересмотра</button><button class="btn" onclick="approveRaise()">Проверить бюджет</button>`)}function approveRaise(){S.expenses+=2000;let e=S.employees.find(x=>x.name==='Лео Мюллер');if(e)e.role='Директор инженерного направления';closeModal();render();save();toast('Повышение одобрено — $2 000/день')}
function financeReport(){modal('Финансовый прогноз',`<p>На ближайшие 3 игровых месяца:</p><div class="row"><span>Доходы по текущему плану</span><b style="color:var(--green)">${money(S.revenue*90)}</b></div><div class="row" style="margin-top:8px"><span>Расходы по текущему плану</span><b style="color:var(--gold)">${money(S.expenses*90)}</b></div><div class="row" style="margin-top:8px"><span>Ожидаемый остаток</span><b>${money(S.money+(S.revenue-S.expenses)*90)}</b></div><p>Рекомендация финансового отдела: сохранять рекламный бюджет, завершить текущий этап разработки и отложить крупные офисные расходы.</p>`)}function loan(){modal('Предложение банка',`<p>Банк предлагает кредит $150 000 на 90 игровых дней. Ставка — 12%. Выплата долга и процентов будет учтена в ежедневных расходах.</p>`,`<button class="btn secondary" onclick="closeModal()">Отказаться</button><button class="btn" onclick="takeLoan()">Принять кредит</button>`)}function takeLoan(){S.money+=150000;S.expenses+=3500;addTransaction('Банковский кредит',150000,'🏦');news('Получен кредит банка на развитие компании. Платежи включены в расходы.','warn');closeModal();render();save();toast('Кредит получен')}
function investor(){modal('Предложения инвесторов',`<p>Выберите инвестора по сумме и доле компании, которую он просит.</p><button class="choice" onclick="takeInvestment(200000,10)"><b>Northstar Capital · $200 000</b><span>Доля 10% · фокус на международном росте</span></button><button class="choice" onclick="takeInvestment(120000,6)"><b>Foundry Ventures · $120 000</b><span>Доля 6% · опыт в продуктовой разработке</span></button>`)}function takeInvestment(amount,equity){S.money+=amount;addTransaction('Инвестиции (доля '+equity+'%)',amount,'🤝');news(`Инвестор вложил ${money(amount)} в развитие компании.`,'good');closeModal();render();save();toast('Инвестиция получена')}
function cutBudget(){modal('Пересмотр расходов',`<p>Сократить бюджет разработки на $8 000 в день? Работа над обновлением станет медленнее, но план сохранится.</p>`,`<button class="btn secondary" onclick="closeModal()">Оставить как есть</button><button class="btn" onclick="applyCut()">Сократить бюджет</button>`)}function applyCut(){S.expenses=Math.max(0,S.expenses-8000);S.productProgress=Math.max(0,S.productProgress-2);addTransaction('Сокращение бюджета разработки',0,'✂️');closeModal();render();save();toast('Расходы снижены, разработка замедлится')}

const takeoverLegalFee=240000;
function showTakeoverModal(){let rival=S.competitors.find(c=>c.name===S.takeoverPending);if(!rival)return;let canSue=S.money>=takeoverLegalFee,company=esc(S.company||'компанию');$('#modal-root').innerHTML=`<div class="overlay takeover-overlay"><div class="modal takeover-modal"><div class="eyebrow">ВРАЖДЕБНЫЙ ВЫКУП · СРОЧНО</div><h2>${esc(rival.name)} забирает компанию</h2><p>${esc(rival.name)} объявила о покупке ${company}. У тебя есть два пути.</p><div class="takeover-choice"><b>⚖️ Подать иск</b><span>Суд займёт 4 игровых дня и стоит ${money(takeoverLegalFee)}. Если выиграешь, компанию вернут. Шанс победы: ${Math.round(S.takeoverOdds*100)}%.</span></div><div class="takeover-choice danger"><b>🚪 Пропустить суд</b><span>Конкурент оставит компанию себе. Ты потеряешь компанию и останешься с $0.</span></div><div class="modal-actions"><button class="btn secondary" onclick="abandonCompanyToRival()">Пропустить суд · потерять всё</button><button class="btn" onclick="fileTakeoverLawsuit()" ${canSue?'':'disabled'}>Подать в суд · ${money(takeoverLegalFee)}</button></div>${canSue?'':'<small class="takeover-warning">На счету не хватает на адвоката. Можно отказаться от суда.</small>'}</div></div>`}
function maybeOfferTakeover(){if(S.takeoverResolved||S.takeoverPending||S.lawsuit||S.gameOver||S.campaignComplete||S.day<30||S.day%15!==0)return;let ready=S.bootstrapMode?(S.firstCustomerDone&&(S.users>=2000||S.productLevel>=1)):(S.revenue>=25000&&S.marketShare>=4);if(!ready)return;let chance=prefs.difficulty==='hard'?.42:prefs.difficulty==='easy'?.18:.28;if(Math.random()>=chance)return;let rivals=S.competitors||[];if(!rivals.length)return;let rival=rivals[Math.floor(Math.random()*rivals.length)];S.takeoverPending=rival.name;S.takeoverOdds=Math.max(.2,Math.min(.88,.36+S.reputation*.006+S.marketShare*.006+(prefs.difficulty==='easy'?.1:prefs.difficulty==='hard'?-.12:0)));S.paused=true;news(`${rival.name} объявила о враждебном выкупе компании. Реши: судиться или отдать компанию.`, 'bad');save();showTakeoverModal()}
function fileTakeoverLawsuit(){if(!S.takeoverPending)return; if(S.money<takeoverLegalFee)return toast('Для подачи иска нужно '+money(takeoverLegalFee));S.money-=takeoverLegalFee;addTransaction('Подача иска против '+S.takeoverPending,-takeoverLegalFee,'⚖️');S.lawsuit={rival:S.takeoverPending,resolveDay:S.day+4,odds:S.takeoverOdds};S.takeoverPending=null;S.paused=false;news(`Иск против ${S.lawsuit.rival} принят судом. Решение ожидается через 4 игровых дня.`, 'warn');closeModal();save();render();toast('Судебное дело началось')}
function abandonCompanyToRival(){let rival=S.competitors.find(c=>c.name===S.takeoverPending),name=S.company||'Твоя компания';S.lostCompanyName=name;S.lostToRival=rival?.name||'конкурент';S.company='';S.money=0;S.revenue=0;S.expenses=0;S.users=0;S.team=0;S.offices=[];S.employees=[];S.projects=[];S.lawsuit=null;S.takeoverPending=null;S.takeoverResolved=true;S.takeoverOutcome='lost';S.gameOver=true;S.paused=true;S.gameOverReason=`Ты отказался от суда. ${S.lostToRival} сохранила компанию ${name}, а твой баланс обнулён.`;closeModal();save();render()}
function resolveTakeoverLawsuit(){let c=S.lawsuit;if(!c)return;S.lawsuit=null;S.takeoverResolved=true;if(Math.random()<c.odds){S.takeoverOutcome='won';S.takeoverPending=null;S.money+=200000;S.reputation=Math.min(100,S.reputation+8);addTransaction('Компенсация суда и возврат компании',200000,'⚖️');news(`Суд встал на твою сторону: ${c.rival} обязана вернуть компанию и выплатить компенсацию.`, 'good');S.paused=false;updateFounderCampaign();save();render();toast('Ты выиграл суд — компания возвращена')}else{let name=S.company||'Твоя компания';S.lostCompanyName=name;S.lostToRival=c.rival;S.company='';S.money=0;S.revenue=0;S.expenses=0;S.users=0;S.team=0;S.offices=[];S.employees=[];S.projects=[];S.takeoverOutcome='lost';S.gameOver=true;S.paused=true;S.gameOverReason=`Суд отказал в иске. ${c.rival} оставила компанию ${name}, баланс обнулён.`;save();render()}}

function employeeEvent(){if(S.marketProblems?.length)return;createMarketProblem()}function resolveCrisis(choice){let c=S.crisis;if(choice===2&&S.money>=30000){S.money-=30000;addTransaction('Реакция на кризис',-30000,'🧰');S.reputation=Math.min(100,S.reputation+1);news(`Кризис «${c.title}» удалось смягчить ресурсами.`,'good');toast('Ресурсы направлены на решение')}else if(choice===1){let leader=S.employees[1]||S.employees[0];if(leader)leader.mood=Math.min(100,leader.mood+3);news(`Руководитель готовит план решения: ${c.title}.`,'warn');toast('Запрошен план руководителя')}else{S.reputation=Math.max(0,S.reputation-3);S.revenue=Math.max(10000,S.revenue-2500);news(`Пока компания собирала данные, последствия «${c.title}» усилились.`,'bad');toast('Проблема усилилась')}S.crisis=null;closeModal();render();save()}
function togglePause(){S.paused=!S.paused;render();save()}function setSpeed(s){S.speed=s;render();save()}function tick(){if(S.paused||S.gameOver||S.campaignComplete)return;S.day++;if(S.lawsuit&&S.day>=S.lawsuit.resolveDay){resolveTakeoverLawsuit();return;}if(S.activeThisTick){S.activeThisTick=false;S.idleDays=0;S.idlePenalty=Math.max(0,(S.idlePenalty||0)-4500)}else{S.idleDays=(S.idleDays||0)+1;if(S.idleDays>=4){let idleScale=prefs.difficulty==='hard'?1.45:prefs.difficulty==='easy'?.7:1;S.idlePenalty=(S.idlePenalty||0)+Math.round((1200+(S.idleDays-4)*350)*idleScale);if(S.idleDays>=8){let churn=Math.max(10,Math.floor(S.users*.004));S.users=Math.max(0,S.users-churn);S.revenue=Math.max(0,S.revenue-Math.ceil(churn*.8));S.reputation=Math.max(0,S.reputation-(S.idleDays%3===0?2:1));S.marketShare=Math.max(.1,S.marketShare-.035);S.competitors.forEach(c=>c.share=Math.min(60,c.share+(prefs.difficulty==='hard'?.035:prefs.difficulty==='easy'?.008:.015)));if(S.idleDays%4===0)news('Клиенты уходят к конкурентам: команда давно не принимала важных решений. Запусти маркетинговую кампанию или улучши продукт.','bad')}else if(S.idleDays%3===1)news('Инвесторы обеспокоены бездействием: растут постоянные расходы на координацию и содержание компании.','warn')}}resolveMeetings();teamChatTick();advanceMarketProblems();let difficulty=prefs.difficulty||'normal',incomeFactor=difficulty==='easy'?1.12:difficulty==='hard'?.9:1,expenseFactor=difficulty==='easy'?.9:difficulty==='hard'?1.2:1,growthFactor=difficulty==='easy'?1.35:difficulty==='hard'?.72:1;let marketDrag=(S.marketProblems||[]).reduce((sum,p)=>sum+p.stage*800,0),net=S.revenue*incomeFactor-S.expenses*expenseFactor-(S.idlePenalty||0)-marketDrag;S.money+=net;S.users+=Math.max(0,Math.floor(S.users*(S.campaign?0.0027:0.0012)*growthFactor));S.marketShare=Math.min(48,Math.max(.1,S.marketShare+(Math.random()*(prefs.difficulty==='hard'?.12:.16)-(prefs.difficulty==='hard'?.04:.035))));S.productProgress=Math.min(100,S.productProgress+(S.bootstrapMode&&!S.firstCustomerDone?0:(S.productBudget>0?2:1)));if(S.campaign>0){S.campaign--;S.campaignDays++;S.users+=Math.floor(400+Math.random()*300);S.revenue+=350;if(S.campaign===0)news(`Рекламная кампания завершена: +${S.campaignDays*600} пользователей.`,'good')}if(S.day%3===0){S.revenue+=Math.floor(Math.random()*700);if(Math.random()<(prefs.difficulty==='hard'?.42:prefs.difficulty==='easy'?.15:.25)&&S.competitors.length){let c=S.competitors[Math.floor(Math.random()*S.competitors.length)];news(`${c.name}: ${Math.random()<.5?'выпустила обновление своего продукта':'расширила рекламную кампанию'} в ${c.country}.`,'warn')}}if(S.day%6===0){S.expenses+=Math.floor(Math.random()*900);if(Math.random()<.32)employeeEvent()}if(S.money<0){if(S.day%3===0)S.reputation=Math.max(0,S.reputation-1);if(S.day%5===0)news('Денежный запас отрицательный. Финансовый отдел рекомендует пересмотреть бюджет до следующего отчёта.','bad')}if(S.money<=-600000||(S.money<=-250000&&S.reputation<=0)){S.gameOver=true;S.paused=true;S.gameOverReason=S.money<=-600000?'Компания не смогла покрыть обязательства и объявила о банкротстве.':'Клиенты потеряли доверие, а средств на восстановление больше нет.';save();render();return}if(S.money>1000000&&S.scenarioProgress<100)S.scenarioProgress=Math.min(100,S.scenarioProgress+2);checkContracts();updateFounderCampaign();maybeOfferTakeover();save();if(document.activeElement?.id!=='help-question')render()}
function markPlayerActive(){if(appScreen==='game'&&!S.gameOver)S.activeThisTick=true}if(document.addEventListener){document.addEventListener('pointerdown',markPlayerActive,{passive:true});document.addEventListener('keydown',markPlayerActive);document.addEventListener('keydown',officeRoomKeys);document.addEventListener('keydown',handleGlobeKeys)}setInterval(()=>{for(let i=0;i<S.speed;i++)tick()},6500);render();
</script></body></html>
